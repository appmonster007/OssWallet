    if (total) body += `<div style="font-size:0.78rem;color:var(--text-muted);margin-top:8px;text-align:right">${total} total</div>`;
    return body;
  }

  const cashFlowComparisonMetric = {};
  function renderCashFlowComparisonBody(d, cardId, metric) {
    const current=d.current||[], previous=d.previous||[], lastYear=d.lastYear||[];
    if (!current.length) return '<p class="empty-state">No comparison data.</p>';
    const m = metric || cashFlowComparisonMetric[cardId] || 'net';
    const getVal = (p,key) => key==='income'?(p.income||0):key==='expense'?(p.expense||0):(p.net||0);
    const prevByMs = Object.fromEntries(previous.map(p=>[p.epochMillis, getVal(p,m)]));
    const lyByMs   = Object.fromEntries(lastYear.map(p=>[p.epochMillis, getVal(p,m)]));
    const series = [
      { name:'Current',   color:'#1976D2', opacity:1,    labels:current.map(p=>p.label||''), points:current.map(p=>getVal(p,m)) },
      { name:'Previous',  color:'#FF9800', opacity:0.7,  labels:current.map(p=>p.label||''), points:current.map(p=>prevByMs[p.epochMillis]??0) },
      { name:'Last Year', color:'#4CAF50', opacity:0.6,  labels:current.map(p=>p.label||''), points:current.map(p=>lyByMs[p.epochMillis]??0) },
    ].filter(s=>s.points.some(v=>v!==0));
    if (!series.length) return '<p class="empty-state">No comparison data.</p>';
    const toggleId = cardId ? `cfcm-${esc(cardId)}` : '';
    const toggleHtml = cardId ? `<div style="display:flex;gap:6px;margin-bottom:10px">
      ${['net','income','expense'].map(opt=>`<button class="btn btn-sm ${m===opt?'btn-primary':'btn-ghost'}" onclick="(function(){cashFlowComparisonMetric['${esc(cardId)}']='${opt}';document.getElementById('card-body-${esc(cardId)}').innerHTML=renderCashFlowComparisonBody(cachedCfcData&&cachedCfcData['${esc(cardId)}']||{current:[],previous:[],lastYear:[]},'${esc(cardId)}','${opt}');})()">${opt.charAt(0).toUpperCase()+opt.slice(1)}</button>`).join('')}
    </div>` : '';
    return `${toggleHtml}${svgLineChart(series,560,160)}<div class="chart-legend" style="margin-top:10px">${series.map(s=>`<div class="legend-item"><div class="legend-dot" style="background:${esc(s.color)}"></div><span>${esc(s.name)}</span></div>`).join('')}</div>`;
  }

  function renderCategorySpendingTrendBody(d) {
    const buckets = d.buckets||[];
    if (!buckets.length) return '<p class="empty-state">No spending trend data.</p>';
    const allCats = [...new Set(buckets.flatMap(b=>(b.categories||[]).map(c=>c.categoryName)))];
    const colorMap = {}; allCats.forEach((name,i)=>{ colorMap[name]=CHART_COLORS[i%CHART_COLORS.length]; });
    const catTotals = {};
    buckets.forEach(b=>(b.categories||[]).forEach(c=>{ catTotals[c.categoryName]=(catTotals[c.categoryName]||0)+Math.abs(c.amount||0); }));
    const catNature = {};
    buckets.forEach(b=>(b.categories||[]).forEach(c=>{ if(c.nature) catNature[c.categoryName]=c.nature; }));
    const topCats = Object.entries(catTotals).sort((a,b)=>b[1]-a[1]).slice(0,8);
    let legend = '<div class="chart-legend" style="margin-top:12px">';
    topCats.forEach(([name,total])=>{
      const nature = catNature[name] || '';
      const natureCls = nature==='MUST'?'badge-must':nature==='NEED'?'badge-need':nature==='WANT'?'badge-want':'';
      legend+=`<div class="legend-item"><div class="legend-dot" style="background:${esc(colorMap[name]||'#9e9e9e')}"></div><span>${esc(name)}</span>${nature?`<span class="badge ${natureCls}" style="font-size:0.68rem;margin-left:4px">${esc(nature)}</span>`:''}<span style="color:var(--text-muted);margin-left:4px">${fmtRaw(total)}</span></div>`;
    });
    legend += '</div>';
    return `${svgStackedBarsChart(buckets,colorMap,560,140)}${legend}`;
  }

  function renderTagUpSetPlotBody(d, baseCur) {
    const sets=d.sets||[], inters=d.intersections||[];
    const cur = baseCur || cachedSettings.baseCurrency || '';
    if (!sets.length) return '<p class="empty-state">No tag data.</p>';
    const maxAmt = Math.max(...sets.map(s=>Math.abs(s.totalAmount||0)),1);
    let body = '<div style="margin-bottom:16px">';
    sets.forEach(s => {
      const pct = Math.min(100, Math.round(Math.abs(s.totalAmount||0)/maxAmt*100));
      const isInc = (s.totalAmount||0) >= 0;
      body += `<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;align-items:center;font-size:0.85rem;margin-bottom:3px;gap:8px"><span style="font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.tagName)}</span><span class="amount-income" style="font-size:0.78rem">+${fmt(s.income||0,cur)}</span><span class="amount-expense" style="font-size:0.78rem">−${fmt(s.expense||0,cur)}</span><span style="color:var(--text-muted);font-size:0.78rem;white-space:nowrap">${s.transactionCount||0} txns</span></div><div class="progress-track"><div class="progress-fill ${isInc?'progress-green':'progress-orange'}" style="width:${pct}%"></div></div></div>`;
    });
    body += '</div>';
    if (inters.length) {
      body += `<div style="font-size:0.85rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px">Top Intersections</div><div class="table-wrap"><table><thead><tr><th>Tags</th><th style="text-align:right">Amount</th><th style="text-align:right">Income</th><th style="text-align:right">Expense</th><th>Txns</th></tr></thead><tbody>`;
      inters.slice(0,10).forEach(inter => {
        const bdgs=(inter.tags||[]).map(t=>`<span class="badge" style="background:var(--surface2);color:var(--text);font-size:0.7rem">${esc(t)}</span>`).join(' ');
        body+=`<tr><td>${bdgs}</td><td style="text-align:right">${fmt(Math.abs(inter.amount||0),cur)}</td><td style="text-align:right" class="amount-income">+${fmt(inter.income||0,cur)}</td><td style="text-align:right" class="amount-expense">−${fmt(inter.expense||0,cur)}</td><td>${inter.transactionCount||0}</td></tr>`;
      });
      body += '</tbody></table></div>';
    }
    return body;
  }

  /* ══════════════════════════════════════════════════════
     PAGE: Records

  async function renderRecords() {
    const params      = new URLSearchParams(location.hash.split('?')[1] || '');
    const accountId   = params.get('accountId') || '';
    const accountName = params.get('accountName') ? decodeURIComponent(params.get('accountName')) : '';
    let page          = parseInt(params.get('page') || '0', 10);
    if (isNaN(page) || page < 0) page = 0;
    const type        = params.get('type') || '';
    const dateFrom    = params.get('dateFrom') || '';
    const dateTo      = params.get('dateTo') || '';
    const categoryId  = params.get('categoryId') || '';
    const minAmount   = params.get('minAmount') || '';
    const maxAmount   = params.get('maxAmount') || '';
    const status      = params.get('status') || '';
    const payee       = params.get('payee') || '';
    const filtersOpen = params.get('filtersOpen') === '1';

    showSpinner();
    try {
      let url = `/api/transactions?page=${page}&limit=25`;
      if (accountId)  url += `&accountId=${encodeURIComponent(accountId)}`;
      if (type)       url += `&type=${encodeURIComponent(type)}`;
      if (dateFrom)   url += `&dateFrom=${encodeURIComponent(dateFrom)}`;
      if (dateTo)     url += `&dateTo=${encodeURIComponent(dateTo)}`;
      if (categoryId) url += `&categoryId=${encodeURIComponent(categoryId)}`;
      if (minAmount)  url += `&minAmount=${encodeURIComponent(minAmount)}`;
      if (maxAmount)  url += `&maxAmount=${encodeURIComponent(maxAmount)}`;
      if (status)     url += `&status=${encodeURIComponent(status)}`;
      if (payee)      url += `&payee=${encodeURIComponent(payee)}`;

      const json = await apiFetch(url);
      if (!json.success) { showError('Failed to load records.'); return; }
      const data = json.data || { items: [], total: 0, page: 0, limit: 25, hasMore: false };
      const title = accountName ? `Records — ${esc(accountName)}` : 'Records';

      /* build current param string (without page) for filter apply */
      function buildFilterHref(overrides) {
        const p = new URLSearchParams();
        if (accountId)  p.set('accountId', accountId);
        if (accountName) p.set('accountName', accountName);
        Object.entries(overrides).forEach(([k, v]) => { if (v) p.set(k, v); else p.delete(k); });
        p.set('page', '0');
        return '#/records?' + p.toString();
      }

      /* count active filters for button badge */
      const filterKeys = [type, accountId, dateFrom, dateTo, categoryId, minAmount, maxAmount, status, payee];
      const activeFilterCount = filterKeys.filter(Boolean).length;
      const filterBtnLabel = `⚙️ Filters${activeFilterCount ? ` (${activeFilterCount})` : ''}`;
      const filterBtnCls   = activeFilterCount ? 'btn btn-ghost btn-sm btn-filter-active' : 'btn btn-ghost btn-sm';

      /* date quick-select helpers */
      const today = new Date(); today.setHours(0,0,0,0);
      const fmtD  = d => d.toISOString().slice(0,10);
      const todayStr      = fmtD(today);
      const weekStartStr  = fmtD(new Date(today.getTime() - today.getDay()*86400000));
      const monthStartStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-01`;
      const last30Str     = fmtD(new Date(today.getTime() - 29*86400000));

      /* account options for filter */
      const accFilterOpts = cachedAccounts.map(a =>
        `<option value="${esc(a.id)}" ${accountId===a.id?'selected':''}>${esc(a.name)} (${esc(a.currency)})</option>`
      ).join('');

      /* ── Filter panel ─ */
      const fPanel = `<div class="filter-panel${filtersOpen ? '' : ' hidden'}" id="filter-panel">
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">
          <span style="font-size:0.75rem;color:var(--text-muted);align-self:center;padding-right:4px">Quick:</span>
          <button class="btn btn-ghost btn-sm" style="font-size:0.78rem;padding:4px 10px" onclick="setDateQuick('${todayStr}','${todayStr}')">Today</button>
          <button class="btn btn-ghost btn-sm" style="font-size:0.78rem;padding:4px 10px" onclick="setDateQuick('${weekStartStr}','${todayStr}')">This Week</button>
          <button class="btn btn-ghost btn-sm" style="font-size:0.78rem;padding:4px 10px" onclick="setDateQuick('${monthStartStr}','${todayStr}')">This Month</button>
          <button class="btn btn-ghost btn-sm" style="font-size:0.78rem;padding:4px 10px" onclick="setDateQuick('${last30Str}','${todayStr}')">Last 30 Days</button>
        </div>
        <div class="filter-grid">
          <div class="form-field"><label>Type</label>
            <select id="f-type">
              <option value="" ${!type?'selected':''}>All</option>
              <option value="INCOME" ${type==='INCOME'?'selected':''}>Income</option>
              <option value="EXPENSE" ${type==='EXPENSE'?'selected':''}>Expense</option>
              <option value="TRANSFER" ${type==='TRANSFER'?'selected':''}>Transfer</option>
            </select>
          </div>
          <div class="form-field"><label>Account</label>
            <select id="f-account"><option value="">All Accounts</option>${accFilterOpts}</select>
          </div>
          <div class="form-field"><label>Category</label>
            <select id="f-cat"><option value="">All</option>${catOptions(false)}</select>
          </div>
          <div class="form-field"><label>Status</label>
            <select id="f-status">
              <option value="" ${!status?'selected':''}>All</option>
              <option value="CLEARED" ${status==='CLEARED'?'selected':''}>Cleared</option>
              <option value="RECONCILE" ${status==='RECONCILE'?'selected':''}>Reconcile</option>
              <option value="UNCLEARED" ${status==='UNCLEARED'?'selected':''}>Uncleared</option>
            </select>
          </div>
          <div class="form-field"><label>Date From</label><input type="date" id="f-from" value="${esc(dateFrom)}"></div>
          <div class="form-field"><label>Date To</label><input type="date" id="f-to" value="${esc(dateTo)}"></div>
          <div class="form-field"><label>Min Amount</label><input type="number" id="f-min" value="${esc(minAmount)}" placeholder="0.00"></div>
          <div class="form-field"><label>Max Amount</label><input type="number" id="f-max" value="${esc(maxAmount)}" placeholder="999999"></div>
          <div class="form-field"><label>Payee</label><input type="text" id="f-payee" value="${esc(payee)}" placeholder="Search payee…"></div>
        </div>
        <div class="filter-actions">
          <button class="btn btn-primary btn-sm" onclick="applyRecordFilters()">Apply Filters</button>
          <button class="btn btn-ghost btn-sm" onclick="clearRecordFilters()">Clear All</button>
        </div>
      </div>`;

      let html = `<div class="page-header">
        <h2 class="section-title">${title}</h2>
        <div style="display:flex;gap:8px">
          <button class="${filterBtnCls}" id="filters-btn" onclick="toggleRecordFilters()">${filterBtnLabel}</button>
          <button class="btn btn-primary btn-sm" onclick="openAddTransaction()">+ Add Record</button>
        </div>
      </div>${fPanel}`;

      if (data.items.length === 0) {
        html += '<p class="empty-state">No records found. Try adjusting the filters.</p>';
      } else {
        html += `<div class="card"><div class="table-wrap"><table>
          <thead><tr><th>Date</th><th>Title</th><th>Category</th><th>Account</th><th>Type</th><th style="text-align:right">Amount</th><th></th></tr></thead><tbody>`;
        data.items.forEach(tx => {
          const amtClass = tx.type === 'INCOME' ? 'amount-income' : tx.type === 'EXPENSE' ? 'amount-expense' : '';
          const sign     = tx.type === 'EXPENSE' ? '−' : tx.type === 'INCOME' ? '+' : '';
          const badgeCls = tx.type === 'INCOME' ? 'badge-income' : tx.type === 'EXPENSE' ? 'badge-expense' : 'badge-transfer';
          const tagsHtml = (tx.tags||[]).length ? `<br>${tx.tags.map(t=>`<span class="badge" style="font-size:0.68rem;background:var(--surface2);color:var(--text)">#${esc(t)}</span>`).join(' ')}` : '';
          const warIcon  = tx.warrantyExpiration ? ' 🛡️' : '';
          html += `<tr style="cursor:pointer" onclick="openTxDetail(${tx.id})">
            <td style="white-space:nowrap">${fmtDate(tx.date)}</td>
            <td>${esc(tx.title)}${warIcon}${tx.note ? `<br><small style="color:var(--text-muted)">${esc(tx.note)}</small>` : ''}${tagsHtml}</td>
            <td>${tx.categoryName ? esc(tx.categoryName) : '<span style="color:var(--text-muted)">—</span>'}</td>
            <td>${esc(tx.accountName || '')}</td>
            <td><span class="badge ${badgeCls}">${esc(tx.type)}</span></td>
            <td style="text-align:right" class="${amtClass}">${sign}${fmt(Math.abs(tx.amount||0), tx.currency)}</td>
            <td style="white-space:nowrap" onclick="event.stopPropagation()">
              <button class="btn-icon" title="Clone" onclick="cloneTransaction(${tx.id})">📋</button>
              <button class="btn-icon" title="Edit" onclick="openEditTransaction(${tx.id})">✏️</button>
              <button class="btn-icon" title="Delete" onclick="deleteTransaction('${esc(tx.id)}','${esc(tx.title)}')">🗑️</button>
            </td>
          </tr>`;
        });
        const totalPages = Math.ceil(data.total / data.limit);
        html += `</tbody></table></div>
          <div class="pagination">
            <span class="page-info">Page ${page+1} of ${totalPages} (${data.total} total)</span>
            ${page > 0 ? `<button class="btn btn-ghost btn-sm" onclick="navPage(${page-1})">← Prev</button>` : ''}
            ${data.hasMore ? `<button class="btn btn-primary btn-sm" onclick="navPage(${page+1})">Next →</button>` : ''}

      setContent(html);

      /* restore category filter selection after render */
      if (categoryId) { const el = document.getElementById('f-cat'); if (el) el.value = categoryId; }
      if (filtersOpen) { const fp = document.getElementById('filter-panel'); if (fp) fp.classList.remove('hidden'); }

    } catch (e) { if (e.message !== 'Session expired') showError('Error loading records.'); }
  }

  window.toggleRecordFilters = function () {
    const params = new URLSearchParams(location.hash.split('?')[1] || '');
    const cur = params.get('filtersOpen') === '1';
    params.set('filtersOpen', cur ? '0' : '1');
    location.hash = '#/records?' + params.toString();
  };

  window.setDateQuick = function (from, to) {
    const fFrom = document.getElementById('f-from');
    const fTo   = document.getElementById('f-to');
    if (fFrom) fFrom.value = from;
    if (fTo)   fTo.value   = to;
  };

  window.applyRecordFilters = function () {
    const params = new URLSearchParams(location.hash.split('?')[1] || '');
    const get = id => { const el = document.getElementById(id); return el ? el.value : ''; };
    params.set('type',       get('f-type'));
    params.set('categoryId', get('f-cat'));
    params.set('accountId',  get('f-account'));
    params.set('dateFrom',   get('f-from'));
    params.set('dateTo',     get('f-to'));
    params.set('minAmount',  get('f-min'));
    params.set('maxAmount',  get('f-max'));
    params.set('status',     get('f-status'));
    params.set('payee',      get('f-payee'));
    params.set('page',       '0');
    params.set('filtersOpen','1');
    // clean empty
    [...params.keys()].forEach(k => { if (!params.get(k)) params.delete(k); });
    params.set('filtersOpen','1');
    location.hash = '#/records?' + params.toString();
  };

  window.clearRecordFilters = function () {
    const params = new URLSearchParams(location.hash.split('?')[1] || '');
    const keep = ['accountId','accountName'];
    const fresh = new URLSearchParams();
    keep.forEach(k => { if (params.get(k)) fresh.set(k, params.get(k)); });
    fresh.set('filtersOpen','1');
    location.hash = '#/records?' + fresh.toString();
  };

  function txFormBody(tx) {
    const cur = tx ? tx.currency : (cachedSettings.baseCurrency || 'USD');
    const pmOpts = ['CASH','CARD','BANK_TRANSFER','DIGITAL_WALLET','OTHER'].map(v =>
      `<option value="${v}" ${(tx?.paymentMethod||'CASH')===v?'selected':''}>${{CASH:'Cash',CARD:'Card',BANK_TRANSFER:'Bank Transfer',DIGITAL_WALLET:'Digital Wallet',OTHER:'Other'}[v]}</option>`).join('');
    const warExp = tx?.warrantyExpiration ? new Date(tx.warrantyExpiration).toISOString().slice(0,10) : '';
    return `
      ${formRow(formField('Name', `<input type="text" id="tx-name" placeholder="e.g. Grocery run" value="${esc(tx?.title||'')}">`),
                formField('Amount', `<input type="number" id="tx-amount" placeholder="0.00" min="0" step="0.01" value="${esc(tx?.amount||'')}">`))}
      ${formRow(formField('Currency', `<input type="text" id="tx-currency" value="${esc(cur)}" maxlength="5">`),
                formField('Type', `<select id="tx-type" onchange="document.getElementById('tx-to-account-row').style.display=this.value==='TRANSFER'?'':'none'"><option value="EXPENSE" ${(tx?.type||'EXPENSE')==='EXPENSE'?'selected':''}>Expense</option><option value="INCOME" ${tx?.type==='INCOME'?'selected':''}>Income</option><option value="TRANSFER" ${tx?.type==='TRANSFER'?'selected':''}>Transfer</option></select>`))}
      ${formField('Account', `<select id="tx-account">${accOptions()}</select>`)}
      <div id="tx-to-account-row" style="${(tx?.type||'EXPENSE')==='TRANSFER'?'':'display:none'}">
        ${formField('To Account', `<select id="tx-to-account"><option value="">— Select destination —</option>${accOptions()}</select>`)}
      </div>
      ${formField('Category', `<select id="tx-category"><option value="">— None —</option>${catOptions(false)}</select>`)}
      ${formRow(formField('Date', `<input type="datetime-local" id="tx-date" value="${tx ? new Date(tx.date).toISOString().slice(0,16) : ''}">`),
                formField('Status', `<select id="tx-status"><option value="CLEARED" ${(tx?.status||'CLEARED')==='CLEARED'?'selected':''}>Cleared</option><option value="UNCLEARED" ${tx?.status==='UNCLEARED'?'selected':''}>Uncleared</option><option value="RECONCILE" ${tx?.status==='RECONCILE'?'selected':''}>Reconcile</option></select>`))}
      ${formRow(formField('Payee', `<input type="text" id="tx-payee" placeholder="Optional payee" value="${esc(tx?.payee||'')}"> `),
                formField('Payment Method', `<select id="tx-method">${pmOpts}</select>`))}
      ${formField('Tags (comma-separated)', `<input type="text" id="tx-tags" placeholder="food, bills, …" value="${esc((tx?.tags||[]).join(', '))}">`)}
      ${formField('Note', `<textarea id="tx-note" placeholder="Optional note…">${esc(tx?.note||'')}</textarea>`)}
      <div class="form-field" style="flex-direction:row;align-items:center;gap:10px">
        <input type="checkbox" id="tx-warranty" ${tx?.warrantyExpiration?'checked':''}
          onchange="document.getElementById('tx-warranty-wrap').style.display=this.checked?'':'none'">
        <label for="tx-warranty" style="margin-bottom:0;cursor:pointer">Has Warranty</label>
      </div>
      <div id="tx-warranty-wrap" style="${tx?.warrantyExpiration?'':'display:none'}">
        ${formField('Warranty Expiry', `<input type="date" id="tx-warranty-date" value="${esc(warExp)}">`)}
      </div>`;
  }

  window.openAddTransaction = async function (prefill) {
    const body = txFormBody(prefill || null);
    openModal('Add Record', body, submitAddTransaction, 'Save Record');
    modalConfBtn.className = 'btn btn-primary';
    const dtEl = document.getElementById('tx-date');
    if (dtEl && !prefill) { const now = new Date(); now.setSeconds(0,0); dtEl.value = now.toISOString().slice(0,16); }
    if (prefill?.accountId) { const el = document.getElementById('tx-account'); if (el) el.value = prefill.accountId; }
    if (prefill?.categoryId) { const el = document.getElementById('tx-category'); if (el) el.value = prefill.categoryId; }
  };

  window.submitAddTransaction = async function () {
    const get = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
    clearFieldErrors(modalBody);
    const name = get('tx-name');
    if (!name) { showFieldError('tx-name', 'Name is required.'); return; }
    const amount = parseFloat(get('tx-amount'));
    if (isNaN(amount) || amount <= 0) { showFieldError('tx-amount', 'Enter a valid positive amount.'); return; }
    const txType = get('tx-type');
    const warrantyEl = document.getElementById('tx-warranty');
    const warrantyDateStr = warrantyEl?.checked ? get('tx-warranty-date') : '';
    const body = {
      name,
      amount,
      currency:         get('tx-currency') || cachedSettings.baseCurrency,
      transactionType:  txType,
      accountId:        get('tx-account') || null,
      categoryId:       parseInt(get('tx-category')) || 0,
      timestamp:        new Date(get('tx-date') || Date.now()).getTime(),
      note:             get('tx-note') || '',
      payee:            get('tx-payee') || '',
      status:           get('tx-status') || 'CLEARED',
      paymentMethod:    get('tx-method') || 'CASH',
      tags:             get('tx-tags') ? get('tx-tags').split(',').map(t=>t.trim()).filter(Boolean) : [],
      warrantyExpiration: warrantyDateStr ? new Date(warrantyDateStr).getTime() : null,
    };
    if (txType === 'TRANSFER') {
      const toAccId = get('tx-to-account');
      if (!toAccId) { showFieldError('tx-to-account', 'Destination account is required for transfers.'); return; }
      if (toAccId === body.accountId) { showFieldError('tx-to-account', 'Destination must differ from source account.'); return; }
      body.toAccountId = toAccId;
    }
    await withLoading(modalConfBtn, async () => {
      const res = await apiWrite('POST', '/api/transactions', body);
      if (res.success) { closeModal(); renderRecords(); showToast('Record saved!'); }
      else { showToast('Failed to save: ' + (res.error || 'Unknown error'), 'error'); }
    });
  };

  window.openEditTransaction = async function (id) {
    const resp = await apiFetch(`/api/transactions/${id}`);
    if (!resp.success) { showToast('Could not load transaction.', 'error'); return; }
    const tx = resp.data;
    const body = txFormBody(tx);
    openModal('Edit Record', body, async () => {
      const get = i => { const el = document.getElementById(i); return el ? el.value.trim() : ''; };
      clearFieldErrors(modalBody);
      const txType = get('tx-type');
      const warrantyEl = document.getElementById('tx-warranty');
      const warrantyDateStr = warrantyEl?.checked ? get('tx-warranty-date') : '';
      const payload = {
        name:             get('tx-name') || undefined,
        amount:           parseFloat(get('tx-amount')) || undefined,
        currency:         get('tx-currency') || undefined,
        transactionType:  txType || undefined,
        accountId:        get('tx-account') || undefined,
        categoryId:       parseInt(get('tx-category')) || undefined,
        timestamp:        new Date(get('tx-date')).getTime() || undefined,
        note:             get('tx-note') || undefined,
        payee:            get('tx-payee') || undefined,
        status:           get('tx-status') || undefined,
        paymentMethod:    get('tx-method') || undefined,
        tags:             get('tx-tags') ? get('tx-tags').split(',').map(t=>t.trim()).filter(Boolean) : [],
        warrantyExpiration: warrantyDateStr ? new Date(warrantyDateStr).getTime() : null,
      };
      if (txType === 'TRANSFER') {
        const toAccId = get('tx-to-account');
        if (!toAccId) { showFieldError('tx-to-account', 'Destination account is required for transfers.'); return; }
        payload.toAccountId = toAccId;
      }
      await withLoading(modalConfBtn, async () => {
        const res = await apiWrite('PUT', `/api/transactions/${id}`, payload);
        if (res.success) { closeModal(); renderRecords(); showToast('Record updated!'); }
        else { showToast('Failed to update: ' + (res.error||''), 'error'); }
      });
    }, 'Save Changes');
    if (tx.accountId) { const el = document.getElementById('tx-account'); if (el) el.value = tx.accountId; }
    if (tx.categoryId) { const el = document.getElementById('tx-category'); if (el) el.value = tx.categoryId; }
    if (tx.toAccountId) { const el = document.getElementById('tx-to-account'); if (el) el.value = tx.toAccountId; }
  };

  window.openTxDetail = async function (id) {
    const resp = await apiFetch(`/api/transactions/${id}`);
    if (!resp.success) { showToast('Could not load transaction.', 'error'); return; }
    const tx = resp.data;
    const amtCls = tx.type==='INCOME'?'amount-income':tx.type==='EXPENSE'?'amount-expense':'';
    const sign   = tx.type==='EXPENSE'?'−':tx.type==='INCOME'?'+':'';
    const badgeCls = tx.type==='INCOME'?'badge-income':tx.type==='EXPENSE'?'badge-expense':'badge-transfer';
    const tags = (tx.tags||[]).map(t=>`<span class="badge" style="background:var(--surface2)">#${esc(t)}</span>`).join(' ');
    const warLine = tx.warrantyExpiration
      ? `<div class="form-field"><label>Warranty Expires</label><div>${new Date(tx.warrantyExpiration).toLocaleDateString()} 🛡️</div></div>`
      : '';
    const body = `<div style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h3 style="margin:0">${esc(tx.title)}</h3>
        <span class="${amtCls}" style="font-size:1.3rem;font-weight:700">${sign}${fmt(Math.abs(tx.amount||0), tx.currency)}</span>
      </div>
      <div><span class="badge ${badgeCls}">${esc(tx.type)}</span> ${tx.status ? `<span class="badge">${esc(tx.status)}</span>` : ''} ${tx.paymentMethod ? `<span class="badge">${esc(tx.paymentMethod)}</span>` : ''}</div>
      ${formRow(
        formField('Date', `<div>${new Date(tx.date).toLocaleString()}</div>`),
        formField('Account', `<div>${esc(tx.accountName||'—')}</div>`)
      )}
      ${formRow(
        formField('Category', `<div>${esc(tx.categoryName||'—')}</div>`),
        formField('Payee', `<div>${esc(tx.payee||'—')}</div>`)
      )}
      ${tx.note ? formField('Note', `<div style="color:var(--text-muted)">${esc(tx.note)}</div>`) : ''}
      ${tags ? formField('Tags', `<div>${tags}</div>`) : ''}
      ${tx.location ? formField('Location', `<div>${esc(tx.location)}</div>`) : ''}
      ${warLine}
      <div style="display:flex;gap:8px;margin-top:4px">
        <button class="btn btn-ghost btn-sm" onclick="closeModal();openEditTransaction(${tx.id})">✏️ Edit</button>
        <button class="btn btn-danger btn-sm" onclick="closeModal();deleteTransaction('${tx.id}','${esc(tx.title)}')">🗑️ Delete</button>
      </div>
    </div>`;
    openModal(`Transaction Detail`, body, null, null);
  };

  window.deleteTransaction = function (id, name) {
    confirmDelete(`Delete "${name}"? This action cannot be undone.`, async () => {
      try {
        const res = await apiWrite('DELETE', `/api/transactions/${encodeURIComponent(id)}`);
        closeModal();
        if (res.success) { renderRecords(); showToast('Record deleted.'); }
        else { showToast('Failed to delete record.', 'error'); }
      } catch (e) { if (e.message !== 'Session expired') showToast('Error deleting record.', 'error'); }
    });
  };

  /* ══════════════════════════════════════════════════════
     PAGE: Accounts
  ══════════════════════════════════════════════════════ */
  async function renderAccounts() {
    showSpinner();
    try {
      const json = await apiFetch('/api/accounts');
      if (!json.success) { showError('Failed to load accounts.'); return; }
      cachedAccounts = json.data || [];

      let html = `<div class="page-header"><h2 class="section-title">Accounts</h2>
        <button class="btn btn-primary btn-sm" onclick="openAddAccount()">+ Add Account</button>
      </div>`;

      if (!cachedAccounts.length) {
        html += '<p class="empty-state">No accounts found. Add your first account.</p>';
      } else {
        html += '<div class="card-grid">';
        cachedAccounts.forEach(acc => {
          const balClass = (acc.balance || 0) >= 0 ? 'positive' : 'negative';
          html += `<div class="stat-card">
            <div class="stat-label">${esc(acc.type || '')}</div>
            <div style="font-weight:600;margin-bottom:8px">${esc(acc.name)}</div>
            <div class="stat-value ${balClass}">${fmt(acc.balance || 0, acc.currency)}</div>
            <div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap">
              <a class="btn btn-primary btn-sm" href="#/accounts/${esc(acc.id)}">Details</a>
              <button class="btn btn-ghost btn-sm" onclick="openEditAccount('${esc(acc.id)}')">✏️ Edit</button>
              <a class="btn btn-ghost btn-sm" href="#/records?accountId=${esc(acc.id)}&accountName=${encodeURIComponent(acc.name)}">Records</a>
              <button class="btn btn-sm" style="background:var(--danger);color:#fff" onclick="deleteAccount('${esc(acc.id)}','${esc(acc.name)}')">Delete</button>
            </div>
          </div>`;
        });
        html += '</div>';
      }
      setContent(html);
    } catch (e) { if (e.message !== 'Session expired') showError('Error loading accounts.'); }
  }

  window.openAddAccount = function () {
    const body = `
      ${formField('Account Name', '<input type="text" id="acc-name" placeholder="e.g. Main Checking">')}
      ${formRow(
        formField('Currency', `<input type="text" id="acc-currency" value="${esc(cachedSettings.baseCurrency||'USD')}" maxlength="5">`),
        formField('Type', `<select id="acc-type">
          <option value="CHECKING">Checking</option>
          <option value="SAVINGS">Savings</option>
          <option value="CREDIT_CARD">Credit Card</option>
          <option value="INVESTMENT">Investment</option>
          <option value="CASH">Cash</option>
          <option value="OTHER">Other</option>
        </select>`)
      )}
      ${formField('Initial Balance (optional)', '<input type="number" id="acc-init-bal" placeholder="0.00" step="0.01">')}`;
    openModal('Add Account', body, submitAddAccount, 'Save Account');
    modalConfBtn.className = 'btn btn-primary';
  };

  /* ── F0-1: Edit Account ──────────────────────────────── */
  window.openEditAccount = function (id) {
    const acc = cachedAccounts.find(a => a.id === id);
    if (!acc) { showToast('Account not found.', 'error'); return; }
    const body = `
      <div class="form-field" style="background:var(--surface2);padding:10px;border-radius:var(--radius-sm);margin-bottom:4px">
        <div style="font-size:0.78rem;color:var(--text-muted)">Current Balance</div>
        <div style="font-weight:700;font-size:1.1rem">${fmt(acc.balance||0, acc.currency)}</div>
      </div>
      ${formField('Account Name', `<input type="text" id="acc-name" value="${esc(acc.name)}">`)}
      ${formRow(
        formField('Currency (read-only)', `<input type="text" id="acc-currency-ro" value="${esc(acc.currency)}" disabled style="opacity:.6">`),
        formField('Type', `<select id="acc-type">
          <option value="CHECKING" ${acc.type==='CHECKING'?'selected':''}>Checking</option>
          <option value="SAVINGS" ${acc.type==='SAVINGS'?'selected':''}>Savings</option>
          <option value="CREDIT_CARD" ${acc.type==='CREDIT_CARD'?'selected':''}>Credit Card</option>

        html += '<div class="card-grid">';
        budgets.forEach(b => {
          const pct       = Math.round(((b.spent || 0) / (b.limitAmount || 1)) * 100);
          const alertCls  = pct < 80 ? 'progress-green' : pct < 100 ? 'progress-orange' : 'progress-red';

  /* ══════════════════════════════════════════════════════
     PAGE: Planned Payments
  ══════════════════════════════════════════════════════ */
  async function renderPlannedPayments() {
    showSpinner();
    try {
      const [allRes, upcomingRes, overdueRes] = await Promise.all([
        apiFetch('/api/planned-payments'),
        apiFetch('/api/planned-payments/upcoming?days=30'),
        apiFetch('/api/planned-payments/overdue'),
      ]);
      const allPayments = (allRes.success  ? (allRes.data  || []) : []);
      const upcoming    = (upcomingRes.success ? (upcomingRes.data || []) : []);
      const overdue     = (overdueRes.success  ? (overdueRes.data  || []) : []);

      let html = `<div class="page-header"><h2 class="section-title">Planned Payments</h2>
        <button class="btn btn-primary btn-sm" onclick="openAddPlanned()">+ Add Planned Payment</button>
      </div>`;

      /* ── Overdue ─ */
      if (overdue.length) {
        html += `<div class="card" style="border-color:var(--danger)">
          <div class="overdue-header">⚠️ Overdue (${overdue.length})</div>
          <div class="table-wrap"><table>
            <thead><tr><th>Name</th><th>Amount</th><th>Due Date</th><th>Account</th><th>Actions</th></tr></thead><tbody>`;
        overdue.forEach(p => {
          html += `<tr>
            <td>${esc(p.name)}<br><small style="color:var(--text-muted)">${esc(p.recurrenceDescription||'')}</small></td>
            <td>${fmt(p.amount||0, p.currency)}</td>
            <td style="white-space:nowrap;color:var(--danger)">${fmtDate(p.nextDueDate)}</td>
            <td>${esc(p.accountName||'')}</td>
            <td style="white-space:nowrap">
              <button class="btn btn-sm btn-primary" onclick="confirmPlanned('${esc(p.id)}')">✓ Confirm</button>
              <button class="btn btn-sm btn-ghost" onclick="skipPlanned('${esc(p.id)}')">Skip</button>
            </td>
          </tr>`;
        });
        html += '</tbody></table></div></div>';
      }

      /* ── Upcoming ─ */
      if (upcoming.length) {
        html += `<div class="card" style="border-color:var(--warning)">
          <div class="upcoming-header">📅 Upcoming (next 30 days)</div>
          <div class="table-wrap"><table>
            <thead><tr><th>Name</th><th>Amount</th><th>Due Date</th><th>Recurrence</th><th>Actions</th></tr></thead><tbody>`;
        upcoming.forEach(p => {
          html += `<tr>
            <td>${esc(p.name)}</td>
            <td>${fmt(p.amount||0, p.currency)}</td>
            <td style="white-space:nowrap">${fmtDate(p.nextDueDate)}</td>
            <td><small style="color:var(--text-muted)">${esc(p.recurrenceDescription||'—')}</small></td>
            <td style="white-space:nowrap">
              <button class="btn btn-sm btn-primary" onclick="confirmPlanned('${esc(p.id)}')">✓ Confirm</button>
              <button class="btn btn-sm btn-ghost" onclick="skipPlanned('${esc(p.id)}')">Skip</button>
            </td>
          </tr>`;
        });
        html += '</tbody></table></div></div>';
      }

      /* ── All planned payments ─ */
      html += `<div class="section-sub">All Planned Payments</div>`;
      if (!allPayments.length) {
        html += '<p class="empty-state">No planned payments yet.</p>';
      } else {
        html += `<div class="card"><div class="table-wrap"><table>
          <thead><tr><th>Name</th><th>Amount</th><th>Next Due</th><th>Type</th><th>Status</th><th>Auto</th><th></th></tr></thead><tbody>`;
        allPayments.forEach(p => {
          const txBadge = p.transactionType === 'INCOME' ? 'badge-income' : 'badge-expense';
          html += `<tr>
            <td>${esc(p.name)}<br><small style="color:var(--text-muted)">${esc(p.recurrenceDescription||'')}</small></td>
            <td>${fmt(p.amount||0, p.currency)}</td>
            <td style="white-space:nowrap${p.isOverdue ? ';color:var(--danger)' : ''}">${fmtDate(p.nextDueDate)}</td>
            <td><span class="badge ${txBadge}">${esc(p.transactionType||'')}</span></td>
            <td><span class="badge ${p.isOverdue ? 'badge-overdue' : 'badge-active'}">${esc(p.status||'')}</span></td>
            <td>${p.autoConfirm ? '✅' : '—'}</td>
            <td style="white-space:nowrap">
              <button class="btn-icon" title="Edit" onclick="openEditPlanned('${esc(p.id)}')">✏️</button>
              <button class="btn-icon" title="Delete" onclick="deletePlanned('${esc(p.id)}','${esc(p.name)}')">🗑️</button>
            </td>
          </tr>`;
        });
        html += '</tbody></table></div></div>';
      }

      setContent(html);

  async function renderCategories() {
    showSpinner();
    try {
      const json = await apiFetch('/api/categories');
      if (!json.success) { showError('Failed to load categories.'); return; }
      cachedCategories = json.data || [];
      const parents  = cachedCategories.filter(c => !c.parentId);
      const children = cachedCategories.filter(c =>  c.parentId);

      let html = `<div class="page-header"><h2 class="section-title">Categories</h2>
        <button class="btn btn-primary btn-sm" onclick="openAddCategory()">+ Add Category</button>
      </div>`;

      if (!cachedCategories.length) {
        html += '<p class="empty-state">No categories found.</p>';
      } else {
        html += '<div class="card">';
        parents.forEach(cat => {
          html += renderCatRow(cat, false);
          children.filter(c => c.parentId === cat.id).forEach(child => {
            html += renderCatRow(child, true);
          });
        });
        /* orphan children */
        children.filter(c => !parents.find(p => p.id === c.parentId)).forEach(child => {
          html += renderCatRow(child, true);
        });
        html += '</div>';
      }
      setContent(html);
    } catch (e) { if (e.message !== 'Session expired') showError('Error loading categories.'); }
  }

  /* ══════════════════════════════════════════════════════
     PAGE: Analytics
  ══════════════════════════════════════════════════════ */
  async function renderAnalytics() {
    /* default date range = current month */
    const now   = new Date();
    const y     = now.getFullYear();
    const m     = String(now.getMonth() + 1).padStart(2,'0');
    const defFrom = `${y}-${m}-01`;
    const lastDay = new Date(y, now.getMonth()+1, 0).getDate();
    const defTo   = `${y}-${m}-${String(lastDay).padStart(2,'0')}`;

    const params    = new URLSearchParams(location.hash.split('?')[1] || '');
    const dateFrom  = params.get('dateFrom') || defFrom;
    const dateTo    = params.get('dateTo')   || defTo;
    const txType    = params.get('txType')   || 'EXPENSE';

    showSpinner();
    try {
      const [bdRes, cfRes] = await Promise.all([
        apiFetch(`/api/analytics/category-breakdown?dateFrom=${dateFrom}&dateTo=${dateTo}&type=${txType}`),
        apiFetch(`/api/analytics/cash-flow?dateFrom=${dateFrom}&dateTo=${dateTo}&granularity=MONTH`),
      ]);
      const breakdown = bdRes.success ? (bdRes.data || []) : [];
      const cashFlow  = cfRes.success ? (cfRes.data || []) : [];

      let html = `<h2 class="section-title">Analytics</h2>
        <div class="card" style="margin-bottom:20px">
          <div style="display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px">
            <div class="form-field" style="margin:0;flex:1;min-width:140px">
              <label>From</label><input type="date" id="an-from" value="${esc(dateFrom)}">
            </div>
            <div class="form-field" style="margin:0;flex:1;min-width:140px">
              <label>To</label><input type="date" id="an-to" value="${esc(dateTo)}">
            </div>
            <div class="form-field" style="margin:0">
              <label>Type</label>
              <select id="an-type">
                <option value="EXPENSE" ${txType==='EXPENSE'?'selected':''}>Expense</option>
                <option value="INCOME" ${txType==='INCOME'?'selected':''}>Income</option>
              </select>
            </div>
            <button class="btn btn-primary btn-sm" onclick="applyAnalyticsFilters()" style="align-self:flex-end;margin-bottom:14px">Apply</button>
          </div>
        </div>`;

      /* ── Two-col charts ─ */
      html += '<div class="two-col">';

      /* ── Donut chart ─ */
      let donutHtml = '';
      if (!breakdown.length) {
        donutHtml = '<p class="empty-state">No category data for this period.</p>';
      } else {
        let top = breakdown.slice(0, 8);
        const rest = breakdown.slice(8);
        if (rest.length) {
          const otherAmt = rest.reduce((s, c) => s + (c.amount || 0), 0);
          top.push({ categoryName: 'Other', amount: otherAmt, percentage: rest.reduce((s,c)=>s+(c.percentage||0),0) });
        }
        const slices = top.map((c, i) => ({
          label: c.categoryName, value: c.amount, color: CHART_COLORS[i % CHART_COLORS.length]
        }));
        let legend = '<div class="chart-legend" style="margin-top:12px">';
        top.forEach((c, i) => {
          legend += `<div class="legend-item">
            <div class="legend-dot" style="background:${esc(CHART_COLORS[i%CHART_COLORS.length])}"></div>
            <span>${esc(c.categoryName)}</span>
            <span style="color:var(--text-muted);margin-left:4px">${fmtRaw(c.amount)} (${fmtRaw(c.percentage || 0, 1)}%)</span>
          </div>`;
        });
        legend += '</div>';
        donutHtml = `<div style="display:flex;justify-content:center">${svgDonut(slices,180)}</div>${legend}`;
      }
      html += `<div class="card"><div class="section-sub">Category Breakdown (${esc(txType)})</div>${donutHtml}</div>`;

      /* ── Bar chart ─ */
      let barHtml = '';
      if (!cashFlow.length) {
        barHtml = '<p class="empty-state">No cash flow data for this period.</p>';
      } else {
        const points = cashFlow.map(p => ({ label: p.label, income: p.income || 0, expense: p.expense || 0 }));
        barHtml = svgBars(points, 400, 140);
        barHtml += `<div class="chart-legend" style="margin-top:8px">
          <div class="legend-item"><div class="legend-dot" style="background:var(--success)"></div><span>Income</span></div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--danger)"></div><span>Expense</span></div>
        </div>`;
        /* net row */
        barHtml += '<div style="margin-top:12px"><div class="table-wrap"><table><thead><tr><th>Period</th><th>Income</th><th>Expense</th><th>Net</th></tr></thead><tbody>';
        cashFlow.forEach(p => {
          const net = (p.income||0) - (p.expense||0);
          const netClass = net >= 0 ? 'amount-income' : 'amount-expense';
          const sign = net >= 0 ? '+' : '−';
          barHtml += `<tr>
            <td>${esc(p.label)}</td>
            <td class="amount-income">+${fmtRaw(p.income||0)}</td>
            <td class="amount-expense">−${fmtRaw(p.expense||0)}</td>
            <td class="${netClass}">${sign}${fmtRaw(Math.abs(net))}</td>
          </tr>`;
        });
        barHtml += '</tbody></table></div></div>';
      }
      html += `<div class="card"><div class="section-sub">Cash Flow</div>${barHtml}</div>`;

      html += '</div>'; /* end two-col */
      setContent(html);
    } catch (e) { if (e.message !== 'Session expired') showError('Error loading analytics.'); }
  }

     PAGE: Templates
  ══════════════════════════════════════════════════════ */
  async function renderTemplates() {
    showSpinner();
    try {
      const json = await apiFetch('/api/templates');
      if (!json.success) { showError('Failed to load templates.'); return; }
      const templates = json.data || [];
      let html = `<div class="page-header">
        <h2 class="section-title">Templates</h2>
        <button class="btn btn-primary btn-sm" onclick="openAddTemplate()">+ New Template</button>
      </div>`;
      if (!templates.length) {
        html += '<p class="empty-state">No templates yet. Create one to quickly prefill transactions.</p>';
      } else {
        html += `<div class="card"><div class="table-wrap"><table>
          <thead><tr><th>Name</th><th>Type</th><th>Amount</th><th>Category</th><th>Account</th><th></th></tr></thead><tbody>`;
        templates.forEach(t => {
          const typeCls = t.transactionType==='INCOME'?'badge-income':t.transactionType==='EXPENSE'?'badge-expense':'badge-transfer';
          const amtCls  = t.transactionType==='INCOME'?'amount-income':t.transactionType==='EXPENSE'?'amount-expense':'';
          const sign    = t.transactionType==='EXPENSE'?'−':t.transactionType==='INCOME'?'+':'';
          const cat     = cachedCategories.find(c=>c.id===t.categoryId);
          const acc     = cachedAccounts.find(a=>a.id===t.accountId);
          html += `<tr>
            <td style="font-weight:600">${esc(t.name)}</td>
            <td><span class="badge ${typeCls}">${esc(t.transactionType)}</span></td>
            <td class="${amtCls}">${sign}${fmtRaw(t.amount||0)} ${esc(t.currency||'')}</td>
            <td>${cat?esc(cat.name):'<span style="color:var(--text-muted)">—</span>'}</td>
            <td>${acc?esc(acc.name):'<span style="color:var(--text-muted)">—</span>'}</td>
            <td style="white-space:nowrap">
              <button class="btn-icon" title="Use template" onclick="useTemplate(${t.id})">➕</button>
              <button class="btn-icon" title="Edit" onclick="openEditTemplate(${t.id})">✏️</button>
              <button class="btn-icon" title="Delete" onclick="deleteTemplate(${t.id},'${esc(t.name)}')">🗑️</button>
            </td>
          </tr>`;
        });
        html += '</tbody></table></div></div>';
      }
      setContent(html);
    } catch(e) { if (e.message !== 'Session expired') showError('Error loading templates.'); }
  }

  function templateFormBody(t) {
    const pmOpts = ['CASH','CARD','BANK_TRANSFER','DIGITAL_WALLET','OTHER'].map(v =>
      `<option value="${v}" ${(t?.paymentMethod||'CASH')===v?'selected':''}>${{CASH:'Cash',CARD:'Card',BANK_TRANSFER:'Bank Transfer',DIGITAL_WALLET:'Digital Wallet',OTHER:'Other'}[v]}</option>`).join('');
    return `
      ${formRow(formField('Template Name', `<input type="text" id="tpl-name" placeholder="e.g. Monthly Rent" value="${esc(t?.name||'')}">`),
                formField('Amount', `<input type="number" id="tpl-amount" placeholder="0.00" min="0" step="0.01" value="${esc(t?.amount||'')}">`))}
      ${formRow(formField('Currency', `<input type="text" id="tpl-currency" value="${esc(t?.currency||cachedSettings.baseCurrency||'USD')}" maxlength="5">`),
                formField('Type', `<select id="tpl-type"><option value="EXPENSE" ${(t?.transactionType||'EXPENSE')==='EXPENSE'?'selected':''}>Expense</option><option value="INCOME" ${t?.transactionType==='INCOME'?'selected':''}>Income</option><option value="TRANSFER" ${t?.transactionType==='TRANSFER'?'selected':''}>Transfer</option></select>`))}
      ${formField('Account', `<select id="tpl-account"><option value="">— None —</option>${accOptions()}</select>`)}
      ${formField('Category', `<select id="tpl-category"><option value="0">— None —</option>${catOptions(false)}</select>`)}
      ${formRow(formField('Payee', `<input type="text" id="tpl-payee" placeholder="Optional" value="${esc(t?.payee||'')}">`),
                formField('Payment Method', `<select id="tpl-method">${pmOpts}</select>`))}
      ${formField('Tags (comma-separated)', `<input type="text" id="tpl-tags" placeholder="food, bills, …" value="${esc((t?.tags||[]).join(', '))}">`)}
      ${formField('Note', `<textarea id="tpl-note" placeholder="Optional note…">${esc(t?.note||'')}</textarea>`)}`;
  }

  window.openAddTemplate = function () {
    const body = templateFormBody(null);
    openModal('New Template', body, submitAddTemplate, 'Save Template');
    modalConfBtn.className = 'btn btn-primary';
  };

  window.submitAddTemplate = async function () {
    clearFieldErrors(modalBody);
    const get = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
    const name = get('tpl-name');
    if (!name) { showFieldError('tpl-name', 'Template name is required.'); return; }
    const payload = {
      name,
      amount:          parseFloat(get('tpl-amount')) || 0,
      currency:        get('tpl-currency') || cachedSettings.baseCurrency,
      transactionType: get('tpl-type') || 'EXPENSE',
      accountId:       get('tpl-account') || null,
      categoryId:      parseInt(get('tpl-category')) || 0,
      payee:           get('tpl-payee') || null,
      paymentMethod:   get('tpl-method') || null,
      tags:            get('tpl-tags') ? get('tpl-tags').split(',').map(t=>t.trim()).filter(Boolean) : [],
      note:            get('tpl-note') || null,
      transactionStatus: 'CLEARED',
    };
    await withLoading(modalConfBtn, async () => {
      const res = await apiWrite('POST', '/api/templates', payload);
      if (res.success) { closeModal(); renderTemplates(); showToast('Template saved!'); }
      else { showToast('Failed: ' + (res.error||''), 'error'); }
    });
  };

  window.openEditTemplate = async function (id) {
    const resp = await apiFetch(`/api/templates/${id}`);
    if (!resp.success) { showToast('Could not load template.', 'error'); return; }
    const t = resp.data;
    const body = templateFormBody(t);
    openModal('Edit Template', body, async () => {
      const get = i => { const el = document.getElementById(i); return el ? el.value.trim() : ''; };
      const payload = {
        name:            get('tpl-name') || undefined,
        amount:          parseFloat(get('tpl-amount')) || undefined,
        currency:        get('tpl-currency') || undefined,
        transactionType: get('tpl-type') || undefined,
        accountId:       get('tpl-account') || undefined,
        categoryId:      parseInt(get('tpl-category')) || undefined,
        payee:           get('tpl-payee') || undefined,
        paymentMethod:   get('tpl-method') || undefined,
        tags:            get('tpl-tags') ? get('tpl-tags').split(',').map(t=>t.trim()).filter(Boolean) : [],
        note:            get('tpl-note') || undefined,
      };
      await withLoading(modalConfBtn, async () => {
        const res = await apiWrite('PUT', `/api/templates/${id}`, payload);
        if (res.success) { closeModal(); renderTemplates(); showToast('Template updated!'); }
        else { showToast('Failed: ' + (res.error||''), 'error'); }
      });
    }, 'Save Changes');
    if (t.accountId) { const el = document.getElementById('tpl-account'); if (el) el.value = t.accountId; }
    if (t.categoryId) { const el = document.getElementById('tpl-category'); if (el) el.value = t.categoryId; }
  };

  window.useTemplate = async function (id) {
    const resp = await apiFetch(`/api/templates/${id}`);
    if (!resp.success) { showToast('Could not load template.', 'error'); return; }
    const t = resp.data;
    /* Navigate to Records, open Add Record pre-filled from template */
    location.hash = '#/records';
    await new Promise(r => setTimeout(r, 80));
    openAddTransaction({
      title: t.name,
      amount: t.amount,
      currency: t.currency,
      type: t.transactionType,
      accountId: t.accountId,
      categoryId: t.categoryId,
      payee: t.payee,
      paymentMethod: t.paymentMethod,
      tags: t.tags,
      note: t.note,
      status: t.transactionStatus,
    });
  };

  window.deleteTemplate = function (id, name) {
    confirmDelete(`Delete template "${name}"?`, async () => {
      try {
        const res = await apiWrite('DELETE', `/api/templates/${id}`);
        closeModal();
        if (res.success) { renderTemplates(); showToast('Template deleted.'); }
        else { showToast('Failed to delete.', 'error'); }
      } catch (e) { if (e.message !== 'Session expired') showToast('Error deleting template.', 'error'); }
    });
  };

  /* ══════════════════════════════════════════════════════
     PAGE: Settings
  ══════════════════════════════════════════════════════ */
  /* ══════════════════════════════════════════════════════
     PAGE: Account Detail
  ══════════════════════════════════════════════════════ */
  async function renderAccountDetail(id) {
    if (!id) { navigate('#/accounts'); return; }
    showSpinner();
    try {
      const json = await apiFetch(`/api/accounts/${encodeURIComponent(id)}`);
      if (!json.success) { showError('Failed to load account.'); return; }
      const acc = json.data.account || {};
      const txs = json.data.recentTransactions || [];
      const balClass = (acc.balance || 0) >= 0 ? 'positive' : 'negative';

      let html = `<div class="page-header">
        <div style="display:flex;align-items:center;gap:12px">
          <a class="btn btn-ghost btn-sm" href="#/accounts">← Back</a>
          <h2 class="section-title" style="margin:0">${esc(acc.name)}</h2>
        </div>
        <a class="btn btn-ghost btn-sm" href="#/records?accountId=${esc(acc.id)}&accountName=${encodeURIComponent(acc.name||'')}">All Records</a>
      </div>
      <div class="card-grid" style="margin-bottom:20px">
        <div class="stat-card">
          <div class="stat-label">Current Balance</div>
          <div class="stat-value ${balClass}">${fmt(acc.balance||0, acc.currency)}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Currency</div>
          <div class="stat-value">${esc(acc.currency||'')}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Type</div>
          <div class="stat-value" style="font-size:1rem">${esc(acc.type||'')}</div>
        </div>
      </div>
      <div class="section-sub">Recent Transactions (last 20)</div>`;

      if (!txs.length) {
        html += '<p class="empty-state">No transactions for this account.</p>';
      } else {
        html += `<div class="card"><div class="table-wrap"><table>
          <thead><tr><th>Date</th><th>Title</th><th>Category</th><th>Type</th><th style="text-align:right">Amount</th><th></th></tr></thead><tbody>`;
        txs.forEach(tx => {
          const amtClass = tx.type === 'INCOME' ? 'amount-income' : tx.type === 'EXPENSE' ? 'amount-expense' : '';
          const sign = tx.type === 'EXPENSE' ? '−' : tx.type === 'INCOME' ? '+' : '';
          const badgeCls = tx.type === 'INCOME' ? 'badge-income' : tx.type === 'EXPENSE' ? 'badge-expense' : 'badge-transfer';
          html += `<tr style="cursor:pointer" onclick="openTxDetail(${tx.id})">
            <td style="white-space:nowrap">${fmtDate(tx.date)}</td>
            <td>${esc(tx.title)}</td>
            <td>${tx.categoryName ? esc(tx.categoryName) : '<span style="color:var(--text-muted)">—</span>'}</td>
            <td><span class="badge ${badgeCls}">${esc(tx.type)}</span></td>
            <td style="text-align:right" class="${amtClass}">${sign}${fmt(Math.abs(tx.amount||0), tx.currency)}</td>
            <td onclick="event.stopPropagation()">
              <button class="btn-icon" title="Edit" onclick="openEditTransaction(${tx.id})">✏️</button>
            </td>
          </tr>`;

      setContent(html);

  /* ══════════════════════════════════════════════════════
     PAGE: Budget Detail
  ══════════════════════════════════════════════════════ */
  async function renderBudgetDetail(id) {
    if (!id) { navigate('#/budgets'); return; }

    try {
      const json = await apiFetch(`/api/budgets/${encodeURIComponent(id)}`);
      if (!json.success) { showError('Failed to load budget.'); return; }

      const html = `<div class="page-header">
        <div style="display:flex;align-items:center;gap:12px">
          <a class="btn btn-ghost btn-sm" href="#/budgets">← Back</a>
          <h2 class="section-title" style="margin:0">${esc(b.name)}</h2>
        </div>
      </div>
      <div class="card" style="max-width:520px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px">
          <div>
            <div style="font-size:0.8rem;color:var(--text-muted)">${esc(b.period||'')}</div>
            ${b.isArchived ? '<span class="badge" style="background:var(--border);color:var(--text-muted)">Archived</span>' : ''}
          </div>
          <span style="font-size:1.4rem;font-weight:700;color:${pct>=100?'var(--danger)':pct>=80?'var(--warning)':'var(--success)'}">${pct}%</span>
        </div>
        ${progressBar(pct, alertCls)}
        <div class="card-grid" style="margin-top:16px;grid-template-columns:repeat(3,1fr)">
          <div class="stat-card">
            <div class="stat-label">Limit</div>
            <div class="stat-value" style="font-size:1.1rem">${fmt(b.limitAmount||0, b.currency)}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Spent</div>
            <div class="stat-value" style="font-size:1.1rem;color:var(--danger)">${fmt(b.spent||0, b.currency)}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Remaining</div>
            <div class="stat-value" style="font-size:1.1rem;color:var(--success)">${fmt(b.remaining||0, b.currency)}</div>
          </div>
        </div>
      </div>`;
      setContent(html);
    } catch (e) { if (e.message !== 'Session expired') showError('Error loading budget detail.'); }
  }

  /* ══════════════════════════════════════════════════════
     PAGE: Loan Detail
  ══════════════════════════════════════════════════════ */
  async function renderLoanDetail(id) {
    if (!id) { navigate('#/loans'); return; }
    showSpinner();
    try {
      const [loanRes, paymentsRes] = await Promise.all([
        apiFetch(`/api/loans/${encodeURIComponent(id)}`),
        apiFetch(`/api/loans/${encodeURIComponent(id)}/payments`)
      ]);
      if (!loanRes.success) { showError('Failed to load loan.'); return; }
      const loan = loanRes.data || {};
      const payments = paymentsRes.success ? (paymentsRes.data || []) : [];
      const typeBadge = loan.loanType === 'LENT' ? 'badge-lent' : 'badge-borrowed';
      const statusBadge = loan.status === 'SETTLED' ? 'badge-settled' : 'badge-active';
      const repaidPct = Math.round(((loan.totalPaid||0)/(loan.principalAmount||1))*100);

      let html = `<div class="page-header">
        <div style="display:flex;align-items:center;gap:12px">
          <a class="btn btn-ghost btn-sm" href="#/loans">← Back</a>
          <h2 class="section-title" style="margin:0">${esc(loan.name)}</h2>
        </div>
        <div style="display:flex;gap:6px">
          <span class="badge ${typeBadge}">${esc(loan.loanType)}</span>
          <span class="badge ${statusBadge}">${esc(loan.status)}</span>
        </div>
      </div>
      <div class="card-grid" style="margin-bottom:20px">
        <div class="stat-card">
          <div class="stat-label">Principal</div>
          <div class="stat-value">${fmt(loan.principalAmount||0, loan.currency)}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Paid</div>
          <div class="stat-value" style="color:var(--success)">${fmt(loan.totalPaid||0, loan.currency)}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Remaining</div>
          <div class="stat-value" style="color:var(--danger)">${fmt(loan.remainingBalance||0, loan.currency)}</div>
        </div>
        ${loan.interestAccrued ? `<div class="stat-card">
          <div class="stat-label">Interest Accrued</div>
          <div class="stat-value" style="color:var(--warning)">${fmt(loan.interestAccrued, loan.currency)}</div>
        </div>` : ''}
      </div>
      <div class="card" style="max-width:520px;margin-bottom:20px">
        ${progressBar(repaidPct, repaidPct>=100?'progress-green':'progress-orange')}
        <div style="display:flex;justify-content:space-between;font-size:0.78rem;color:var(--text-muted);margin-top:4px">
          <span>Repaid: ${repaidPct}%</span>
          ${loan.lenderOrBorrowerName ? `<span>${esc(loan.lenderOrBorrowerName)}</span>` : ''}
        </div>
        ${loan.startDate ? `<div style="font-size:0.8rem;color:var(--text-muted);margin-top:8px">Start: ${fmtDate(loan.startDate)}</div>` : ''}
        ${loan.expectedSettlementDate ? `<div style="font-size:0.8rem;color:var(--text-muted)">Expected settlement: ${fmtDate(loan.expectedSettlementDate)}</div>` : ''}
      </div>
      <div class="section-sub" style="display:flex;justify-content:space-between;align-items:center">
        <span>Repayment History</span>
        <button class="btn btn-primary btn-sm" onclick="openLogRepayment(${loan.id})">+ Log Repayment</button>
      </div>`;

      if (!payments.length) {
        html += '<p class="empty-state">No repayments logged yet.</p>';
      } else {
        html += `<div class="card"><div class="table-wrap"><table>
          <thead><tr><th>Date</th><th>Amount</th><th>Note</th><th></th></tr></thead><tbody>`;
        payments.forEach(p => {
          html += `<tr>
            <td style="white-space:nowrap">${fmtDate(p.date)}</td>
            <td>${fmt(p.amount||0, loan.currency)}</td>
            <td>${p.note ? esc(p.note) : '<span style="color:var(--text-muted)">—</span>'}</td>
            <td><button class="btn-icon" title="Delete" onclick="deleteRepayment(${loan.id},${p.id})">🗑️</button></td>
          </tr>`;
        });
        html += '</tbody></table></div></div>';
      }
      setContent(html);
    } catch (e) { if (e.message !== 'Session expired') showError('Error loading loan detail.'); }
  }

  window.openLogRepayment = function (loanId) {
    const body = `
      ${formRow(
        formField('Amount', '<input type="number" id="rp-amount" placeholder="0.00" min="0" step="0.01">'),
        formField('Date', `<input type="date" id="rp-date" value="${new Date().toISOString().slice(0,10)}">`)
      )}
      ${formField('Note (optional)', '<input type="text" id="rp-note" placeholder="e.g. Monthly payment">')}`;
    openModal('Log Repayment', body, () => submitLogRepayment(loanId), 'Save');
    modalConfBtn.className = 'btn btn-primary';
  };

  window.submitLogRepayment = async function (loanId) {
    clearFieldErrors(modalBody);
    const amount = parseFloat(document.getElementById('rp-amount')?.value || '0');
    const date = document.getElementById('rp-date')?.value;
    const note = document.getElementById('rp-note')?.value.trim();
    if (isNaN(amount) || amount <= 0) { showFieldError('rp-amount', 'Enter a valid amount.'); return; }
    await withLoading(modalConfBtn, async () => {
      const res = await apiWrite('POST', `/api/loans/${encodeURIComponent(loanId)}/payments`, {
        amount, date: date ? new Date(date).getTime() : Date.now(), note: note || undefined
      });
      if (res.success) { closeModal(); renderLoanDetail(loanId); showToast('Repayment logged!'); }
      else { showToast('Failed to log repayment.', 'error'); }
    });
  };

  window.deleteRepayment = function (loanId, paymentId) {
    confirmDelete('Delete this repayment?', async () => {
      try {
        const res = await apiWrite('DELETE', `/api/loans/${encodeURIComponent(loanId)}/payments/${encodeURIComponent(paymentId)}`);
        closeModal();
        if (res.success) { renderLoanDetail(loanId); showToast('Repayment deleted.'); }
        else { showToast('Failed to delete repayment.', 'error'); }
      } catch (e) { if (e.message !== 'Session expired') showToast('Error deleting repayment.', 'error'); }
    });
  };

  /* Clone transaction */
  window.cloneTransaction = async function (id) {
    try {
      const res = await apiFetch(`/api/transactions/${encodeURIComponent(id)}`);
      if (!res.success) { showToast('Failed to load transaction.', 'error'); return; }
      const tx = res.data;
      openAddTransaction({
        title: tx.title + ' (copy)',
        amount: tx.amount,
        currency: tx.currency,
        type: tx.type,
        accountId: tx.accountId,
        categoryId: tx.categoryId,
        note: tx.note,
        payee: tx.payee,
        tags: tx.tags,
        paymentMethod: tx.paymentMethod,
      });
    } catch (e) { if (e.message !== 'Session expired') showToast('Error cloning transaction.', 'error'); }
  };
