  /* ══════════════════════════════════════════════════════
     PAGE: Analytics
  ══════════════════════════════════════════════════════ */
  async function renderAnalytics() {
    /* default date range = current month */
    const now   = new Date();
    const y     = now.getFullYear();
    const m     = String(now.getMonth() + 1).padStart(2,'0');
    const defFrom = `${y}-${m}-01`;
    const lastDay = new Date(y, now.getMonth()+1, 0).getDate();
    const defTo   = `${y}-${m}-${String(lastDay).padStart(2,'0')}`;

    const params    = new URLSearchParams(location.hash.split('?')[1] || '');
    const dateFrom  = params.get('dateFrom') || defFrom;
    const dateTo    = params.get('dateTo')   || defTo;
    const txType    = params.get('txType')   || 'EXPENSE';

    showSpinner();
    try {
      const [bdRes, cfRes] = await Promise.all([
        apiFetch(`/api/analytics/category-breakdown?dateFrom=${dateFrom}&dateTo=${dateTo}&type=${txType}`),
        apiFetch(`/api/analytics/cash-flow?dateFrom=${dateFrom}&dateTo=${dateTo}&granularity=MONTH`),
      ]);
      const breakdown = bdRes.success ? (bdRes.data || []) : [];
      const cashFlow  = cfRes.success ? (cfRes.data || []) : [];

      let html = `<h2 class="section-title">Analytics</h2>
        <div class="card" style="margin-bottom:20px">
          <div style="display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px">
            <div class="form-field" style="margin:0;flex:1;min-width:140px">
              <label>From</label><input type="date" id="an-from" value="${esc(dateFrom)}">
            </div>
            <div class="form-field" style="margin:0;flex:1;min-width:140px">
              <label>To</label><input type="date" id="an-to" value="${esc(dateTo)}">
            </div>
            <div class="form-field" style="margin:0">
              <label>Type</label>
              <select id="an-type">
                <option value="EXPENSE" ${txType==='EXPENSE'?'selected':''}>Expense</option>
                <option value="INCOME" ${txType==='INCOME'?'selected':''}>Income</option>
              </select>
            </div>
            <button class="btn btn-primary btn-sm" onclick="applyAnalyticsFilters()" style="align-self:flex-end;margin-bottom:14px">Apply</button>
          </div>
        </div>`;

      /* ── Two-col charts ─ */
      html += '<div class="two-col">';

      /* ── Donut chart ─ */
      let donutHtml = '';
      if (!breakdown.length) {
        donutHtml = '<p class="empty-state">No category data for this period.</p>';
      } else {
        let top = breakdown.slice(0, 8);
        const rest = breakdown.slice(8);
        if (rest.length) {
          const otherAmt = rest.reduce((s, c) => s + (c.amount || 0), 0);
          top.push({ categoryName: 'Other', amount: otherAmt, percentage: rest.reduce((s,c)=>s+(c.percentage||0),0) });
        }
        const slices = top.map((c, i) => ({
          label: c.categoryName, value: c.amount, color: CHART_COLORS[i % CHART_COLORS.length]
        }));
        let legend = '<div class="chart-legend" style="margin-top:12px">';
        top.forEach((c, i) => {
          legend += `<div class="legend-item">
            <div class="legend-dot" style="background:${esc(CHART_COLORS[i%CHART_COLORS.length])}"></div>
            <span>${esc(c.categoryName)}</span>
            <span style="color:var(--text-muted);margin-left:4px">${fmtRaw(c.amount)} (${fmtRaw(c.percentage || 0, 1)}%)</span>
          </div>`;
        });
        legend += '</div>';
        donutHtml = `<div style="display:flex;justify-content:center">${svgDonut(slices,180)}</div>${legend}`;
      }
      html += `<div class="card"><div class="section-sub">Category Breakdown (${esc(txType)})</div>${donutHtml}</div>`;

      /* ── Bar chart ─ */
      let barHtml = '';
      if (!cashFlow.length) {
        barHtml = '<p class="empty-state">No cash flow data for this period.</p>';
      } else {
        const points = cashFlow.map(p => ({ label: p.label, income: p.income || 0, expense: p.expense || 0 }));
        barHtml = svgBars(points, 400, 140);
        barHtml += `<div class="chart-legend" style="margin-top:8px">
          <div class="legend-item"><div class="legend-dot" style="background:var(--success)"></div><span>Income</span></div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--danger)"></div><span>Expense</span></div>
        </div>`;
        /* net row */
        barHtml += '<div style="margin-top:12px"><div class="table-wrap"><table><thead><tr><th>Period</th><th>Income</th><th>Expense</th><th>Net</th></tr></thead><tbody>';
        cashFlow.forEach(p => {
          const net = (p.income||0) - (p.expense||0);
          const netClass = net >= 0 ? 'amount-income' : 'amount-expense';
          const sign = net >= 0 ? '+' : '−';
          barHtml += `<tr>
            <td>${esc(p.label)}</td>
            <td class="amount-income">+${fmtRaw(p.income||0)}</td>
            <td class="amount-expense">−${fmtRaw(p.expense||0)}</td>
            <td class="${netClass}">${sign}${fmtRaw(Math.abs(net))}</td>
          </tr>`;
        });
        barHtml += '</tbody></table></div></div>';
      }
      html += `<div class="card"><div class="section-sub">Cash Flow</div>${barHtml}</div>`;

      html += '</div>'; /* end two-col */
      setContent(html);
    } catch (e) { if (e.message !== 'Session expired') showError('Error loading analytics.'); }
  }

  window.applyAnalyticsFilters = function () {

    if (txType) p.set('txType',   txType);
    location.hash = '#/analytics?' + p.toString();
  };

  /* Which filter controls each payload type supports */
  const CARD_FILTER_CAPS = {
    NetWorth:              { timeline:true,  txType:false, account:false, category:false, amount:false, status:false, payee:false, granularity:false, refetch:false },
    CashFlow:              { timeline:true,  txType:false, account:false, category:false, amount:false, status:false, payee:false, granularity:false, refetch:false },
    CurrencyBalances:      { timeline:true,  txType:false, account:false, category:false, amount:false, status:false, payee:false, granularity:false, refetch:false },
    Accounts:              { timeline:true,  txType:false, account:false, category:false, amount:false, status:false, payee:false, granularity:false, refetch:false },
    Budgets:               { timeline:false, txType:false, account:false, category:false, amount:false, status:false, payee:false, granularity:false, refetch:false },
    PlannedPayments:       { timeline:false, txType:true,  account:false, category:false, amount:false, status:false, payee:false, granularity:false, refetch:false },
    Loans:                 { timeline:false, txType:false, account:false, category:false, amount:false, status:false, payee:false, granularity:false, refetch:false },
    RecentActivities:      { timeline:true,  txType:true,  account:true,  category:true,  amount:true,  status:true,  payee:true,  granularity:false, refetch:true  },
    CategoryBreakdown:     { timeline:true,  txType:true,  account:false, category:false, amount:false, status:false, payee:false, granularity:false, refetch:true  },
    CashFlowComparison:    { timeline:true,  txType:false, account:false, category:false, amount:false, status:false, payee:false, granularity:true,  refetch:false },
    IncomeExpenseBar:      { timeline:true,  txType:false, account:false, category:false, amount:false, status:false, payee:false, granularity:true,  refetch:true  },
    CategorySpendingTrend: { timeline:true,  txType:false, account:false, category:false, amount:false, status:false, payee:false, granularity:true,  refetch:false },
    TagUpSetPlot:          { timeline:true,  txType:false, account:false, category:false, amount:false, status:false, payee:false, granularity:false, refetch:false },
  };

  window.openCardFilterSheet = function (cardId, payloadType, cardType) {
    const caps = CARD_FILTER_CAPS[payloadType] || {};
    const ov   = cardOverrides[cardId] || {};

    let body = '';

    if (caps.timeline) {
      const tl = ov.timelineType || 'ALL_TIME';
      body += `<div class="form-field"><label>Period</label>
        <select id="cf-timeline" onchange="toggleCustomDates()">
          ${['ALL_TIME','TODAY','THIS_WEEK','THIS_MONTH','LAST_MONTH','THIS_QUARTER','THIS_YEAR','LAST_YEAR','CUSTOM'].map(v=>
            `<option value="${v}" ${tl===v?'selected':''}>${{ALL_TIME:'All Time',TODAY:'Today',THIS_WEEK:'This Week',THIS_MONTH:'This Month',LAST_MONTH:'Last Month',THIS_QUARTER:'This Quarter',THIS_YEAR:'This Year',LAST_YEAR:'Last Year',CUSTOM:'Custom Range'}[v]}</option>`
          ).join('')}
        </select>
      </div>
      <div id="cf-custom-dates" style="${tl==='CUSTOM'?'':'display:none'}">
        ${formRow(
          formField('From', `<input type="date" id="cf-from" value="${esc(ov.customFrom||'')}">`),
          formField('To',   `<input type="date" id="cf-to"   value="${esc(ov.customTo||'')}">`)
        )}
      </div>`;
    }

    if (caps.txType) {
      const cur = ov.txType || '';
      const opts = payloadType === 'RecentActivities'
        ? [['','All'],['INCOME','Income'],['EXPENSE','Expense'],['TRANSFER','Transfer']]
        : [['EXPENSE','Expense'],['INCOME','Income']];
      body += `<div class="form-field"><label>Type</label>
        <select id="cf-txtype">
          ${opts.map(([v,l])=>`<option value="${v}" ${cur===v?'selected':''}>${l}</option>`).join('')}
        </select>
      </div>`;
    }

    if (caps.account) {
      body += `<div class="form-field"><label>Account</label>
        <select id="cf-account">
          <option value="">All Accounts</option>
          ${cachedAccounts.map(a=>`<option value="${esc(a.id)}" ${ov.accountId===a.id?'selected':''}>${esc(a.name)} (${esc(a.currency)})</option>`).join('')}
        </select>
      </div>`;
    }

    if (caps.category) {
      body += `<div class="form-field"><label>Category</label>
        <select id="cf-category">
          <option value="">All Categories</option>
          ${cachedCategories.map(c=>`<option value="${esc(c.id)}" ${String(ov.categoryId)===String(c.id)?'selected':''}>${esc(c.name)}</option>`).join('')}
        </select>
      </div>`;
    }

    if (caps.amount) {
      body += formRow(
        formField('Min Amount', `<input type="number" id="cf-min" value="${esc(ov.minAmount||'')}" placeholder="0.00" min="0" step="0.01">`),
        formField('Max Amount', `<input type="number" id="cf-max" value="${esc(ov.maxAmount||'')}" placeholder="any" min="0" step="0.01">`)
      );
    }

    if (caps.status) {
      body += `<div class="form-field"><label>Status</label>
        <select id="cf-status">
          <option value="" ${!ov.status?'selected':''}>All</option>
          <option value="CLEARED"   ${ov.status==='CLEARED'?'selected':''}>Cleared</option>
          <option value="UNCLEARED" ${ov.status==='UNCLEARED'?'selected':''}>Uncleared</option>
          <option value="RECONCILE" ${ov.status==='RECONCILE'?'selected':''}>Reconcile</option>
        </select>
      </div>`;
    }

    if (caps.payee) {
      body += formField('Payee', `<input type="text" id="cf-payee" value="${esc(ov.payee||'')}" placeholder="Search payee…">`);
    }

    if (caps.granularity) {
      const g = ov.granularity || 'MONTH';
      body += `<div class="form-field"><label>Granularity</label>
        <select id="cf-gran">
          <option value="DAY"   ${g==='DAY'?'selected':''}>Day</option>
          <option value="WEEK"  ${g==='WEEK'?'selected':''}>Week</option>
          <option value="MONTH" ${g==='MONTH'?'selected':''}>Month</option>
        </select>
      </div>`;
    }

    if (!Object.values(caps).some(Boolean)) {
      body = '<div class="alert alert-warn" style="font-size:0.85rem">This card\'s filters are managed by the Android app. No web-editable filters are available.</div>';
    }

    const hasReset = Object.keys(ov).length > 0;
    if (hasReset) {
      body += `<div style="margin-top:4px"><button class="btn btn-ghost btn-sm" onclick="resetCardFilter('${esc(cardId)}','${esc(payloadType)}','${esc(cardType)}')">✕ Reset to default</button></div>`;
    }

    if (!caps.refetch && Object.values(caps).some(Boolean)) {
      body += '<div class="alert alert-warn" style="font-size:0.85rem;margin-top:12px">Filters for this card are stored in the Android app config. The override you set here is session-only and will be reflected on next dashboard reload.</div>';
    }

    openModal(`⚙️ Filter — ${esc(document.querySelector(`[data-card-id="${cardId}"] .dash-card-title`)?.textContent || payloadType)}`, body, () => applyCardFilter(cardId, payloadType, cardType, caps), 'Apply Filter');
    modalConfBtn.className = 'btn btn-primary';
  };

  window.toggleCustomDates = function () {
    const tl = document.getElementById('cf-timeline')?.value;
    const el = document.getElementById('cf-custom-dates');
    if (el) el.style.display = tl === 'CUSTOM' ? '' : 'none';
  };

  window.applyCardFilter = function (cardId, payloadType, cardType, caps) {
    const get = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
    const ov = {};
    if (caps.timeline)    { ov.timelineType = get('cf-timeline'); ov.customFrom = get('cf-from'); ov.customTo = get('cf-to'); }
    if (caps.txType)      ov.txType     = get('cf-txtype');
    if (caps.account)     ov.accountId  = get('cf-account');
    if (caps.category)    ov.categoryId = get('cf-category');
    if (caps.amount)      { ov.minAmount = get('cf-min'); ov.maxAmount = get('cf-max'); }
    if (caps.status)      ov.status     = get('cf-status');
    if (caps.payee)       ov.payee      = get('cf-payee');
    if (caps.granularity) ov.granularity= get('cf-gran');

    /* Only store if something meaningful was set */
    const isEmpty = !Object.values(ov).some(v=>v && v!=='ALL_TIME');
    if (isEmpty) { delete cardOverrides[cardId]; }
    else         { cardOverrides[cardId] = ov; }

    closeModal();

    /* Update filter badge in header immediately */
    const badgeEl = document.querySelector(`[data-card-id="${cardId}"] .dash-card-header .filter-badge`);
    const newBadge = filterBadge(isEmpty ? null : ov);
    if (badgeEl) { badgeEl.outerHTML = newBadge || ''; }
    else if (newBadge) {
      const titleEl = document.querySelector(`[data-card-id="${cardId}"] .dash-card-title`);
      if (titleEl) titleEl.insertAdjacentHTML('afterend', newBadge);
    }

    /* Refresh card content if this type supports live re-fetch */
    if (caps.refetch && !isEmpty) {
      refreshCardContent(cardId, payloadType, cardType);
    }
  };

  window.resetCardFilter = function (cardId, payloadType, cardType) {
    delete cardOverrides[cardId];
    closeModal();
    /* Remove badge */
    const badgeEl = document.querySelector(`[data-card-id="${cardId}"] .dash-card-header .filter-badge`);
    if (badgeEl) badgeEl.remove();
    /* Reload dashboard to get server-computed data */
    renderDashboard();
  };

  /* ══════════════════════════════════════════════════════
     DASHBOARD: Card management (add / remove / reorder)
  ══════════════════════════════════════════════════════ */
  /* type = CardType.name (used to match card.cardType from response)
     serialName = CardType.serialName (sent to POST /api/dashboard/cards) */
  const ALL_CARD_TYPES = [
    { type:'NET_WORTH',               serialName:'net_worth',                label:'Net Worth' },
    { type:'CASH_FLOW',               serialName:'cash_flow',                label:'Cash Flow' },
    { type:'CURRENCY_BALANCES',       serialName:'currency_balances',        label:'Currency Balances' },
    { type:'ACCOUNTS',                serialName:'accounts',                 label:'Accounts' },
    { type:'BUDGETS',                 serialName:'budgets',                  label:'Budgets' },
    { type:'PLANNED_PAYMENTS',        serialName:'planned_payments',         label:'Planned Payments' },
    { type:'LOANS',                   serialName:'loans',                    label:'Loans' },
    { type:'RECENT_ACTIVITIES',       serialName:'recent_activities',        label:'Recent Activities' },
    { type:'CATEGORY_PIE_CHART',      serialName:'category_breakdown',       label:'Category Pie Chart' },
    { type:'CATEGORY_TREEMAP',        serialName:'category_expense_treemap', label:'Category Treemap' },
    { type:'CASHFLOW_COMPARISON',     serialName:'cashflow_comparison',      label:'Cash Flow Comparison' },
    { type:'INCOME_EXPENSE_BAR',      serialName:'income_expense_bar',       label:'Income & Expense Bar' },
    { type:'CATEGORY_SPENDING_TREND', serialName:'category_spending_trend',  label:'Category Spending Trend' },
    { type:'TAG_UPSET_PLOT',          serialName:'tag_upset_plot',           label:'Tag Analysis' },
  ];

  window.openManageCards = async function () {
    let cards = [];
    try {
      const res = await apiFetch('/api/dashboard');
      if (res.success) cards = (Array.isArray(res.data) ? res.data : []).sort((a,b)=>(a.order||0)-(b.order||0));
    } catch { /* show empty */ }
    const activeTypes = new Set(cards.map(c => c.cardType));
    const cardIds = cards.map(c => c.cardId);

    let body = '';
    if (cards.length) {
      body += '<div style="font-size:0.78rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Active Cards</div>';
      cards.forEach((c, idx) => {
        body += `<div class="manage-card-row">
          <div style="display:flex;gap:3px">
            <button class="btn btn-ghost btn-sm" onclick="reorderDashboardCard(${JSON.stringify(cardIds)},${idx},-1)" ${idx===0?'disabled':''}>↑</button>
            <button class="btn btn-ghost btn-sm" onclick="reorderDashboardCard(${JSON.stringify(cardIds)},${idx},1)" ${idx===cards.length-1?'disabled':''}>↓</button>
          </div>
          <div class="manage-card-name">${esc(c.title||c.cardType)}</div>
          <button class="btn btn-sm" style="background:var(--danger);color:#fff;flex-shrink:0" onclick="removeDashboardCard('${esc(c.cardId)}')">Remove</button>
        </div>`;
      });
    }
    /* show card types not already active */
    const available = ALL_CARD_TYPES.filter(t => !activeTypes.has(t.type));
    if (available.length) {
      body += `<div style="font-size:0.78rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin:${cards.length?'20px':'0'} 0 8px">Add Card</div>
        <div class="add-card-grid">`;
      available.forEach(t => {
        /* server accepts either enum name or serialName; we send serialName which is always accepted */
        body += `<div class="add-card-btn" onclick="addDashboardCard('${esc(t.serialName)}')">+ ${esc(t.label)}</div>`;
      });
      body += '</div>';
    }
    if (!cards.length && !available.length) body = '<p class="empty-state">No cards available.</p>';

    openModal('Manage Dashboard Cards', body, null, 'Done');
    modalConfBtn.onclick = closeModal;
  };

  window.addDashboardCard = async function (serialName) {
    try {
      const res = await apiWrite('POST', '/api/dashboard/cards', { cardType: serialName });
      if (res.success) { closeModal(); renderDashboard(); }
      else alert('Failed to add card: ' + (res.error || ''));
    } catch (e) { if (e.message !== 'Session expired') alert('Error adding card.'); }
  };

  window.removeDashboardCard = async function (cardId) {
    try {
      const res = await apiWrite('DELETE', `/api/dashboard/cards/${encodeURIComponent(cardId)}`);
      if (res.success) { closeModal(); renderDashboard(); }
      else alert('Failed to remove card: ' + (res.error || ''));
    } catch (e) { if (e.message !== 'Session expired') alert('Error removing card.'); }
  };

  window.reorderDashboardCard = async function (cardIds, idx, dir) {
    const newIds = [...cardIds];
    const swap = idx + dir;
    if (swap < 0 || swap >= newIds.length) return;
    [newIds[idx], newIds[swap]] = [newIds[swap], newIds[idx]];
    try {
      const res = await apiWrite('PUT', '/api/dashboard/cards/reorder', { cardIds: newIds });
      if (res.success) { closeModal(); renderDashboard(); }
      else alert('Failed to reorder: ' + (res.error || ''));
    } catch (e) { if (e.message !== 'Session expired') alert('Error reordering.'); }
  };

  /* make doLogout callable from settings page button */
  window.doLogout = doLogout;

})();
</script>
</body>
</html>
