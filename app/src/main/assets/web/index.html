<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OssWallet — Web Portal</title>
<style>
  /* ── Design tokens ─────────────────────────────────────────── */
  :root {
    --bg: #ffffff; --surface: #f5f5f5; --surface2: #ececec; --border: #e0e0e0;
    --text: #1a1a1a; --text-muted: #666666;
    --accent: #1976D2; --accent-hover: #1565C0;
    --danger: #c62828; --success: #2e7d32; --warning: #f57f17;
    --sidebar-w: 230px; --header-h: 56px;
    --radius: 10px; --radius-sm: 6px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212; --surface: #1e1e1e; --surface2: #272727; --border: #2c2c2c;
      --text: #e0e0e0; --text-muted: #9e9e9e;
      --accent: #42a5f5; --accent-hover: #64b5f6;
      --danger: #ef5350; --success: #66bb6a; --warning: #ffa726;
    }
  }

  /* ── Reset ─────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); height: 100dvh; overflow: hidden; }

  /* ── App shell ─────────────────────────────────────────────── */
  #app { display: flex; flex-direction: column; height: 100%; }
  #header { display: flex; align-items: center; height: var(--header-h); padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--border); gap: 12px; flex-shrink: 0; }
  #header h1 { font-size: 1.1rem; font-weight: 600; flex: 1; }
  #main { display: flex; flex: 1; overflow: hidden; }
  #sidebar { width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0; }
  #content { flex: 1; overflow-y: auto; padding: 24px; }

  /* ── Nav ───────────────────────────────────────────────────── */
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 11px 16px; cursor: pointer; color: var(--text); text-decoration: none; font-size: 0.9rem; border-left: 3px solid transparent; }
  .nav-item:hover { background: var(--border); }
  .nav-item.active { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); border-left-color: var(--accent); font-weight: 600; }
  .nav-icon { width: 22px; text-align: center; font-size: 1rem; }
  .nav-section { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); padding: 16px 16px 4px; }

  /* ── Cards ─────────────────────────────────────────────────── */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
  .stat-label { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
  .stat-value { font-size: 1.5rem; font-weight: 700; }
  .stat-value.positive { color: var(--success); }
  .stat-value.negative { color: var(--danger); }
  .stat-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 6px; }

  /* ── Tables ────────────────────────────────────────────────── */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 10px 12px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); border-bottom: 2px solid var(--border); }
  td { padding: 11px 12px; border-bottom: 1px solid var(--border); font-size: 0.88rem; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface2); }
  .amount-income { color: var(--success); font-weight: 600; }
  .amount-expense { color: var(--danger); font-weight: 600; }

  /* ── Buttons ───────────────────────────────────────────────── */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--radius-sm); border: none; cursor: pointer; font-size: 0.88rem; font-weight: 500; transition: background 0.15s, opacity 0.15s; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--border); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { opacity: 0.85; }
  .btn-sm { padding: 4px 10px; font-size: 0.8rem; }
  .btn-icon { padding: 5px 8px; font-size: 0.9rem; background: transparent; border: none; cursor: pointer; color: var(--text-muted); border-radius: 4px; }
  .btn-icon:hover { background: var(--border); color: var(--danger); }

  /* ── Badges ────────────────────────────────────────────────── */
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.73rem; font-weight: 700; }
  .badge-income { background: #e8f5e9; color: var(--success); }
  .badge-expense { background: #ffebee; color: var(--danger); }
  .badge-transfer { background: #e3f2fd; color: var(--accent); }
  .badge-active { background: #e3f2fd; color: var(--accent); }
  .badge-settled { background: #e8f5e9; color: var(--success); }
  .badge-overdue { background: #ffebee; color: var(--danger); }
  .badge-lent { background: #e8f5e9; color: var(--success); }
  .badge-borrowed { background: #fff3e0; color: var(--warning); }
  .badge-must { background: #ffebee; color: var(--danger); }
  .badge-need { background: #fff3e0; color: var(--warning); }
  .badge-want { background: #e8f5e9; color: var(--success); }
  @media (prefers-color-scheme: dark) {
    .badge-income { background: #1b5e20; } .badge-expense { background: #b71c1c; } .badge-transfer { background: #0d47a1; }
    .badge-active { background: #0d47a1; } .badge-settled { background: #1b5e20; } .badge-overdue { background: #b71c1c; }
    .badge-lent { background: #1b5e20; } .badge-borrowed { background: #3e2000; }
    .badge-must { background: #b71c1c; } .badge-need { background: #3e2000; } .badge-want { background: #1b5e20; }
  }

  /* ── Login ─────────────────────────────────────────────────── */
  #login-page { display: flex; align-items: center; justify-content: center; min-height: 100dvh; background: var(--bg); padding: 24px; }
  .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 40px; max-width: 380px; width: 100%; }
  .login-card h2 { font-size: 1.4rem; margin-bottom: 8px; }
  .login-card p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 28px; }
  .code-input { width: 100%; padding: 14px; font-size: 1.6rem; letter-spacing: 0.35em; text-align: center; text-transform: uppercase; font-weight: 700; font-family: monospace; border: 2px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); outline: none; }
  .code-input:focus { border-color: var(--accent); }
  .error-msg { color: var(--danger); font-size: 0.85rem; margin-top: 10px; min-height: 1.2em; }
  .login-submit { width: 100%; margin-top: 20px; padding: 12px; font-size: 1rem; }

  /* ── Pagination ────────────────────────────────────────────── */
  .pagination { display: flex; align-items: center; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .page-info { font-size: 0.85rem; color: var(--text-muted); }

  /* ── Misc ──────────────────────────────────────────────────── */
  #hamburger { display: none; background: none; border: none; cursor: pointer; padding: 4px; color: var(--text); font-size: 1.4rem; }
  @media (max-width: 700px) {
    #hamburger { display: block; }
    #sidebar { position: fixed; top: 0; left: 0; height: 100%; z-index: 200; transform: translateX(-100%); transition: transform 0.25s; }
    #sidebar.open { transform: translateX(0); }
    #content { padding: 16px; }
    #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 199; }
    #overlay.visible { display: block; }
    .card-grid { grid-template-columns: 1fr; }
    .two-col { grid-template-columns: 1fr !important; }
  }
  .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 40px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-wrap { display: flex; justify-content: center; }
  .alert { padding: 12px 16px; border-radius: 8px; font-size: 0.88rem; margin-bottom: 16px; }
  .alert-warn { background: #fff3e0; color: #bf360c; border: 1px solid #ffe0b2; }
  .alert-error { background: #ffebee; color: var(--danger); border: 1px solid #ffcdd2; }
  .alert-success { background: #e8f5e9; color: var(--success); border: 1px solid #c8e6c9; }
  @media (prefers-color-scheme: dark) {
    .alert-warn { background: #3e2000; color: var(--warning); border-color: #bf360c; }
    .alert-error { background: #3b0000; color: var(--danger); border-color: #7f0000; }
    .alert-success { background: #1a3a1a; color: var(--success); border-color: #2e7d32; }
  }
  .section-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 20px; }
  .section-sub { font-size: 1rem; font-weight: 600; margin-bottom: 12px; margin-top: 8px; }
  .empty-state { text-align: center; color: var(--text-muted); padding: 40px 0; font-size: 0.92rem; }

  /* ── Page header row ───────────────────────────────────────── */
  .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .page-header .section-title { margin-bottom: 0; }

  /* ── Progress bars ─────────────────────────────────────────── */
  .progress-track { background: var(--border); border-radius: 999px; height: 8px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 999px; transition: width 0.4s; }
  .progress-green { background: var(--success); }
  .progress-orange { background: var(--warning); }
  .progress-red { background: var(--danger); }

  /* ── Form elements ─────────────────────────────────────────── */
  .form-field { margin-bottom: 14px; }
  .form-field label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.04em; }
  .form-field input, .form-field select, .form-field textarea {
    width: 100%; padding: 9px 12px; font-size: 0.9rem; border: 1px solid var(--border);
    border-radius: var(--radius-sm); background: var(--bg); color: var(--text); outline: none;
    font-family: inherit;
  }
  .form-field input:focus, .form-field select:focus, .form-field textarea:focus { border-color: var(--accent); }
  .form-field textarea { resize: vertical; min-height: 72px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* ── Filter panel ──────────────────────────────────────────── */
  .filter-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
  .filter-panel.hidden { display: none; }
  .filter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .filter-actions { display: flex; gap: 8px; margin-top: 12px; }

  /* ── Modal ─────────────────────────────────────────────────── */
  #modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    z-index: 300; align-items: center; justify-content: center;
  }
  #modal-overlay.open { display: flex; }
  #modal-box {
    background: var(--surface); border-radius: 12px; padding: 24px;
    max-width: 520px; width: 92%; max-height: 82vh; overflow-y: auto;
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
  }
  #modal-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 16px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

  /* ── Color swatch ──────────────────────────────────────────── */
  .color-swatch { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.15); vertical-align: middle; margin-right: 6px; }

  /* ── Chart legend ──────────────────────────────────────────── */
  .chart-legend { display: flex; flex-wrap: wrap; gap: 10px 20px; margin-top: 12px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  /* ── Two-col layout ────────────────────────────────────────── */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

  /* ── Toggle / switch ───────────────────────────────────────── */
  .toggle-wrap { display: flex; align-items: center; gap: 10px; }
  .toggle-wrap input[type=checkbox] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--accent); }

  /* ── Tag chip ──────────────────────────────────────────────── */
  .tag-chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .tag-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px; font-size: 0.85rem; font-weight: 600; border: 1px solid var(--border); background: var(--surface2); }
  .tag-chip .chip-count { font-size: 0.75rem; color: var(--text-muted); }

  /* ── Section divider ───────────────────────────────────────── */
  .section-divider { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

  /* ── Overdue section ───────────────────────────────────────── */
  .overdue-header { color: var(--danger); font-weight: 700; font-size: 1rem; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .upcoming-header { color: var(--warning); font-weight: 700; font-size: 1rem; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }

  /* ── Settings list ─────────────────────────────────────────── */
  .settings-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--border); }
  .settings-row:last-child { border-bottom: none; }
  .settings-label { font-weight: 600; font-size: 0.92rem; }
  .settings-value { color: var(--text-muted); font-size: 0.9rem; }

  /* ── Category indent ───────────────────────────────────────── */
  .cat-child { padding-left: 28px; }

  /* ── Dashboard cards ───────────────────────────────────────── */
  .dash-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
  .dash-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .dash-card-title { font-weight: 700; font-size: 1rem; flex: 1; min-width: 0; }
  .filter-badge { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 600; background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); white-space: nowrap; }
  .dash-card-actions { display: flex; gap: 4px; margin-left: auto; }
  .currency-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
  .currency-item { background: var(--surface2); border-radius: var(--radius-sm); padding: 12px; }
  .currency-code { font-size: 0.85rem; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  .currency-balance { font-size: 1.1rem; font-weight: 700; }
  .currency-base { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }
  .treemap-wrap { overflow-x: auto; }
  .manage-card-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .manage-card-row:last-child { border-bottom: none; }
  .manage-card-name { flex: 1; font-size: 0.9rem; font-weight: 500; }
  .add-card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; margin-top: 4px; }
  .add-card-btn { padding: 10px; text-align: center; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: background 0.15s; }
  .add-card-btn:hover { background: color-mix(in srgb, var(--accent) 15%, var(--surface2)); border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>

<!-- ───────────────────── Login ───────────────────────────── -->
<div id="login-page" style="display:none;">
  <div class="login-card">
    <h2>OssWallet Web Portal</h2>
    <p>Enter the access code shown on your phone to continue.</p>
    <input class="code-input" id="code-input" type="text" maxlength="8" placeholder="XXXXXXXX"
           autocomplete="off" autocorrect="off" spellcheck="false">
    <div class="error-msg" id="login-error"></div>
    <button class="btn btn-primary login-submit" id="login-btn">Verify</button>
  </div>
</div>

<!-- ───────────────────── App shell ───────────────────────── -->
<div id="app" style="display:none;">
  <div id="header">
    <button id="hamburger" aria-label="Menu">&#9776;</button>
    <h1>OssWallet</h1>
    <button class="btn btn-ghost" id="logout-btn" style="font-size:0.82rem; padding:6px 12px;">Log out</button>
  </div>
  <div id="main">
    <div id="overlay"></div>
    <nav id="sidebar">
      <div class="nav-section">Overview</div>
      <a class="nav-item" href="#/dashboard"><span class="nav-icon">📊</span> Dashboard</a>
      <a class="nav-item" href="#/analytics"><span class="nav-icon">📉</span> Analytics</a>
      <div class="nav-section">Finance</div>
      <a class="nav-item" href="#/records"><span class="nav-icon">📋</span> Records</a>
      <a class="nav-item" href="#/accounts"><span class="nav-icon">💳</span> Accounts</a>
      <a class="nav-item" href="#/budgets"><span class="nav-icon">📈</span> Budgets</a>
      <a class="nav-item" href="#/loans"><span class="nav-icon">🏦</span> Loans</a>
      <a class="nav-item" href="#/planned-payments"><span class="nav-icon">🔄</span> Planned</a>
      <div class="nav-section">Organize</div>
      <a class="nav-item" href="#/categories"><span class="nav-icon">🏷️</span> Categories</a>
      <a class="nav-item" href="#/tags"><span class="nav-icon">🔖</span> Tags</a>
      <div class="nav-section">System</div>
      <a class="nav-item" href="#/settings"><span class="nav-icon">⚙️</span> Settings</a>
    </nav>
    <main id="content">
      <div class="loading-wrap"><div class="spinner"></div></div>
    </main>
  </div>
</div>

<!-- ───────────────────── Modal ───────────────────────────── -->
<div id="modal-overlay">
  <div id="modal-box">
    <div id="modal-title"></div>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="modal-confirm-btn">Confirm</button>
    </div>
  </div>
</div>

<!-- ───────────────────── Script ───────────────────────────── -->
<script>
(function () {
  'use strict';

  /* ── State ────────────────────────────────────────────── */
  const baseUrl = window.location.origin;
  let token = sessionStorage.getItem('oss_token') || '';
  let cachedCategories = [];
  let cachedAccounts   = [];
  let cachedSettings   = { baseCurrency: 'USD', decimalPrecision: 2 };
  /* per-card filter overrides: { [cardId]: { timelineType, dateFrom, dateTo, transactionTypes, currencies, accountIds, categoryIds, minAmount, maxAmount } } */
  let cardOverrides = {};

  /* ── DOM refs ─────────────────────────────────────────── */
  const loginPage  = document.getElementById('login-page');
  const appPage    = document.getElementById('app');
  const content    = document.getElementById('content');
  const sidebar    = document.getElementById('sidebar');
  const overlay    = document.getElementById('overlay');
  const modalOverlay  = document.getElementById('modal-overlay');
  const modalTitle    = document.getElementById('modal-title');
  const modalBody     = document.getElementById('modal-body');
  const modalConfBtn  = document.getElementById('modal-confirm-btn');

  /* ── Boot ─────────────────────────────────────────────── */
  if (token) { showApp(); warmCache().then(() => route()); }
  else { showLogin(); }

  document.getElementById('code-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('login-btn').click();
  });
  document.getElementById('login-btn').addEventListener('click', doLogin);
  document.getElementById('logout-btn').addEventListener('click', doLogout);
  document.getElementById('hamburger').addEventListener('click', () => {
    sidebar.classList.toggle('open'); overlay.classList.toggle('visible');
  });
  overlay.addEventListener('click', closeSidebar);
  window.addEventListener('hashchange', route);
  modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });

  /* ── Auth ─────────────────────────────────────────────── */
  async function doLogin() {
    const btn   = document.getElementById('login-btn');
    const input = document.getElementById('code-input');
    const errEl = document.getElementById('login-error');
    const code  = input.value.trim().toUpperCase();
    if (code.length < 8) { errEl.textContent = 'Enter the full 8-character code.'; return; }
    btn.disabled = true; btn.textContent = 'Verifying…'; errEl.textContent = '';
    try {
      const res  = await fetch(baseUrl + '/api/auth', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ accessCode: code })
      });
      const json = await res.json();
      if (res.status === 429) {
        errEl.textContent = json.error || 'Too many attempts. Wait 60 seconds.';
      } else if (json.success && json.data?.token) {
        token = json.data.token;
        sessionStorage.setItem('oss_token', token);
        showApp();
        await warmCache();
        navigate('#/dashboard');
      } else {
        errEl.textContent = 'Incorrect code. Try again.';
      }
    } catch { errEl.textContent = 'Connection error. Is the server still running?'; }
    finally { btn.disabled = false; btn.textContent = 'Verify'; }
  }

  function doLogout() {
    token = ''; sessionStorage.removeItem('oss_token');
    cachedCategories = []; cachedAccounts = [];
    showLogin();
    document.getElementById('code-input').value = '';
    document.getElementById('login-error').textContent = '';
  }

  /* ── Cache warm-up ────────────────────────────────────── */
  async function warmCache() {
    try {
      const [catR, accR, setR] = await Promise.allSettled([
        apiFetch('/api/categories'),
        apiFetch('/api/accounts'),
        apiFetch('/api/settings')
      ]);
      if (catR.status === 'fulfilled' && catR.value?.success) cachedCategories = catR.value.data || [];
      if (accR.status === 'fulfilled' && accR.value?.success) cachedAccounts   = accR.value.data || [];
      if (setR.status === 'fulfilled' && setR.value?.success) cachedSettings   = setR.value.data || cachedSettings;
    } catch { /* non-fatal */ }
  }

    else if (hash.startsWith('#/categories'))       renderCategories();
    else if (hash.startsWith('#/analytics'))        renderAnalytics();

  function navigate(hash) { location.hash = hash; }

  function updateActiveNav(hash) {

  /* ── UI helpers ───────────────────────────────────────── */
  function showLogin() { loginPage.style.display = 'flex'; appPage.style.display = 'none'; setTimeout(() => document.getElementById('code-input').focus(), 100); }
  function showApp()   { loginPage.style.display = 'none';  appPage.style.display = 'flex'; }
  function setContent(html) { content.innerHTML = html; }
  function showSpinner() { setContent('<div class="loading-wrap"><div class="spinner"></div></div>'); }
  function showError(msg) { setContent(`<div class="alert alert-error">${esc(msg)}</div>`); }

  /* ── Formatters ───────────────────────────────────────── */
  function fmt(amount, currency) {
    try { return new Intl.NumberFormat(navigator.language, { style: 'currency', currency, minimumFractionDigits: 2 }).format(amount); }
    catch { return Number(amount).toFixed(2) + ' ' + (currency || ''); }
  }
  function fmtRaw(n, dec) {
    const d = dec ?? cachedSettings.decimalPrecision ?? 2;
    return Number(n).toLocaleString(navigator.language, { minimumFractionDigits: d, maximumFractionDigits: d });
  }
  function fmtDate(ts) {
    if (!ts) return '—';
    return new Date(ts).toLocaleDateString(navigator.language, { year: 'numeric', month: 'short', day: 'numeric' });
  }
  function fmtDateTime(ts) {
    if (!ts) return '—';
    return new Date(ts).toLocaleString(navigator.language, { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }
  function esc(str) {
    if (str == null) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  /* ── API helpers ──────────────────────────────────────── */
  async function apiFetch(path) {
    const res = await fetch(baseUrl + path, { headers: { 'Authorization': 'Bearer ' + token } });
    if (res.status === 401) { token = ''; sessionStorage.removeItem('oss_token'); showLogin(); throw new Error('Session expired'); }
    return res.json();
  }

  async function apiWrite(method, path, body) {
    const res = await fetch(baseUrl + path, {
      method,
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: body !== undefined ? JSON.stringify(body) : undefined
    });
    if (res.status === 401) { token = ''; sessionStorage.removeItem('oss_token'); showLogin(); throw new Error('Session expired'); }
    try { return await res.json(); } catch { return { success: res.ok }; }
  }

  function formField(label, inputHtml) {

  /* ── Chart helpers ────────────────────────────────────── */
  const CHART_COLORS = ['#1976D2','#2e7d32','#c62828','#f57f17','#6a1b9a','#00838f','#ad1457','#4e342e','#37474f','#558b2f'];

  function svgDonut(slices, size) {
    size = size || 180;
    if (!slices || !slices.length) return '<p class="empty-state">No data</p>';
    const total = slices.reduce((s, x) => s + (x.value || 0), 0);
    if (total === 0) return '<p class="empty-state">No data</p>';
    const r = 60, cx = size / 2, cy = size / 2, stroke = 28;
    const circ = 2 * Math.PI * r;
    let offset = 0, paths = '';
    slices.forEach((s, i) => {
      const pct  = s.value / total;
      const dash = pct * circ;
      const col  = s.color || CHART_COLORS[i % CHART_COLORS.length];
      paths += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${esc(col)}"
        stroke-width="${stroke}" stroke-dasharray="${dash.toFixed(2)} ${(circ - dash).toFixed(2)}"
        stroke-dashoffset="${(circ * 0.25 - offset).toFixed(2)}"><title>${esc(s.label)}</title></circle>`;
      offset += dash;
    });
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="display:block">${paths}</svg>`;
  }

  function svgBars(points, width, height) {
    width  = width  || 560;
    height = height || 140;
    if (!points || !points.length) return '<p class="empty-state">No data</p>';
    const maxVal  = Math.max(...points.flatMap(p => [p.income || 0, p.expense || 0])) || 1;
    const count   = points.length;
    const usableW = width - 40;
    const slotW   = Math.floor(usableW / count);
    const barW    = Math.max(4, Math.floor(slotW / 2) - 3);
    const chartH  = height - 24;
    let rects = '';
    points.forEach((p, i) => {
      const x  = 40 + i * slotW;
      const ih = Math.round(((p.income  || 0) / maxVal) * chartH);
      const eh = Math.round(((p.expense || 0) / maxVal) * chartH);
      rects += `<rect x="${x}" y="${chartH - ih}" width="${barW}" height="${Math.max(1,ih)}" fill="var(--success)" opacity="0.85"><title>Income: ${p.income}</title></rect>`;
      rects += `<rect x="${x + barW + 2}" y="${chartH - eh}" width="${barW}" height="${Math.max(1,eh)}" fill="var(--danger)" opacity="0.85"><title>Expense: ${p.expense}</title></rect>`;
      rects += `<text x="${x + barW}" y="${height - 4}" text-anchor="middle" font-size="9" fill="var(--text-muted)">${esc(String(p.label).slice(0, 6))}</text>`;
    });
    return `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" style="overflow:visible;display:block">${rects}</svg>`;
  }

  function progressBar(pct, color) {
    const cls = color || (pct < 80 ? 'progress-green' : pct < 100 ? 'progress-orange' : 'progress-red');
    const w   = Math.min(100, Math.max(0, pct));
    return `<div class="progress-track"><div class="progress-fill ${esc(cls)}" style="width:${w}%"></div></div>`;
  }

  /* Multi-line SVG chart — series:[{name,points:[],labels:[],color,opacity}] */
  function svgLineChart(seriesList, w, h) {
    w = w || 560; h = h || 160;
    if (!seriesList || !seriesList.length) return '<p class="empty-state">No data</p>';
    const first = seriesList.find(s => s.points && s.points.length);
    if (!first || !first.points.length) return '<p class="empty-state">No data</p>';
    const n = first.points.length;
    const allVals = seriesList.flatMap(s => s.points || []);
    const minVal = Math.min(0, ...allVals);
    const maxVal = Math.max(...allVals, 1);
    const range = maxVal - minVal || 1;
    const pl = 40, pr = 10, pt = 10, pb = 22;
    const cw = w - pl - pr, ch = h - pt - pb;
    let svg = '';
    for (let gi = 0; gi <= 4; gi++) {
      const gy = (pt + ch * gi / 4).toFixed(1);
      svg += `<line x1="${pl}" y1="${gy}" x2="${w - pr}" y2="${gy}" stroke="var(--border)" stroke-width="1"/>`;
    }
    seriesList.forEach(s => {
      if (!s.points || !s.points.length) return;
      const pts = s.points.map((v, i) => {
        const px = pl + (n <= 1 ? cw / 2 : i * cw / (n - 1));
        const py = pt + ch - ((v - minVal) / range) * ch;
        return `${px.toFixed(1)},${py.toFixed(1)}`;
      }).join(' ');
      svg += `<polyline points="${pts}" fill="none" stroke="${esc(s.color||'#1976D2')}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="${s.opacity!=null?s.opacity:1}"/>`;
    });
    const labels = first.labels || [];
    if (labels.length) {
      const step = Math.max(1, Math.ceil(n / 7));
      for (let i = 0; i < n; i += step) {
        const px = (pl + (n <= 1 ? cw / 2 : i * cw / (n - 1))).toFixed(1);
        svg += `<text x="${px}" y="${h - 5}" text-anchor="middle" font-size="9" fill="var(--text-muted)">${esc(String(labels[i]||'').slice(0,8))}</text>`;
      }
    }
    return `<svg width="100%" viewBox="0 0 ${w} ${h}" style="display:block;overflow:visible" preserveAspectRatio="xMidYMid meet">${svg}</svg>`;
  }

  /* Stacked bar chart — buckets:[{label,categories:[{categoryName,amount}]}] colorMap:{name:color} */
  function svgStackedBarsChart(buckets, colorMap, w, h) {
    w = w || 560; h = h || 140;
    if (!buckets || !buckets.length) return '<p class="empty-state">No data</p>';
    const maxTotal = Math.max(...buckets.map(b => (b.categories||[]).reduce((s,c)=>s+Math.abs(c.amount||0),0)), 1);
    const count = buckets.length;
    const usableW = w - 40;
    const slotW = Math.floor(usableW / count);
    const barW = Math.max(4, slotW - 4);
    const chartH = h - 24;
    let rects = '';
    buckets.forEach((b, i) => {
      const x = 40 + i * slotW;
      let y = chartH;
      (b.categories||[]).forEach((cat, ci) => {
        const bh = Math.round((Math.abs(cat.amount||0) / maxTotal) * chartH);
        if (bh > 0) {
          const color = colorMap[cat.categoryName] || CHART_COLORS[ci % CHART_COLORS.length];
          y -= bh;
          rects += `<rect x="${x}" y="${y}" width="${barW}" height="${bh}" fill="${esc(color)}" opacity="0.85"><title>${esc(cat.categoryName)}: ${fmtRaw(Math.abs(cat.amount||0))}</title></rect>`;
        }
      });
      rects += `<text x="${(x+barW/2).toFixed(1)}" y="${h-4}" text-anchor="middle" font-size="9" fill="var(--text-muted)">${esc(String(b.label||'').slice(0,6))}</text>`;
    });
    return `<svg width="100%" viewBox="0 0 ${w} ${h}" style="overflow:visible;display:block" preserveAspectRatio="none">${rects}</svg>`;
  }

  /* Horizontal-slice treemap — items:[{categoryName,amount,percentage,colorHex}] */
  function svgTreemapChart(items, w, h) {
    w = w || 560; h = h || 180;
    if (!items || !items.length) return '<p class="empty-state">No data</p>';
    const sorted = [...items].filter(x=>(x.amount||0)>0).sort((a,b)=>(b.amount||0)-(a.amount||0));
    if (!sorted.length) return '<p class="empty-state">No data</p>';
    const total = sorted.reduce((s,x)=>s+(x.amount||0),0);
    let rects='', texts='', x=0;
    sorted.forEach((item, i) => {
      const pct = (item.amount||0) / total;
      const iw = Math.round(pct * w);
      if (iw < 1) return;
      const color = item.colorHex || CHART_COLORS[i % CHART_COLORS.length];
      rects += `<rect x="${x}" y="0" width="${iw}" height="${h}" fill="${esc(color)}" opacity="0.82" rx="2"><title>${esc(item.categoryName)}: ${fmtRaw(item.amount||0)} (${fmtRaw(item.percentage||pct*100,1)}%)</title></rect>`;
      if (iw > 44) {
        const maxChars = Math.max(1, Math.floor(iw/7));
        const label = item.categoryName.length > maxChars ? item.categoryName.slice(0,maxChars)+'…' : item.categoryName;
        texts += `<text x="${(x+iw/2).toFixed(1)}" y="${(h/2-5).toFixed(1)}" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">${esc(label)}</text>`;
        texts += `<text x="${(x+iw/2).toFixed(1)}" y="${(h/2+11).toFixed(1)}" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.88)">${fmtRaw(item.percentage||pct*100,1)}%</text>`;
      }
      x += iw;
    });
    return `<svg width="100%" viewBox="0 0 ${w} ${h}" style="display:block;border-radius:6px;overflow:hidden" preserveAspectRatio="none">${rects}${texts}</svg>`;
  }

  /* Filter badge — accepts either a FilterSummaryDto (from server) or a cardOverrides entry */
  function filterBadge(fs) {
    if (!fs) return '';
    const parts = [];
    const tl = fs.timelineType;
    if (tl && tl !== 'ALL_TIME') {
      const map = { THIS_MONTH:'This Month', LAST_MONTH:'Last Month', THIS_YEAR:'This Year', LAST_YEAR:'Last Year', TODAY:'Today', THIS_WEEK:'This Week', THIS_QUARTER:'This Quarter', CUSTOM:'Custom' };
      parts.push(map[tl] || tl);
    }
    /* server FilterSummaryDto uses transactionTypes[], override uses txType string */
    if (fs.transactionTypes && fs.transactionTypes.length) parts.push(fs.transactionTypes.join('/'));
    else if (fs.txType) parts.push(fs.txType);
    if (fs.currencies && fs.currencies.length) parts.push(fs.currencies.join(', '));
    if (fs.accountIds && fs.accountIds.length) parts.push(`${fs.accountIds.length} acct`);
    if (fs.accountId) {
      const acc = cachedAccounts.find(a=>a.id===fs.accountId);
      parts.push(acc ? acc.name : 'Account');
    }
    if (fs.categoryId) {
      const cat = cachedCategories.find(c=>String(c.id)===String(fs.categoryId));
      parts.push(cat ? cat.name : 'Category');
    }
    if (fs.minAmount || fs.maxAmount) parts.push(`${fs.minAmount||0}–${fs.maxAmount||'∞'}`);
    return parts.length ? `<span class="filter-badge" title="Active filter">⚙️ ${esc(parts.join(' · '))}</span>` : '';
  }

  /* Wraps a rendered dashboard card in the standard header+body shell */
  function dashCardWrap(card, bodyHtml, payloadType) {
    const override = cardOverrides[card.cardId];
    const activeBadge = override ? filterBadge(override) : filterBadge(card.filterSummary);
    return `<div class="dash-card" data-card-id="${esc(card.cardId)}">
      <div class="dash-card-header">
        <span class="dash-card-title">${esc(card.title||'')}</span>
        ${activeBadge}
        <div class="dash-card-actions">
          <button class="btn-icon" title="Filter" onclick="openCardFilterSheet('${esc(card.cardId)}','${esc(payloadType||'')}','${esc(card.cardType||'')}')">⚙️</button>
          <button class="btn-icon" title="Remove card" onclick="removeDashboardCard('${esc(card.cardId)}')">✕</button>
        </div>
      </div>
      <div class="dash-card-body" id="card-body-${esc(card.cardId)}">${bodyHtml}</div>
    </div>`;
  }

  /* Dispatch card by payload type */
  function dispatchCardRender(card, d, payloadType) {
    switch (payloadType) {
      case 'NetWorth':          return renderNetWorthCard(card, d);
      case 'CashFlow':          return renderCashFlowCard(card, d);
      case 'CurrencyBalances':  return renderCurrencyBalancesCard(card, d);
      case 'Accounts':          return renderAccountsDashCard(card, d);
      case 'Budgets':           return renderBudgetsDashCard(card, d);
      case 'PlannedPayments':   return renderPlannedPaymentsDashCard(card, d);
      case 'Loans':             return renderLoansDashCard(card, d);
      case 'RecentActivities':  return renderRecentActivitiesCard(card, d, payloadType);
      case 'CategoryBreakdown':
        return card.cardType === 'CATEGORY_TREEMAP'
          ? renderCategoryTreemapCard(card, d, payloadType)
          : renderCategoryPieChartCard(card, d, payloadType);
      case 'CashFlowComparison':    return renderCashFlowComparisonCard(card, d, payloadType);
      case 'IncomeExpenseBar':       return renderIncomeExpenseBarCard(card, d, payloadType);
      case 'CategorySpendingTrend':  return renderCategorySpendingTrendCard(card, d, payloadType);
      case 'TagUpSetPlot':           return renderTagUpSetPlotCard(card, d);
      case 'Error':
        return dashCardWrap(card, `<div class="alert alert-error">${esc(d.message||'Error loading card.')}</div>`, payloadType);
      default:
        return dashCardWrap(card, `<p class="empty-state">Unknown card type: ${esc(d.type||card.cardType||'')}</p>`, payloadType);
    }
  }

  /* ══════════════════════════════════════════════════════
     PAGE: Dashboard
  ══════════════════════════════════════════════════════ */
  async function renderDashboard() {
    showSpinner();
    try {
      const json = await apiFetch('/api/dashboard');
      if (!json.success) { showError('Failed to load dashboard.'); return; }
      const cards = (Array.isArray(json.data) ? json.data : [])
        .filter(c => c.isEnabled !== false)
        .sort((a, b) => (a.order || 0) - (b.order || 0));

      let html = `<div class="page-header">
        <h2 class="section-title">Dashboard</h2>
        <button class="btn btn-ghost btn-sm" onclick="openManageCards()">⚙️ Manage Cards</button>
      </div>`;

      if (!cards.length) {
        html += '<div class="alert alert-warn">No dashboard cards are enabled. Click <strong>Manage Cards</strong> to add some.</div>';
      } else {
        cards.forEach(card => {
          const d = card.data || {};
          /* kotlinx.serialization uses fully-qualified class name as discriminator when no @SerialName is set */
          const payloadType = d.type ? d.type.split('.').pop() : '';
          html += dispatchCardRender(card, d, payloadType);
        });
      }
      setContent(html);
    } catch (e) { if (e.message !== 'Session expired') showError('Error loading dashboard.'); }
  }

  /* ── Individual dashboard card renderers ─────────────── */

  /* ── Timeline → {dateFrom, dateTo} in epoch ms ───────────── */
  function timelineToRange(tl, customFrom, customTo) {
    const now = new Date();
    const d0  = (y,m,day) => new Date(y,m,day).getTime();
    const y = now.getFullYear(), mo = now.getMonth();
    switch (tl) {
      case 'TODAY':         return { dateFrom: d0(y,mo,now.getDate()), dateTo: d0(y,mo,now.getDate())+86399999 };
      case 'THIS_WEEK': {   const dow = (now.getDay()+6)%7; const mon = new Date(now); mon.setDate(now.getDate()-dow);
                            return { dateFrom: d0(mon.getFullYear(),mon.getMonth(),mon.getDate()), dateTo: d0(mon.getFullYear(),mon.getMonth(),mon.getDate()+6)+86399999 }; }
      case 'THIS_MONTH':    return { dateFrom: d0(y,mo,1), dateTo: d0(y,mo+1,0)+86399999 };
      case 'LAST_MONTH':    return { dateFrom: d0(y,mo-1,1), dateTo: d0(y,mo,0)+86399999 };
      case 'THIS_QUARTER':{ const q=Math.floor(mo/3); return { dateFrom: d0(y,q*3,1), dateTo: d0(y,q*3+3,0)+86399999 }; }
      case 'THIS_YEAR':     return { dateFrom: d0(y,0,1), dateTo: d0(y,11,31)+86399999 };
      case 'LAST_YEAR':     return { dateFrom: d0(y-1,0,1), dateTo: d0(y-1,11,31)+86399999 };
      case 'CUSTOM':        return { dateFrom: customFrom ? new Date(customFrom).getTime() : null,
                                     dateTo:   customTo   ? new Date(customTo+'T23:59:59').getTime() : null };
      default:              return { dateFrom: null, dateTo: null };
    }
  }

  /* ── Convert ISO date string param to epoch ms for API ───── */
  function isoToEpoch(iso) { return iso ? new Date(iso).getTime() : null; }

  /* ── Build category-breakdown URL from override ───────────── */
  function buildBreakdownUrl(ov) {
    const { dateFrom, dateTo } = timelineToRange(ov.timelineType, ov.customFrom, ov.customTo);
    let url = '/api/analytics/category-breakdown';
    const p = new URLSearchParams();
    if (dateFrom) p.set('dateFrom', dateFrom);
    if (dateTo)   p.set('dateTo',   dateTo);
    p.set('type', ov.txType || 'EXPENSE');
    return url + '?' + p.toString();
  }

  /* ── Build cash-flow URL from override ───────────────────── */
  function buildCashFlowUrl(ov, gran) {
    const { dateFrom, dateTo } = timelineToRange(ov.timelineType, ov.customFrom, ov.customTo);
    const p = new URLSearchParams();
    if (dateFrom) p.set('dateFrom', dateFrom);
    if (dateTo)   p.set('dateTo',   dateTo);
    p.set('granularity', gran || ov.granularity || 'MONTH');
    return '/api/analytics/cash-flow?' + p.toString();
  }

  /* ── Build transactions URL from override ────────────────── */
  function buildTxUrl(ov) {
    const { dateFrom, dateTo } = timelineToRange(ov.timelineType, ov.customFrom, ov.customTo);
    const p = new URLSearchParams();
    p.set('page', '0'); p.set('limit', '30');
    if (dateFrom) p.set('dateFrom', dateFrom);
    if (dateTo)   p.set('dateTo',   dateTo);
    if (ov.txType)      p.set('type',       ov.txType);
    if (ov.accountId)   p.set('accountId',  ov.accountId);
    if (ov.categoryId)  p.set('categoryId', ov.categoryId);
    if (ov.minAmount)   p.set('minAmount',  ov.minAmount);
    if (ov.maxAmount)   p.set('maxAmount',  ov.maxAmount);
    if (ov.status)      p.set('status',     ov.status);
    if (ov.payee)       p.set('payee',      ov.payee);
    return '/api/transactions?' + p.toString();
  }

  /* ── Refresh a single card's body after filter change ────── */
  async function refreshCardContent(cardId, payloadType, cardType) {
    const el = document.getElementById('card-body-' + cardId);
    if (!el) return;
    el.innerHTML = '<div class="loading-wrap"><div class="spinner" style="width:20px;height:20px;border-width:2px;margin:20px auto"></div></div>';
    const ov = cardOverrides[cardId];
    try {
      let body = '';
      if (payloadType === 'CategoryBreakdown' && ov) {
        const res = await apiFetch(buildBreakdownUrl(ov));
        const items = res.success ? (res.data || []) : [];
        /* re-use existing render logic via a fake card object */
        const fakeCard = { cardId, cardType, title:'', filterSummary:null, data:{ type:payloadType, items } };
        body = cardType === 'CATEGORY_TREEMAP' ? renderCategoryTreemapBody(items) : renderCategoryPieBody(items);
      } else if (payloadType === 'IncomeExpenseBar' && ov) {
        const res = await apiFetch(buildCashFlowUrl(ov));
        const pts = res.success ? (res.data || []) : [];
        body = renderIncomeExpenseBody(pts, ov.granularity || 'MONTH');
      } else if (payloadType === 'RecentActivities' && ov) {
        const res = await apiFetch(buildTxUrl(ov));
        const txs = res.success ? (res.data?.items || []) : [];
        const total = res.success ? (res.data?.total || 0) : 0;
        body = renderRecentActivitiesBody(txs, total);
      } else {
        body = '<div class="alert alert-warn" style="font-size:0.85rem">Filter applied. Re-fetch not supported for this card type — changes are reflected on next dashboard reload.</div>';
      }
      el.innerHTML = body;
    } catch (e) {
      if (e.message !== 'Session expired') el.innerHTML = '<div class="alert alert-error">Error refreshing card.</div>';
    }
  }

  /* ── Pure body renderers (no dashCardWrap, used for refresh) */
  function renderCategoryPieBody(items) {
    if (!items.length) return '<p class="empty-state">No category data.</p>';
    const top8 = items.slice(0,8); const rest = items.slice(8);
    const slices = [...top8];
    if (rest.length) slices.push({ categoryName:'Other', amount:rest.reduce((s,c)=>s+(c.amount||0),0), percentage:rest.reduce((s,c)=>s+(c.percentage||0),0) });
    const cs = slices.map((c,i)=>({ label:c.categoryName, value:c.amount, color:CHART_COLORS[i%CHART_COLORS.length] }));
    let leg = '<div class="chart-legend" style="flex:1">';
    slices.forEach((c,i)=>{ leg += `<div class="legend-item"><div class="legend-dot" style="background:${esc(CHART_COLORS[i%CHART_COLORS.length])}"></div><span>${esc(c.categoryName)}</span><span style="color:var(--text-muted);margin-left:4px">${fmtRaw(c.amount||0)} (${fmtRaw(c.percentage||0,1)}%)</span></div>`; });
    return `<div style="display:flex;flex-wrap:wrap;gap:20px;align-items:center">${svgDonut(cs,160)}${leg}</div></div>`;
  }

  function renderCategoryTreemapBody(items) {
    if (!items.length) return '<p class="empty-state">No category data.</p>';
    const tm = items.map((c,i)=>({ categoryName:c.categoryName, amount:c.amount, percentage:c.percentage, colorHex:CHART_COLORS[i%CHART_COLORS.length] }));
    let leg = '<div class="chart-legend" style="margin-top:12px">';
    items.slice(0,8).forEach((c,i)=>{ leg += `<div class="legend-item"><div class="legend-dot" style="background:${esc(CHART_COLORS[i%CHART_COLORS.length])}"></div><span>${esc(c.categoryName)}</span><span style="color:var(--text-muted);margin-left:4px">${fmtRaw(c.percentage||0,1)}%</span></div>`; });
    return `<div class="treemap-wrap">${svgTreemapChart(tm,560,180)}</div>${leg}</div>`;
  }

  function renderIncomeExpenseBody(pts, gran) {
    if (!pts.length) return '<p class="empty-state">No data.</p>';
    const points = pts.map(b=>({ label:b.label, income:b.income||0, expense:b.expense||0 }));
    return `${svgBars(points,560,140)}<div class="chart-legend" style="margin-top:8px"><div class="legend-item"><div class="legend-dot" style="background:var(--success)"></div><span>Income</span></div><div class="legend-item"><div class="legend-dot" style="background:var(--danger)"></div><span>Expense</span></div><span style="font-size:0.78rem;color:var(--text-muted);margin-left:auto">${esc(String(gran||'').toLowerCase())}</span></div>`;
  }

  function renderRecentActivitiesBody(txs, total) {
    if (!txs.length) return '<p class="empty-state">No transactions found.</p>';
    let body = `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Title</th><th>Category</th><th>Account</th><th>Tags</th><th style="text-align:right">Amount</th></tr></thead><tbody>`;
    txs.forEach(tx => {
      const amtCls=tx.type==='INCOME'?'amount-income':tx.type==='EXPENSE'?'amount-expense':'';
      const sign=tx.type==='EXPENSE'?'−':tx.type==='INCOME'?'+':'';
      const bdg=tx.type==='INCOME'?'badge-income':tx.type==='EXPENSE'?'badge-expense':'badge-transfer';
      const tags=tx.tags&&tx.tags.length?tx.tags.map(t=>`<span class="badge" style="background:var(--surface2);color:var(--text);font-size:0.68rem">${esc(t)}</span>`).join(' '):'—';
      body+=`<tr><td style="white-space:nowrap">${fmtDate(tx.date)}</td><td><span class="badge ${bdg}" style="font-size:0.68rem;margin-right:4px">${esc(tx.type)}</span>${esc(tx.title)}${tx.note?`<br><small style="color:var(--text-muted)">${esc(tx.note)}</small>`:''}</td><td>${tx.categoryName?esc(tx.categoryName):'<span style="color:var(--text-muted)">—</span>'}</td><td>${esc(tx.accountName||'—')}</td><td>${tags}</td><td style="text-align:right" class="${amtCls}">${sign}${fmt(Math.abs(tx.amount||0),tx.currency)}</td></tr>`;
    });
    body += '</tbody></table></div>';
    if (total) body += `<div style="font-size:0.78rem;color:var(--text-muted);margin-top:8px;text-align:right">${total} total</div>`;
    return body;
  }

  function renderNetWorthCard(card, d) {
    const cur = d.currency || cachedSettings.baseCurrency || 'USD';
    const nwCls = (d.netWorth||0) >= 0 ? 'positive' : 'negative';
    const cfCls = (d.cashFlow||0) >= 0 ? 'positive' : 'negative';
    return dashCardWrap(card, `<div class="card-grid" style="margin-bottom:0">
      <div class="stat-card"><div class="stat-label">Net Worth</div><div class="stat-value ${nwCls}">${fmt(d.netWorth||0,cur)}</div></div>
      <div class="stat-card"><div class="stat-label">Income</div><div class="stat-value positive">+${fmt(d.income||0,cur)}</div></div>
      <div class="stat-card"><div class="stat-label">Expenses</div><div class="stat-value negative">−${fmt(d.expense||0,cur)}</div></div>
      <div class="stat-card"><div class="stat-label">Cash Flow</div><div class="stat-value ${cfCls}">${(d.cashFlow||0)>=0?'+':''}${fmt(d.cashFlow||0,cur)}</div></div>
    </div>`, 'NetWorth');
  }

  function renderCashFlowCard(card, d) {
    const cur = d.currency || cachedSettings.baseCurrency || 'USD';
    const netCls = (d.net||0) >= 0 ? 'positive' : 'negative';
    return dashCardWrap(card, `<div class="card-grid" style="margin-bottom:0">
      <div class="stat-card"><div class="stat-label">Income</div><div class="stat-value positive">+${fmt(d.income||0,cur)}</div></div>
      <div class="stat-card"><div class="stat-label">Expense</div><div class="stat-value negative">−${fmt(d.expense||0,cur)}</div></div>
      <div class="stat-card"><div class="stat-label">Net</div><div class="stat-value ${netCls}">${(d.net||0)>=0?'+':''}${fmt(d.net||0,cur)}</div></div>
    </div>`, 'CashFlow');
  }

  function renderCurrencyBalancesCard(card, d) {
    const items = d.items || [];
    if (!items.length) return dashCardWrap(card, '<p class="empty-state">No currency balances.</p>', 'CurrencyBalances');
    let body = '<div class="currency-grid">';
    items.forEach(item => {
      const cls = (item.balance||0) >= 0 ? 'amount-income' : 'amount-expense';
      body += `<div class="currency-item">
        <div class="currency-code">${esc(item.currency)}</div>
        <div class="currency-balance ${cls}">${fmtRaw(item.balance||0)}</div>
        ${d.baseCurrency && item.currency !== d.baseCurrency && item.balanceInBase != null
          ? `<div class="currency-base">≈ ${fmt(item.balanceInBase, d.baseCurrency)}</div>` : ''}
      </div>`;
    });
    return dashCardWrap(card, body + '</div>', 'CurrencyBalances');
  }

  function renderAccountsDashCard(card, d) {
    const accounts = d.accounts || [];
    if (!accounts.length) return dashCardWrap(card, '<p class="empty-state">No accounts.</p>', 'Accounts');
    let body = '<div class="card-grid" style="margin-bottom:0">';
    accounts.forEach(acc => {
      const cls = (acc.balance||0) >= 0 ? 'positive' : 'negative';
      body += `<div class="stat-card">
        <div style="font-weight:600;margin-bottom:6px">${esc(acc.name)}</div>
        <div class="stat-value ${cls}" style="font-size:1.1rem">${fmt(acc.balance||0,acc.currency)}</div>
        ${acc.income != null ? `<div style="font-size:0.78rem;margin-top:6px;display:flex;gap:10px"><span class="amount-income">+${fmtRaw(acc.income||0)}</span><span class="amount-expense">−${fmtRaw(acc.expense||0)}</span></div>` : ''}
        <div style="margin-top:8px"><a class="btn btn-ghost btn-sm" href="#/records?accountId=${esc(acc.id)}&accountName=${encodeURIComponent(acc.name)}">Records</a></div>
      </div>`;
    });
    return dashCardWrap(card, body + '</div>', 'Accounts');
  }

  function renderBudgetsDashCard(card, d) {
    const items = d.items || [];
    if (!items.length) return dashCardWrap(card, '<p class="empty-state">No budgets.</p>', 'Budgets');
    let body = '';
    items.forEach(b => {
      const pct = Math.round(b.percentage||0);
      const alertCls = b.alertLevel==='EXCEEDED'?'progress-red':b.alertLevel==='WARNING'?'progress-orange':'progress-green';
      const archived = b.isArchived ? '<span class="badge" style="background:var(--border);color:var(--text-muted);font-size:0.68rem">Archived</span>' : '';
      body += `<div style="margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;gap:8px">
          <span style="font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.name)} ${archived}</span>
          <span style="font-size:0.78rem;color:var(--text-muted);white-space:nowrap">${esc(b.period||'')}</span>
          <span style="font-weight:700;white-space:nowrap;color:${b.alertLevel==='EXCEEDED'?'var(--danger)':b.alertLevel==='WARNING'?'var(--warning)':'var(--success)'}">${pct}%</span>
        </div>
        ${progressBar(pct,alertCls)}
        <div style="display:flex;justify-content:space-between;font-size:0.78rem;color:var(--text-muted);margin-top:3px;flex-wrap:wrap;gap:4px">
          <span>Spent: ${fmt(b.spent||0,b.currency)}</span>
          <span>Remaining: ${fmt(b.remaining||0,b.currency)}</span>
          <span>Limit: ${fmt(b.limitAmount||0,b.currency)}</span>
        </div>
      </div>`;
    });
    return dashCardWrap(card, body, 'Budgets');
  }

  function renderPlannedPaymentsDashCard(card, d) {
    const upcoming = d.upcoming||[], overdue = d.overdue||[];
    if (!upcoming.length && !overdue.length) return dashCardWrap(card, '<p class="empty-state">No upcoming or overdue payments.</p>', 'PlannedPayments');
    let body = '';
    if (overdue.length) {
      body += `<div style="margin-bottom:12px"><div class="overdue-header" style="font-size:0.9rem">⚠️ Overdue (${overdue.length})</div>
        <div class="table-wrap"><table><thead><tr><th>Name</th><th>Amount</th><th>Due</th><th>Account</th><th>Actions</th></tr></thead><tbody>`;
      overdue.forEach(p => {
        body += `<tr><td>${esc(p.name)}<br><small style="color:var(--text-muted)">${esc(p.recurrenceDescription||'')}</small></td><td>${fmt(p.amount||0,p.currency)}</td><td style="color:var(--danger);white-space:nowrap">${fmtDate(p.nextDueDate)}</td><td>${esc(p.accountName||'—')}</td><td style="white-space:nowrap"><button class="btn btn-sm btn-primary" onclick="confirmPlanned('${esc(p.id)}')">✓</button> <button class="btn btn-sm btn-ghost" onclick="skipPlanned('${esc(p.id)}')">Skip</button></td></tr>`;
      });
      body += '</tbody></table></div></div>';
    }
    if (upcoming.length) {
      body += `<div><div class="upcoming-header" style="font-size:0.9rem">📅 Upcoming (${upcoming.length})</div>
        <div class="table-wrap"><table><thead><tr><th>Name</th><th>Amount</th><th>Due</th><th>Recurrence</th><th>Category</th></tr></thead><tbody>`;
      upcoming.forEach(p => {
        body += `<tr><td>${esc(p.name)}</td><td>${fmt(p.amount||0,p.currency)}</td><td style="white-space:nowrap">${fmtDate(p.nextDueDate)}</td><td><small style="color:var(--text-muted)">${esc(p.recurrenceDescription||'—')}</small></td><td>${esc(p.categoryName||'—')}</td></tr>`;
      });
      body += '</tbody></table></div></div>';
    }
    return dashCardWrap(card, body, 'PlannedPayments');
  }

  function renderLoansDashCard(card, d) {
    const items = d.items||[];
    if (!items.length) return dashCardWrap(card, '<p class="empty-state">No loans.</p>', 'Loans');
    let body = '<div class="card-grid" style="margin-bottom:0">';
    items.forEach(loan => {
      const rp = Math.round(((loan.totalPaid||0)/(loan.principalAmount||1))*100);
      const tb = loan.loanType==='LENT'?'badge-lent':'badge-borrowed';
      const sb = loan.status==='SETTLED'?'badge-settled':'badge-active';
      body += `<div class="stat-card"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px"><div><div style="font-weight:700">${esc(loan.name)}</div><div style="font-size:0.78rem;color:var(--text-muted)">${esc(loan.lenderOrBorrowerName||'')}</div></div><div style="display:flex;flex-direction:column;gap:3px;align-items:flex-end"><span class="badge ${tb}">${esc(loan.loanType)}</span><span class="badge ${sb}">${esc(loan.status)}</span></div></div><div style="font-weight:700;margin-bottom:6px">${fmt(loan.principalAmount||0,loan.currency)}</div>${progressBar(rp,rp>=100?'progress-green':'progress-orange')}<div style="display:flex;justify-content:space-between;font-size:0.78rem;color:var(--text-muted);margin-top:3px"><span>Paid: ${fmt(loan.totalPaid||0,loan.currency)}</span><span>Left: ${fmt(loan.remainingBalance||0,loan.currency)}</span></div>${loan.interestAccrued?`<div style="font-size:0.78rem;color:var(--warning);margin-top:2px">Interest: ${fmt(loan.interestAccrued,loan.currency)}</div>`:''}</div>`;
    });
    return dashCardWrap(card, body + '</div>', 'Loans');
  }

  function renderRecentActivitiesCard(card, d, payloadType) {
    const body = renderRecentActivitiesBody(d.transactions||[], d.total||0);
    return dashCardWrap(card, body, payloadType||'RecentActivities');
  }

  function renderCategoryPieChartCard(card, d, payloadType) {
    return dashCardWrap(card, renderCategoryPieBody(d.items||[]), payloadType||'CategoryBreakdown');
  }

  function renderCategoryTreemapCard(card, d, payloadType) {
    return dashCardWrap(card, renderCategoryTreemapBody(d.items||[]), payloadType||'CategoryBreakdown');
  }

  function renderCashFlowComparisonCard(card, d, payloadType) {
    const current=d.current||[], previous=d.previous||[], lastYear=d.lastYear||[];
    if (!current.length) return dashCardWrap(card, '<p class="empty-state">No comparison data.</p>', payloadType);
    const labels = current.map(p=>p.label||'');
    const series = [
      { name:'Current',   color:'#1976D2', opacity:1,    labels, points:current.map(p=>p.net||0) },
      { name:'Previous',  color:'#9e9e9e', opacity:0.7,  labels, points:previous.map(p=>p.net||0) },
      { name:'Last Year', color:'#bdbdbd', opacity:0.55, labels, points:lastYear.map(p=>p.net||0) },
    ].filter(s=>s.points.length && s.points.some(v=>v!==0));
    const body = `${svgLineChart(series,560,160)}<div class="chart-legend" style="margin-top:10px">${series.map(s=>`<div class="legend-item"><div class="legend-dot" style="background:${esc(s.color)}"></div><span>${esc(s.name)}</span></div>`).join('')}</div>`;
    return dashCardWrap(card, body, payloadType);
  }

  function renderIncomeExpenseBarCard(card, d, payloadType) {
    const buckets = d.buckets||[];
    const body = renderIncomeExpenseBody(buckets, d.granularity) +
      (d.baseCurrency?`<span style="font-size:0.78rem;color:var(--text-muted)">in ${esc(d.baseCurrency)}</span>`:'');
    return dashCardWrap(card, buckets.length ? body : '<p class="empty-state">No data.</p>', payloadType||'IncomeExpenseBar');
  }

  function renderCategorySpendingTrendCard(card, d, payloadType) {
    const buckets = d.buckets||[];
    if (!buckets.length) return dashCardWrap(card, '<p class="empty-state">No spending trend data.</p>', payloadType);
    const allCats = [...new Set(buckets.flatMap(b=>(b.categories||[]).map(c=>c.categoryName)))];
    const colorMap = {}; allCats.forEach((name,i)=>{ colorMap[name]=CHART_COLORS[i%CHART_COLORS.length]; });
    const catTotals = {};
    buckets.forEach(b=>(b.categories||[]).forEach(c=>{ catTotals[c.categoryName]=(catTotals[c.categoryName]||0)+Math.abs(c.amount||0); }));
    const topCats = Object.entries(catTotals).sort((a,b)=>b[1]-a[1]).slice(0,8);
    let legend = '<div class="chart-legend" style="margin-top:12px">';
    topCats.forEach(([name,total])=>{ legend+=`<div class="legend-item"><div class="legend-dot" style="background:${esc(colorMap[name]||'#9e9e9e')}"></div><span>${esc(name)}</span><span style="color:var(--text-muted);margin-left:4px">${fmtRaw(total)}</span></div>`; });
    legend += '</div>';
    return dashCardWrap(card, `${svgStackedBarsChart(buckets,colorMap,560,140)}${legend}`, payloadType);
  }

  function renderTagUpSetPlotCard(card, d) {
    const sets=d.sets||[], inters=d.intersections||[];
    if (!sets.length) return dashCardWrap(card, '<p class="empty-state">No tag data.</p>', 'TagUpSetPlot');
    const maxAmt = Math.max(...sets.map(s=>Math.abs(s.totalAmount||0)),1);
    let body = '<div style="margin-bottom:16px">';
    sets.forEach(s => {
      const pct = Math.min(100, Math.round(Math.abs(s.totalAmount||0)/maxAmt*100));
      const isInc = (s.totalAmount||0) >= 0;
      body += `<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;align-items:center;font-size:0.85rem;margin-bottom:3px;gap:8px"><span style="font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.tagName)}</span><span class="${isInc?'amount-income':'amount-expense'}">${isInc?'+':'−'}${fmtRaw(Math.abs(s.totalAmount||0))}</span><span style="color:var(--text-muted);font-size:0.78rem;white-space:nowrap">${s.transactionCount||0} txns</span></div><div class="progress-track"><div class="progress-fill ${isInc?'progress-green':'progress-orange'}" style="width:${pct}%"></div></div></div>`;
    });
    body += '</div>';
    if (inters.length) {
      body += `<div style="font-size:0.85rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px">Top Intersections</div><div class="table-wrap"><table><thead><tr><th>Tags</th><th style="text-align:right">Amount</th><th>Txns</th></tr></thead><tbody>`;
      inters.slice(0,10).forEach(inter => {
        const isInc=(inter.amount||0)>=0;
        const bdgs=(inter.tags||[]).map(t=>`<span class="badge" style="background:var(--surface2);color:var(--text);font-size:0.7rem">${esc(t)}</span>`).join(' ');
        body+=`<tr><td>${bdgs}</td><td style="text-align:right" class="${isInc?'amount-income':'amount-expense'}">${isInc?'+':'−'}${fmtRaw(Math.abs(inter.amount||0))}</td><td>${inter.transactionCount||0}</td></tr>`;
      });
      body += '</tbody></table></div>';
    }
    return dashCardWrap(card, body, 'TagUpSetPlot');
  }

  /* ══════════════════════════════════════════════════════
     PAGE: Records
  ══════════════════════════════════════════════════════ */
  async function renderRecords() {
    const params      = new URLSearchParams(location.hash.split('?')[1] || '');
    const accountId   = params.get('accountId') || '';
    const accountName = params.get('accountName') ? decodeURIComponent(params.get('accountName')) : '';
    const page        = parseInt(params.get('page') || '0', 10);
    const type        = params.get('type') || '';
    const dateFrom    = params.get('dateFrom') || '';
    const dateTo      = params.get('dateTo') || '';
    const categoryId  = params.get('categoryId') || '';
    const minAmount   = params.get('minAmount') || '';
    const maxAmount   = params.get('maxAmount') || '';
    const status      = params.get('status') || '';
    const payee       = params.get('payee') || '';
    const filtersOpen = params.get('filtersOpen') === '1';

    showSpinner();
    try {
      let url = `/api/transactions?page=${page}&limit=25`;
      if (accountId)  url += `&accountId=${encodeURIComponent(accountId)}`;
      if (type)       url += `&type=${encodeURIComponent(type)}`;
      if (dateFrom)   url += `&dateFrom=${encodeURIComponent(dateFrom)}`;
      if (dateTo)     url += `&dateTo=${encodeURIComponent(dateTo)}`;
      if (categoryId) url += `&categoryId=${encodeURIComponent(categoryId)}`;
      if (minAmount)  url += `&minAmount=${encodeURIComponent(minAmount)}`;
      if (maxAmount)  url += `&maxAmount=${encodeURIComponent(maxAmount)}`;
      if (status)     url += `&status=${encodeURIComponent(status)}`;
      if (payee)      url += `&payee=${encodeURIComponent(payee)}`;

      const json = await apiFetch(url);
      if (!json.success) { showError('Failed to load records.'); return; }
      const data = json.data || { items: [], total: 0, page: 0, limit: 25, hasMore: false };
      const title = accountName ? `Records — ${esc(accountName)}` : 'Records';

      /* build current param string (without page) for filter apply */
      function buildFilterHref(overrides) {
        const p = new URLSearchParams();
        if (accountId)  p.set('accountId', accountId);
        if (accountName) p.set('accountName', accountName);
        Object.entries(overrides).forEach(([k, v]) => { if (v) p.set(k, v); else p.delete(k); });
        p.set('page', '0');
        return '#/records?' + p.toString();
      }

      /* ── Filter panel ─ */
      const fPanel = `<div class="filter-panel${filtersOpen ? '' : ' hidden'}" id="filter-panel">
        <div class="filter-grid">
          <div class="form-field"><label>Type</label>
            <select id="f-type">
              <option value="" ${!type?'selected':''}>All</option>
              <option value="INCOME" ${type==='INCOME'?'selected':''}>Income</option>
              <option value="EXPENSE" ${type==='EXPENSE'?'selected':''}>Expense</option>
              <option value="TRANSFER" ${type==='TRANSFER'?'selected':''}>Transfer</option>
            </select>
          </div>
          <div class="form-field"><label>Category</label>
            <select id="f-cat"><option value="">All</option>${catOptions(false)}</select>

          const sign     = tx.type === 'EXPENSE' ? '−' : tx.type === 'INCOME' ? '+' : '';
          const badgeCls = tx.type === 'INCOME' ? 'badge-income' : tx.type === 'EXPENSE' ? 'badge-expense' : 'badge-transfer';
          html += `<tr>
            <td style="white-space:nowrap">${fmtDate(tx.date)}</td>
            <td>${esc(tx.title)}${tx.note ? `<br><small style="color:var(--text-muted)">${esc(tx.note)}</small>` : ''}</td>

  window.toggleRecordFilters = function () {
    const params = new URLSearchParams(location.hash.split('?')[1] || '');
    const cur = params.get('filtersOpen') === '1';
    params.set('filtersOpen', cur ? '0' : '1');
    location.hash = '#/records?' + params.toString();
  };

  window.applyRecordFilters = function () {
    const params = new URLSearchParams(location.hash.split('?')[1] || '');
    const get = id => { const el = document.getElementById(id); return el ? el.value : ''; };
    params.set('type',       get('f-type'));
    params.set('categoryId', get('f-cat'));
    params.set('dateFrom',   get('f-from'));
    params.set('dateTo',     get('f-to'));
    params.set('minAmount',  get('f-min'));
    params.set('maxAmount',  get('f-max'));
    params.set('status',     get('f-status'));
    params.set('payee',      get('f-payee'));
    params.set('page',       '0');
    params.set('filtersOpen','1');
    // clean empty
    [...params.keys()].forEach(k => { if (!params.get(k)) params.delete(k); });
    params.set('filtersOpen','1');
    location.hash = '#/records?' + params.toString();
  };

  window.clearRecordFilters = function () {
    const params = new URLSearchParams(location.hash.split('?')[1] || '');
    const keep = ['accountId','accountName'];
    const fresh = new URLSearchParams();
    keep.forEach(k => { if (params.get(k)) fresh.set(k, params.get(k)); });
    fresh.set('filtersOpen','1');
    location.hash = '#/records?' + fresh.toString();
  };

  window.submitAddTransaction = async function () {
    const get = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
    const name = get('tx-name');
    if (!name) { alert('Name is required.'); return; }
    const amount = parseFloat(get('tx-amount'));
    if (isNaN(amount) || amount <= 0) { alert('Enter a valid amount.'); return; }
    const body = {
      title:      name,
      amount,
      currency:   get('tx-currency') || cachedSettings.baseCurrency,
      type:       get('tx-type'),
      accountId:  get('tx-account'),
      categoryId: get('tx-category') || undefined,
      date:       new Date(get('tx-date') || Date.now()).toISOString(),
      note:       get('tx-note') || undefined,
      payee:      get('tx-payee') || undefined,
      status:     get('tx-status'),
      tags:       get('tx-tags') ? get('tx-tags').split(',').map(t => t.trim()).filter(Boolean) : undefined,
    };
    modalConfBtn.disabled = true; modalConfBtn.textContent = 'Saving…';
    try {
      const res = await apiWrite('POST', '/api/transactions', body);
      closeModal();
      if (res.success) { renderRecords(); } else { alert('Failed to save record: ' + (res.error || 'Unknown error')); }
    } catch (e) { if (e.message !== 'Session expired') alert('Error saving record.'); }
    finally { modalConfBtn.disabled = false; modalConfBtn.textContent = 'Save Record'; }
  };

    showSpinner();

      const [allRes, upcomingRes, overdueRes] = await Promise.all([
        apiFetch('/api/planned-payments'),
        apiFetch('/api/planned-payments/upcoming?days=30'),
        apiFetch('/api/planned-payments/overdue'),
      ]);
      const allPayments = (allRes.success  ? (allRes.data  || []) : []);
      const upcoming    = (upcomingRes.success ? (upcomingRes.data || []) : []);
      const overdue     = (overdueRes.success  ? (overdueRes.data  || []) : []);

      let html = `<div class="page-header"><h2 class="section-title">Planned Payments</h2>
        <button class="btn btn-primary btn-sm" onclick="openAddPlanned()">+ Add Planned Payment</button>
      </div>`;

      /* ── Overdue ─ */
      if (overdue.length) {
        html += `<div class="card" style="border-color:var(--danger)">
          <div class="overdue-header">⚠️ Overdue (${overdue.length})</div>
          <div class="table-wrap"><table>
            <thead><tr><th>Name</th><th>Amount</th><th>Due Date</th><th>Account</th><th>Actions</th></tr></thead><tbody>`;
        overdue.forEach(p => {
          html += `<tr>
            <td>${esc(p.name)}<br><small style="color:var(--text-muted)">${esc(p.recurrenceDescription||'')}</small></td>
            <td>${fmt(p.amount||0, p.currency)}</td>
            <td style="white-space:nowrap;color:var(--danger)">${fmtDate(p.nextDueDate)}</td>
            <td>${esc(p.accountName||'')}</td>
            <td style="white-space:nowrap">
              <button class="btn btn-sm btn-primary" onclick="confirmPlanned('${esc(p.id)}')">✓ Confirm</button>
              <button class="btn btn-sm btn-ghost" onclick="skipPlanned('${esc(p.id)}')">Skip</button>
            </td>
          </tr>`;
        });
        html += '</tbody></table></div></div>';
      }

      /* ── Upcoming ─ */
      if (upcoming.length) {
        html += `<div class="card" style="border-color:var(--warning)">
          <div class="upcoming-header">📅 Upcoming (next 30 days)</div>
          <div class="table-wrap"><table>
            <thead><tr><th>Name</th><th>Amount</th><th>Due Date</th><th>Recurrence</th><th>Actions</th></tr></thead><tbody>`;
        upcoming.forEach(p => {
          html += `<tr>
            <td>${esc(p.name)}</td>
            <td>${fmt(p.amount||0, p.currency)}</td>
            <td style="white-space:nowrap">${fmtDate(p.nextDueDate)}</td>
            <td><small style="color:var(--text-muted)">${esc(p.recurrenceDescription||'—')}</small></td>
            <td style="white-space:nowrap">
              <button class="btn btn-sm btn-primary" onclick="confirmPlanned('${esc(p.id)}')">✓ Confirm</button>
              <button class="btn btn-sm btn-ghost" onclick="skipPlanned('${esc(p.id)}')">Skip</button>
            </td>
          </tr>`;
        });
        html += '</tbody></table></div></div>';
      }

      /* ── All planned payments ─ */
      html += `<div class="section-sub">All Planned Payments</div>`;
      if (!allPayments.length) {
        html += '<p class="empty-state">No planned payments yet.</p>';
      } else {
        html += `<div class="card"><div class="table-wrap"><table>
          <thead><tr><th>Name</th><th>Amount</th><th>Next Due</th><th>Type</th><th>Status</th><th>Auto</th><th></th></tr></thead><tbody>`;
        allPayments.forEach(p => {
          const txBadge = p.transactionType === 'INCOME' ? 'badge-income' : 'badge-expense';
          html += `<tr>
            <td>${esc(p.name)}<br><small style="color:var(--text-muted)">${esc(p.recurrenceDescription||'')}</small></td>
            <td>${fmt(p.amount||0, p.currency)}</td>
            <td style="white-space:nowrap${p.isOverdue ? ';color:var(--danger)' : ''}">${fmtDate(p.nextDueDate)}</td>
            <td><span class="badge ${txBadge}">${esc(p.transactionType||'')}</span></td>
            <td><span class="badge ${p.isOverdue ? 'badge-overdue' : 'badge-active'}">${esc(p.status||'')}</span></td>
            <td>${p.autoConfirm ? '✅' : '—'}</td>
            <td><button class="btn-icon" title="Delete" onclick="deletePlanned('${esc(p.id)}','${esc(p.name)}')">🗑️</button></td>
          </tr>`;
        });
        html += '</tbody></table></div></div>';
      }

      setContent(html);
    } catch (e) { if (e.message !== 'Session expired') showError('Error loading planned payments.'); }
  }

  window.submitAddPlanned = async function () {
    const name    = document.getElementById('pp-name')?.value.trim();
    const amount  = parseFloat(document.getElementById('pp-amount')?.value || '0');
    const currency= document.getElementById('pp-currency')?.value.trim();
    const type    = document.getElementById('pp-type')?.value;
    const account = document.getElementById('pp-account')?.value;
    const cat     = document.getElementById('pp-category')?.value;
    const recur   = document.getElementById('pp-recur')?.value;

    const start   = document.getElementById('pp-start')?.value;

    modalConfBtn.disabled = true; modalConfBtn.textContent = 'Saving…';
    try {
      const res = await apiWrite('POST', '/api/planned-payments', {
        name, amount, currency, transactionType: type,
        accountId: account || undefined,
        categoryId: cat || undefined,
        recurrenceType: recur,
        recurrenceInterval: interval,
        startDate: start || undefined,
        autoConfirm: auto,
      });

      if (res.success) { renderPlannedPayments(); } else { alert('Failed to create planned payment: ' + (res.error || '')); }

  /* ══════════════════════════════════════════════════════
     PAGE: Categories
  ══════════════════════════════════════════════════════ */
  async function renderCategories() {
    showSpinner();
    try {
      const json = await apiFetch('/api/categories');
      if (!json.success) { showError('Failed to load categories.'); return; }
      cachedCategories = json.data || [];
      const parents  = cachedCategories.filter(c => !c.parentId);
      const children = cachedCategories.filter(c =>  c.parentId);

      let html = `<div class="page-header"><h2 class="section-title">Categories</h2>
        <button class="btn btn-primary btn-sm" onclick="openAddCategory()">+ Add Category</button>
      </div>`;

      if (!cachedCategories.length) {
        html += '<p class="empty-state">No categories found.</p>';
      } else {
        html += '<div class="card">';
        parents.forEach(cat => {
          html += renderCatRow(cat, false);
          children.filter(c => c.parentId === cat.id).forEach(child => {
            html += renderCatRow(child, true);
          });
        });
        /* orphan children */
        children.filter(c => !parents.find(p => p.id === c.parentId)).forEach(child => {
          html += renderCatRow(child, true);
        });
        html += '</div>';
      }
      setContent(html);
    } catch (e) { if (e.message !== 'Session expired') showError('Error loading categories.'); }
  }

  function renderCatRow(cat, indent) {
    const natureCls = cat.nature === 'MUST' ? 'badge-must' : cat.nature === 'NEED' ? 'badge-need' : 'badge-want';
    const color     = cat.colorHex || '#9e9e9e';
    const deleteBtn = !cat.isDefault
      ? `<button class="btn-icon" title="Delete" onclick="deleteCategory('${esc(cat.id)}','${esc(cat.name)}')">🗑️</button>` : '';
    return `<div style="display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);${indent ? 'padding-left:28px' : ''}">
      <span class="color-swatch" style="background:${esc(color)}"></span>
      <span style="flex:1;font-weight:${indent?'400':'600'}">${esc(cat.name)}</span>
      ${cat.nature ? `<span class="badge ${natureCls}" style="margin-right:10px">${esc(cat.nature)}</span>` : ''}
      ${cat.isDefault ? '<span style="font-size:0.75rem;color:var(--text-muted);margin-right:10px">Default</span>' : ''}
      ${deleteBtn}
    </div>`;
  }
