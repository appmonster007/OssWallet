<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OssWallet — Web Portal</title>
<link rel="stylesheet" href="/web/style.css">
</head>
<body>

<!-- ───────────────────── Login ───────────────────────────── -->
<div id="login-page" style="display:none;">
  <div class="login-card">
    <h2>OssWallet Web Portal</h2>
    <p>Enter the access code shown on your phone to continue.</p>
    <input class="code-input" id="code-input" type="text" maxlength="8" placeholder="XXXXXXXX"
           autocomplete="off" autocorrect="off" spellcheck="false">
    <div class="error-msg" id="login-error"></div>
    <button class="btn btn-primary login-submit" id="login-btn">Verify</button>
  </div>
</div>

<!-- ───────────────────── App shell ───────────────────────── -->
<div id="app" style="display:none;">
  <div id="header">
    <button id="hamburger" aria-label="Menu">&#9776;</button>
    <h1>OssWallet</h1>
    <div style="display:flex;align-items:center;gap:8px;margin-left:auto">
      <button class="btn-icon" id="theme-toggle" title="Toggle dark/light mode" style="font-size:1.1rem">🌙</button>
      <button class="btn btn-ghost" id="logout-btn" style="font-size:0.82rem; padding:6px 12px;">Log out</button>
    </div>
  </div>
  <div id="main">
    <div id="overlay"></div>
    <nav id="sidebar">
      <div class="nav-section">Overview</div>
      <a class="nav-item" href="#/dashboard"><span class="nav-icon">📊</span> Dashboard</a>
      <a class="nav-item" href="#/analytics"><span class="nav-icon">📉</span> Analytics</a>
      <div class="nav-section">Finance</div>
      <a class="nav-item" href="#/records"><span class="nav-icon">📋</span> Records</a>
      <a class="nav-item" href="#/accounts"><span class="nav-icon">💳</span> Accounts</a>
      <a class="nav-item" href="#/budgets"><span class="nav-icon">📈</span> Budgets</a>
      <a class="nav-item" href="#/loans"><span class="nav-icon">🏦</span> Loans</a>
      <a class="nav-item" href="#/planned-payments"><span class="nav-icon">🔄</span> Planned</a>
      <div class="nav-section">Organize</div>
      <a class="nav-item" href="#/templates"><span class="nav-icon">📄</span> Templates</a>
      <a class="nav-item" href="#/categories"><span class="nav-icon">🏷️</span> Categories</a>
      <a class="nav-item" href="#/tags"><span class="nav-icon">🔖</span> Tags</a>
      <a class="nav-item" href="#/filters"><span class="nav-icon">🔍</span> Filters</a>
      <div class="nav-section">System</div>
      <a class="nav-item" href="#/settings"><span class="nav-icon">⚙️</span> Settings</a>
    </nav>
    <main id="content">
      <div class="loading-wrap"><div class="spinner"></div></div>
    </main>
  </div>
</div>

<!-- ───────────────────── Modal ───────────────────────────── -->
<div id="modal-overlay">
  <div id="modal-box">
    <div id="modal-title"></div>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="modal-confirm-btn">Confirm</button>
    </div>
  </div>
</div>

<div id="nprogress"></div>
<div id="toast-container"></div>

<!-- ───────────────────── Modules ─────────────────────────── -->
<script defer src="/web/js/state.js"></script>
<script defer src="/web/js/utils.js"></script>
<script defer src="/web/js/api.js"></script>
<script defer src="/web/js/modal.js"></script>
<script defer src="/web/js/components.js"></script>
<script defer src="/web/js/ui.js"></script>
<script defer src="/web/js/pages/dashboard.js"></script>
<script defer src="/web/js/pages/accounts.js"></script>
<script defer src="/web/js/pages/transactions.js"></script>
<script defer src="/web/js/pages/budgets.js"></script>
<script defer src="/web/js/pages/loans.js"></script>
<script defer src="/web/js/pages/planned-payments.js"></script>
<script defer src="/web/js/pages/categories.js"></script>
<script defer src="/web/js/pages/analytics.js"></script>
<script defer src="/web/js/pages/tags.js"></script>
<script defer src="/web/js/pages/templates.js"></script>
<script defer src="/web/js/pages/filters.js"></script>
<script defer src="/web/js/pages/settings.js"></script>
<script defer src="/web/js/pages/cards.js"></script>
<script defer src="/web/js/app.js"></script>

</body>
</html>
