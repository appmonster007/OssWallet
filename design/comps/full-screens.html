<!DOCTYPE html>

<title>OssWallet — Full Screens · A/B/H × Light/Dark</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
body{background:#E7E8EA;font-family:'Inter',sans-serif;color:#1A1B1E;padding:40px}
h1{font-size:20px;font-weight:700}
p.sub{color:#5B5E66;font-size:13px;margin-top:6px;max-width:800px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(6,348px);gap:24px;margin-top:30px;overflow-x:auto;padding-bottom:20px}
.modetag{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#6B6E76;margin-bottom:8px}
.phone{width:348px;height:756px;border-radius:42px;overflow:hidden;position:relative;border:1px solid #C9CBD0;box-shadow:0 18px 44px rgba(20,22,28,.18)}
.scr{height:100%;overflow-y:auto;scrollbar-width:none;position:relative;z-index:1}
.scr::-webkit-scrollbar{display:none}
svg{display:block}

/* =================== A =================== */
.A{background:var(--bg);color:var(--ink)}
.A.lt{--bg:#F2EFE7;--bg2:#F7F5EE;--ink:#191714;--m2:#5A554B;--m3:#8C867A;--hair:#D9D4C7;--hairS:#B8B2A2;
  --acc:#1D3A33;--pos:#2C6E49;--neg:#9B3B30;--onAcc:#EDEDE4;--navbg:#191714;--navfg:#9B968A;--scrim:rgba(25,23,20,.25)}
.A.dk{--bg:#15130E;--bg2:#1B1913;--ink:#ECE7DA;--m2:#A39C8D;--m3:#6E6759;--hair:rgba(236,231,218,.11);--hairS:rgba(236,231,218,.22);
  --acc:#8FB39E;--pos:#7FBF8E;--neg:#D88379;--onAcc:#15130E;--navbg:#211E16;--navfg:#6E6759;--scrim:rgba(0,0,0,.5)}
.A .status{display:flex;justify-content:space-between;padding:16px 24px 0;font:600 11px 'Inter';color:var(--ink)}
.A .hd{padding:20px 24px 4px;display:flex;justify-content:space-between;align-items:flex-end}
.A .brand{font:300 11px 'Inter';letter-spacing:.26em;text-transform:uppercase;color:var(--m3)}
.A .brand b{color:var(--ink);font-weight:600}
.A .pf{width:30px;height:30px;border-radius:50%;border:1px solid var(--hairS);display:flex;align-items:center;justify-content:center;font:500 11px 'Fraunces',serif;font-style:italic;color:var(--ink)}
.A .hero{padding:26px 24px 24px;border-bottom:1px solid var(--hair)}
.A .ov{font:500 9px 'Inter';letter-spacing:.3em;text-transform:uppercase;color:var(--m3);display:flex;align-items:center;gap:10px}
.A .ov::after{content:'';flex:1;height:1px;background:var(--hair)}
.A .amt{margin-top:14px;font:300 44px/1 'Fraunces',serif;font-variant-numeric:tabular-nums}
.A .amt .sym{font-size:23px;vertical-align:26%;color:var(--m2);margin-right:3px}
.A .amt .dec{font-size:23px;color:var(--m3)}
.A .meta{margin-top:11px;font:400 12px 'Inter';color:var(--m2)}
.A .meta b{color:var(--pos);font-weight:600}
.A .spark{margin-top:16px}
.A .sect{padding:20px 24px;border-bottom:1px solid var(--hair)}
.A .sect:last-of-type{border-bottom:none}
.A .sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.A .sh h2{font:500 15px 'Fraunces',serif;font-style:italic}
.A .sh a{font:500 8.5px 'Inter';letter-spacing:.2em;text-transform:uppercase;color:var(--m3);text-decoration:none}
.A .ro{display:inline-block;font:500 8.5px 'Inter';letter-spacing:.1em;text-transform:uppercase;color:var(--m3);border-bottom:1px dotted var(--hairS);padding-bottom:2px;margin-bottom:12px}
.A .ro em{font-style:normal;font-weight:600;color:var(--acc)}
.A .cols{display:grid;grid-template-columns:1fr 1px 1fr;gap:0 18px}
.A .dv{background:var(--hair)}
.A .lab{font:500 8px 'Inter';letter-spacing:.26em;text-transform:uppercase;color:var(--m3)}
.A .v{font:400 19px 'Fraunces',serif;margin-top:7px;font-variant-numeric:tabular-nums}
.A .v.p{color:var(--pos)} .A .v.n{color:var(--neg)}
.A .ap{font:400 9px 'Inter';color:var(--m3);margin-top:2px}
.A .netr{grid-column:1/-1;margin-top:13px;padding-top:11px;border-top:1px dotted var(--hairS);display:flex;justify-content:space-between;align-items:baseline}
.A .netr span{font:500 8px 'Inter';letter-spacing:.26em;text-transform:uppercase;color:var(--m3)}
.A .netr b{font:500 15px 'Fraunces',serif;color:var(--pos)}
.A .row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dotted var(--hair)}
.A .row:last-child{border:none;padding-bottom:0}
.A .mark{width:7px;height:7px;border-radius:50%;flex:none}
.A .rn{font:500 13px 'Inter';color:var(--ink)}
.A .rt{font:400 10px 'Inter';color:var(--m3);margin-top:2px}
.A .rb{margin-left:auto;text-align:right;font:400 14.5px 'Fraunces',serif;font-variant-numeric:tabular-nums}
.A .rb.in{color:var(--pos)}
.A .rfx{font:400 9px 'Inter';color:var(--m3);margin-top:2px;text-align:right}
.A .bud{padding:10px 0;border-bottom:1px dotted var(--hair)}
.A .bud:last-child{border:none;padding-bottom:0}
.A .br{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.A .bn{font:500 12px 'Inter'}
.A .bf{font:400 10.5px 'Inter';color:var(--m3);font-variant-numeric:tabular-nums}
.A .bf b{color:var(--ink);font-weight:600}
.A .trk{height:2px;background:var(--hair);position:relative}
.A .trk i{position:absolute;inset:0;right:auto;background:var(--acc)}
.A .trk i.hot{background:var(--neg)}
.A .foot{padding:16px 24px 96px;text-align:center;font:400 9px 'Inter';letter-spacing:.2em;text-transform:uppercase;color:var(--m3)}
.A .navw{position:sticky;bottom:0;padding:12px 24px 20px;background:linear-gradient(transparent,var(--bg) 45%)}
.A .nav{background:var(--navbg);border-radius:100px;display:flex;justify-content:space-between;align-items:center;padding:7px 9px;box-shadow:0 12px 26px var(--scrim)}
.A .nav i{font-style:normal;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--navfg);font-size:15px}
.A .nav i.on{background:var(--bg);color:var(--ink)}
.A .nav i.fab{background:var(--acc);color:var(--onAcc);width:46px;height:46px;font-size:19px}

/* =================== B =================== */

.B .hero::before{content:'';position:absolute;inset:0;border-radius:20px;padding:1px;

.B .netr span{font:500 7.5px 'JetBrains Mono',monospace;letter-spacing:.24em;text-transform:uppercase;color:var(--m3)}
.B .netr b{font:600 12.5px 'JetBrains Mono',monospace;color:var(--acc)}
.B .row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--edge)}
.B .row:last-child{border:none;padding-bottom:2px}
.B .mark{width:6px;height:6px;border-radius:50%;flex:none}
.B .rn{font:600 11.5px 'Space Grotesk';color:var(--txt)}

.H .nwamt .sym{font-size:17px;vertical-align:26%;color:var(--m2);margin-right:2px}
.H .nwamt .dec{font-size:17px;color:var(--m3)}
.H .nwtr{margin-top:7px;font:500 9px 'JetBrains Mono',monospace;color:var(--pos);letter-spacing:.08em;font-variant-numeric:tabular-nums}
.H .nwtr i{font-style:normal;color:var(--m3);letter-spacing:.16em;text-transform:uppercase;margin-left:6px}
.H .nwflows{display:grid;grid-template-columns:1fr 1px 1fr;gap:0 16px;margin-top:13px;padding-top:12px;border-top:1px dashed var(--hairS)}
.H .nwlb{font:500 7.5px 'JetBrains Mono',monospace;letter-spacing:.22em;text-transform:uppercase;color:var(--m3);display:flex;justify-content:space-between}
.H .nwlb b{font-weight:500;letter-spacing:.04em}
.H .nwlb b.up{color:var(--pos)} .H .nwlb b.dn{color:var(--neg)}
.H .nwv{font:400 17px 'Fraunces',serif;margin-top:8px;font-variant-numeric:tabular-nums}
.H .nwv.p{color:var(--pos)} .H .nwv.n{color:var(--neg)}
/* H — ghost add-account row */
.H .addrow{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:11px;padding:9px 0;
  border:1px dashed var(--hairS);border-radius:12px;font:500 8px 'JetBrains Mono',monospace;letter-spacing:.24em;text-transform:uppercase;color:var(--m3)}
.H .addrow b{color:var(--acc);font-weight:400;font-size:12px}
.H .navw{position:sticky;bottom:0;padding:12px 20px 18px;background:linear-gradient(transparent,var(--bg) 55%)}
.H .nav{border:1px solid var(--hairS);background:var(--pillBg);backdrop-filter:blur(22px);border-radius:100px;display:flex;justify-content:space-between;align-items:center;padding:7px 9px}
.H .nav i{font-style:normal;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--m3);font-size:15px}
.H .nav i.on{background:var(--accDim);color:var(--acc);border:1px solid var(--accBd)}
.H .nav i.fab{background:var(--acc);color:var(--onAcc);width:46px;height:46px;font-size:19px}

/* =================== H typography switcher =================== */
.typb{display:flex;align-items:center;gap:8px;margin-top:22px}
.typb span{font-size:11px;font-weight:600;color:#5B5E66;letter-spacing:.06em;text-transform:uppercase;margin-right:4px}
.typb button{font:600 11.5px 'Inter';padding:7px 14px;border-radius:100px;border:1px solid #C9CBD0;background:#fff;color:#3A3C42;cursor:pointer}
.typb button.on{background:#1A1B1E;color:#fff;border-color:#1A1B1E}
.typb small{font-size:10.5px;color:#85888F;margin-left:6px}
/* A · Editorial — serif stays, mono micro-readouts become Inter */
body.fA .H .status,body.fA .H .ov,body.fA .H .ro,body.fA .H .lab,body.fA .H .ap,body.fA .H .rt,body.fA .H .rfx,
body.fA .H .bf,body.fA .H .foot,body.fA .H .sect a,body.fA .H .sect h2 b,body.fA .H .netr span,
body.fA .H .nwtr,body.fA .H .nwlb,body.fA .H .addrow{font-family:'Inter',sans-serif}
/* B · Instrument — amounts/headers become Space Grotesk, mono stays */
body.fB .H .amt,body.fB .H .v,body.fB .H .netr b,body.fB .H .rb,body.fB .H .sect h2,
body.fB .H .nwamt,body.fB .H .nwv,body.fB .H .pf{font-family:'Space Grotesk',sans-serif;font-style:normal;font-weight:500;letter-spacing:-.02em}
/* System default — everything Manrope (app's current AppFont default) */
body.fS .H .scr,body.fS .H .scr *{font-family:'Manrope',sans-serif!important;font-style:normal}
</style>
</head>
<body>
<h1>Full screens — A / B / H in light &amp; dark</h1>
<p class="sub">Whole-phone dashboard look for each direction and mode (scroll inside frames). Cards show period-only readouts; no filter/config buttons; glass only on floating chrome.</p>
<div class="typb">
  <span>H typography</span>
  <button data-f="" class="on">H · Hybrid</button>
  <button data-f="fA">A · Editorial</button>
  <button data-f="fB">B · Instrument</button>
  <button data-f="fS">System default</button>
  <small>live-swaps fonts on the two H frames — maps to the in-app font setting</small>
</div>
<div class="grid" id="grid"></div>

<script>
const SPARK = (color,bg)=>`<svg width="300" height="46" viewBox="0 0 300 46">
  <defs><linearGradient id="g${color.replace('#','')}" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="${color}" stop-opacity=".16"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
  <path d="M0,36 25,33 50,34 75,27 100,29 125,22 150,25 175,17 200,20 225,12 250,14 275,7 300,9 L300,46 0,46 Z" fill="url(#g${color.replace('#','')})"/>
  <polyline points="0,36 25,33 50,34 75,27 100,29 125,22 150,25 175,17 200,20 225,12 250,14 275,7 300,9" fill="none" stroke="${color}" stroke-width="1.4"/>
  <circle cx="300" cy="9" r="2.6" fill="${bg}" stroke="${color}" stroke-width="1.4"/></svg>`;

function flowA(){return `<div class="ro">This year · <em>Jan 01 – Jun 12</em> ▾</div>
<div class="cols">
  <div><div class="lab">Income</div><div class="v p">$5,000.00</div><div class="ap">+ €1,000 ≈ $1,100</div></div>
  <div class="dv"></div>
  <div><div class="lab">Expense</div><div class="v n">$3,500.00</div><div class="ap">+ €800 ≈ $880</div></div>
  <div class="netr"><span>Net</span><b>+$1,720.00</b></div>
</div>`}

const ACCTS=[['HDFC Salary','Bank · Primary','₹4,82,310','INR','c1'],
             ['Wise USD','Multi-currency','$1,204.50','≈ ₹1,00,575','c2'],
             ['Cash','Physical','₹6,250','INR','c3']];
const TX=[['Blue Tokai Coffee','Dining · HDFC','−₹460',''],
          ['Metro recharge','Transport · Cash','−₹500',''],
          ['Freelance #41','Income · Wise','+$320.00','in']];

function rows(markColors){return ACCTS.map((a,i)=>`<div class="row">
  <span class="mark" style="background:${markColors[i]}"></span>
  <div><div class="rn">${a[0]}</div><div class="rt">${a[1]}</div></div>
  <div><div class="rb">${a[2]}</div><div class="rfx">${a[3]}</div></div></div>`).join('')}
function txRows(){return TX.map(t=>`<div class="row">
  <div><div class="rn">${t[0]}</div><div class="rt">${t[1]}</div></div>
  <div class="rb ${t[3]}">${t[2]}</div></div>`).join('')}
function budsTrack(){return `
  <div class="bud"><div class="br"><span class="bn">Dining out</span><span class="bf"><b>₹6,420</b> / ₹8,000 · 80%</span></div><div class="trk"><i style="width:80%"></i></div></div>
  <div class="bud"><div class="br"><span class="bn">Groceries</span><span class="bf"><b>₹9,180</b> / ₹12,000 · 76%</span></div><div class="trk"><i style="width:76%"></i></div></div>
  <div class="bud"><div class="br"><span class="bn">Transport</span><span class="bf"><b>₹4,940</b> / ₹4,500 · 110%</span></div><div class="trk"><i class="hot" style="width:100%"></i></div></div>`}
function budsSeg(){const seg=(n,cls)=>Array.from({length:10},(_,i)=>`<i class="${i<n?cls:''}"></i>`).join('');return `
  <div class="bud"><div class="br"><span class="bn">Dining out</span><span class="bf">6,420 / 8,000 · 80%</span></div><div class="seg">${seg(8,'on')}</div></div>
  <div class="bud"><div class="br"><span class="bn">Groceries</span><span class="bf">9,180 / 12,000 · 76%</span></div><div class="seg">${seg(8,'on')}</div></div>
  <div class="bud"><div class="br"><span class="bn">Transport</span><span class="bf">4,940 / 4,500 · 110%</span></div><div class="seg">${seg(10,'hot')}</div></div>`}
const NAV=`<i class="on">◈</i><i>≣</i><i class="fab">+</i><i>◔</i><i>⚙︎</i>`;

function phoneA(mode,sparkColor,sparkBg,marks){return `
<div class="phone A ${mode}"><div class="scr">
  <div class="status"><span>9:41</span><span>◧ ⌁ ▮</span></div>
  <div class="hd"><div class="brand">Oss<b>Wallet</b></div><div class="pf">P</div></div>
  <div class="hero">
    <div class="ov">Net Worth · June</div>
    <div class="amt"><span class="sym">₹</span>12,48,560<span class="dec">.40</span></div>
    <div class="meta"><b>↗ 2.4%</b> · +₹29,140 this month</div>
    <div class="spark">${SPARK(sparkColor,sparkBg)}</div>
  </div>
  <div class="sect" style="display:block"><div class="sh"><h2>Cash flow</h2><a>Jun ›</a></div>${flowA()}</div>
  <div class="sect" style="display:block"><div class="sh"><h2>Accounts</h2><a>All 6 ›</a></div>${rows(marks)}</div>
  <div class="sect" style="display:block"><div class="sh"><h2>Budgets</h2><a>Jun ›</a></div>${budsTrack()}</div>
  <div class="sect" style="display:block;border-bottom:none"><div class="sh"><h2>Recent activity</h2><a>Ledger ›</a></div>${txRows()}</div>
  <div class="foot">Encrypted on device · No cloud</div>
  <div class="navw"><div class="nav">${NAV}</div></div>
</div></div>`}

function phoneB(mode){return `
<div class="phone B ${mode}"><div class="scr">
  <div class="status"><span>09:41</span><span>LTE ▮▮▮</span></div>
  <div class="hd"><div><div class="brand">OSS<i>WALLET</i></div><div class="bsub">Vault 01 · Personal</div></div><div class="pf">P1</div></div>
  <div class="hero">
    <div class="rl"><span>Net Worth · INR</span><span class="live">Live</span></div>
    <div class="amt"><span class="sym">₹</span>12,48,560<span class="dec">.40</span></div>
    <div class="chips"><span class="chip a">▲ 2.4% MTD</span><span class="chip">+₹29,140</span><span class="chip">6 accounts</span></div>
  </div>
  <div class="sect"><h2><b>01</b>Cash Flow</h2><a>Jun ▾</a></div>
  <div class="panel">
    <div class="ro">THIS YEAR · <em>JAN 01 → JUN 12</em> ▾</div>
    <div class="cells">
      <div class="cell"><div class="lab p">Income</div><div class="v p">5,000.00</div><div class="ap">+ €1,000 ≈ $1,100</div></div>
      <div class="cell"><div class="lab n">Expense</div><div class="v n">3,500.00</div><div class="ap">+ €800 ≈ $880</div></div>
    </div>
    <div class="netr"><span>Net Delta</span><b>+$1,720.00</b></div>
  </div>
  <div class="sect"><h2><b>02</b>Accounts</h2><a>All 6 →</a></div>
  <div class="panel" style="padding-top:4px">${rows(['var(--acc)','#6FD6FF','#F0B05C'])}</div>
  <div class="sect"><h2><b>03</b>Budgets</h2><a>Jun ▾</a></div>
  <div class="panel" style="padding-top:4px">${budsSeg()}</div>
  <div class="sect"><h2><b>04</b>Activity</h2><a>Ledger →</a></div>
  <div class="panel" style="padding-top:4px">${txRows()}</div>
  <div class="foot">AES-256 <em>·</em> On-device <em>·</em> Zero cloud</div>
  <div class="navw"><div class="nav">${NAV}</div></div>
</div></div>`}

function phoneH(mode,sparkColor,sparkBg){return `
<div class="phone H ${mode}"><div class="scr">
  <div class="status"><span>09:41</span><span>LTE ▮▮▮</span></div>
  <div class="hd"><div class="brand">Oss<b>Wallet</b></div><div class="pf">P</div></div>
  <div class="hero">
    <div class="ov">Net Worth <em>·</em> June 2026</div>
    <div class="amt"><span class="sym">₹</span>12,48,560<span class="dec">.40</span></div>
    <div class="meta"><b>↗ 2.4%</b> · +₹29,140 this month</div>
    <div class="spark">${SPARK(sparkColor,sparkBg)}</div>
  </div>
  <div class="panel">
    <div class="cardhd"><div><div class="ctitle">Net worth</div><div class="ro">This year · <em>Jan 01 → Jun 12</em> ▾</div></div><a class="clink">Detail →</a></div>
    <div class="nwamt"><span class="sym">$</span>15,250<span class="dec">.75</span></div>
    <div class="nwtr">▲ +8.2%<i>vs prior period</i></div>
    <div class="nwflows">
      <div><div class="nwlb"><span>Income</span><b class="up">▲ +7.1%</b></div><div class="nwv p">$4,500.00</div></div>
      <div class="dv"></div>
      <div><div class="nwlb"><span>Expense</span><b class="dn">▲ +11.9%</b></div><div class="nwv n">$2,350.50</div></div>
    </div>
  </div>
  <div class="panel">
    <div class="cardhd"><div><div class="ctitle">Cash flow</div><div class="ro">This year · <em>Jan 01 → Jun 12</em> ▾</div></div><a class="clink">Ledger →</a></div>
    <div class="cols">
      <div><div class="lab">Income</div><div class="v p">$5,000.00</div><div class="ap">+ €1,000 ≈ $1,100</div></div>
      <div class="dv"></div>
      <div><div class="lab">Expense</div><div class="v n">$3,500.00</div><div class="ap">+ €800 ≈ $880</div></div>
      <div class="netr"><span>Net</span><b>+$1,720.00</b></div>
    </div>
  </div>
  <div class="panel">
    <div class="cardhd"><div><div class="ctitle">Accounts</div><div class="ro">This year · <em>Jan 01 → Jun 12</em> ▾</div></div><a class="clink">All 6 →</a></div>
    ${rows(['var(--acc)','#8FA8C2','#B68B5C'])}<div class="addrow"><b>+</b> Add account</div>
  </div>
  <div class="panel">
    <div class="cardhd"><div><div class="ctitle">Budgets</div><div class="ro">June 2026 · <em>Jun 01 → Jun 30</em> ▾</div></div><a class="clink">All →</a></div>
    ${budsTrack()}
  </div>
  <div class="panel">
    <div class="cardhd"><div><div class="ctitle">Recent activity</div><div class="ro">This year · <em>Jan 01 → Jun 12</em> ▾</div></div><a class="clink">Ledger →</a></div>
    ${txRows()}
  </div>
  <div class="foot">Encrypted on device <em>·</em> No cloud</div>
  <div class="navw"><div class="nav">${NAV}</div></div>
</div></div>`}

const cells=[
  ['A · Light · paper', phoneA('lt','#1D3A33','#F2EFE7',['#1D3A33','#41506B','#8C5A2B'])],
  ['A · Dark · charcoal', phoneA('dk','#8FB39E','#15130E',['#8FB39E','#7E96B5','#B68B5C'])],
  ['B · Dark · void', phoneB('dk')],
  ['B · Light · laboratory', phoneB('lt')],
  ['H · Dark · warm black', phoneH('dk','#D6C189','#0B0B0A')],
  ['H · Light · ivory', phoneH('lt','#8A6F3C','#F2EFE7')],
];
document.getElementById('grid').innerHTML=cells.map(([t,p])=>`<div><div class="modetag">${t}</div>${p}</div>`).join('');

document.querySelectorAll('.typb button').forEach(btn=>btn.addEventListener('click',()=>{
  document.body.classList.remove('fA','fB','fS');
  if(btn.dataset.f) document.body.classList.add(btn.dataset.f);
  document.querySelectorAll('.typb button').forEach(b=>b.classList.toggle('on',b===btn));
}));
</script>
</body>
</html>
