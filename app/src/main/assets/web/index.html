<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OssWallet — Web Portal</title>
<style>
  /* ── Design tokens ─────────────────────────────────────────── */
  :root {
    --bg: #ffffff; --surface: #f5f5f5; --surface2: #ececec; --border: #e0e0e0;
    --text: #1a1a1a; --text-muted: #666666;
    --accent: #1976D2; --accent-hover: #1565C0;
    --danger: #c62828; --success: #2e7d32; --warning: #f57f17;
    --sidebar-w: 230px; --header-h: 56px;
    --radius: 10px; --radius-sm: 6px; --radius-lg: 16px;
    --shadow-sm: 0 2px 8px rgba(0,0,0,.08);
    --shadow-md: 0 4px 16px rgba(0,0,0,.14);
    --shadow-lg: 0 8px 32px rgba(0,0,0,.22);
    --t: .15s ease; --t-med: .25s ease;
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212; --surface: #1e1e1e; --surface2: #272727; --border: #2c2c2c;
      --text: #e0e0e0; --text-muted: #9e9e9e;
      --accent: #42a5f5; --accent-hover: #64b5f6;
      --danger: #ef5350; --success: #66bb6a; --warning: #ffa726;
    }
  }

  /* ── Reset ─────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); height: 100dvh; overflow: hidden; }
  body.modal-open { overflow: hidden; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
  :focus:not(:focus-visible) { outline: none; }
  .btn, .nav-item, input, select, textarea, .chip-check, .add-card-btn { transition: border-color var(--t), background var(--t), color var(--t), box-shadow var(--t), opacity var(--t); }
  tr { transition: background var(--t); }
  .btn:active:not(:disabled) { transform: scale(.97); }

  /* ── App shell ─────────────────────────────────────────────── */
  #app { display: flex; flex-direction: column; height: 100%; }
  #header { display: flex; align-items: center; height: var(--header-h); padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--border); gap: 12px; flex-shrink: 0; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #header h1 { font-size: 1.1rem; font-weight: 600; flex: 1; }
  #main { display: flex; flex: 1; overflow: hidden; }
  #sidebar { width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0; }
  #content { flex: 1; overflow-y: auto; padding: 24px; }

  /* ── Nav ───────────────────────────────────────────────────── */
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 11px 16px; cursor: pointer; color: var(--text); text-decoration: none; font-size: 0.9rem; border-left: 3px solid transparent; transition: background var(--t), border-left-color var(--t), color var(--t); }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); border-left-color: var(--accent); font-weight: 600; }
  .nav-icon { width: 22px; text-align: center; font-size: 1rem; }
  .nav-section { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); padding: 16px 16px 4px; }

  /* ── Cards ─────────────────────────────────────────────────── */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stat-card { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: var(--sp-4); transition: box-shadow var(--t); }
  .stat-card:hover { box-shadow: var(--shadow-sm); }
  .stat-label { font-size: 0.7rem; color: var(--text-muted); margin-bottom: var(--sp-1); text-transform: uppercase; letter-spacing: 0.07em; font-weight: 700; }
  .stat-value { font-size: 1.3rem; font-weight: 800; line-height: 1.2; }
  .stat-value.positive { color: var(--success); }
  .stat-value.negative { color: var(--danger); }
  .stat-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 6px; }

  /* ── Tables ────────────────────────────────────────────────── */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 10px 12px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); border-bottom: 2px solid var(--border); position: sticky; top: 0; background: var(--surface); z-index: 1; }
  td { padding: 11px 12px; border-bottom: 1px solid var(--border); font-size: 0.88rem; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface2); }
  .amount-income { color: var(--success); font-weight: 600; }
  .amount-expense { color: var(--danger); font-weight: 600; }

  /* ── Buttons ───────────────────────────────────────────────── */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--radius-sm); border: none; cursor: pointer; font-size: 0.88rem; font-weight: 500; transition: background 0.15s, opacity 0.15s; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--border); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { opacity: 0.85; }
  .btn-sm { padding: 4px 10px; font-size: 0.8rem; }
  .btn-icon { padding: 5px 8px; font-size: 0.9rem; background: transparent; border: none; cursor: pointer; color: var(--text-muted); border-radius: 4px; min-width: 32px; min-height: 32px; display: inline-flex; align-items: center; justify-content: center; }
  .btn-icon:hover { background: var(--surface2); color: var(--text); }
  .btn-icon-danger:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }

  /* ── Badges ────────────────────────────────────────────────── */
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.73rem; font-weight: 700; }
  .badge-income  { background: color-mix(in srgb, var(--success) 15%, transparent); color: var(--success); }
  .badge-expense { background: color-mix(in srgb, var(--danger)  15%, transparent); color: var(--danger); }
  .badge-transfer{ background: color-mix(in srgb, var(--accent)  15%, transparent); color: var(--accent); }
  .badge-active  { background: color-mix(in srgb, var(--accent)  15%, transparent); color: var(--accent); }
  .badge-settled { background: color-mix(in srgb, var(--success) 15%, transparent); color: var(--success); }
  .badge-overdue { background: color-mix(in srgb, var(--danger)  15%, transparent); color: var(--danger); }
  .badge-lent    { background: color-mix(in srgb, var(--success) 15%, transparent); color: var(--success); }
  .badge-borrowed{ background: color-mix(in srgb, var(--warning) 15%, transparent); color: var(--warning); }
  .badge-must    { background: color-mix(in srgb, var(--danger)  15%, transparent); color: var(--danger); }
  .badge-need    { background: color-mix(in srgb, var(--warning) 15%, transparent); color: var(--warning); }
  .badge-want    { background: color-mix(in srgb, var(--success) 15%, transparent); color: var(--success); }

  /* ── Login ─────────────────────────────────────────────────── */
  #login-page { display: flex; align-items: center; justify-content: center; min-height: 100dvh; background: var(--bg); padding: 24px; }
  .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 40px; max-width: 380px; width: 100%; }
  .login-card h2 { font-size: 1.4rem; margin-bottom: 8px; }
  .login-card p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 28px; }
  .code-input { width: 100%; padding: 14px; font-size: 1.6rem; letter-spacing: 0.35em; text-align: center; text-transform: uppercase; font-weight: 700; font-family: monospace; border: 2px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); outline: none; }
  .code-input:focus { border-color: var(--accent); }
  .error-msg { color: var(--danger); font-size: 0.85rem; margin-top: 10px; min-height: 1.2em; }
  .login-submit { width: 100%; margin-top: 20px; padding: 12px; font-size: 1rem; }

  /* ── Pagination ────────────────────────────────────────────── */
  .pagination { display: flex; align-items: center; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .page-info { font-size: 0.85rem; color: var(--text-muted); }

  /* ── Misc ──────────────────────────────────────────────────── */
  #hamburger { display: none; background: none; border: none; cursor: pointer; padding: 4px; color: var(--text); font-size: 1.4rem; }
  @media (max-width: 700px) {
    #hamburger { display: block; }
    #sidebar { position: fixed; top: 0; left: 0; height: 100%; z-index: 200; transform: translateX(-100%); transition: transform 0.25s; }
    #sidebar.open { transform: translateX(0); }
    #content { padding: 16px; }
    #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 199; }
    #overlay.visible { display: block; }
    .card-grid { grid-template-columns: 1fr; }
    .two-col { grid-template-columns: 1fr !important; }
  }
  .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 40px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-wrap { display: flex; justify-content: center; }
  .alert { padding: 12px 16px; border-radius: 8px; font-size: 0.88rem; margin-bottom: 16px; }
  .alert-warn { background: #fff3e0; color: #bf360c; border: 1px solid #ffe0b2; }
  .alert-error { background: #ffebee; color: var(--danger); border: 1px solid #ffcdd2; }
  .alert-success { background: #e8f5e9; color: var(--success); border: 1px solid #c8e6c9; }
  @media (prefers-color-scheme: dark) {
    .alert-warn { background: #3e2000; color: var(--warning); border-color: #bf360c; }
    .alert-error { background: #3b0000; color: var(--danger); border-color: #7f0000; }
    .alert-success { background: #1a3a1a; color: var(--success); border-color: #2e7d32; }
  }
  .section-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 20px; }
  .section-sub { font-size: 1rem; font-weight: 600; margin-bottom: 12px; margin-top: 8px; }
  .empty-state { text-align: center; color: var(--text-muted); padding: 40px 0; font-size: 0.92rem; }

  /* ── Page header row ───────────────────────────────────────── */
  .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .page-header .section-title { margin-bottom: 0; }

  /* ── Progress bars ─────────────────────────────────────────── */
  .progress-track { background: var(--border); border-radius: 999px; height: 8px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 999px; transition: width 0.4s; }
  .progress-green { background: var(--success); }
  .progress-orange { background: var(--warning); }
  .progress-red { background: var(--danger); }

  /* ── Form elements ─────────────────────────────────────────── */
  .form-field { margin-bottom: 14px; }
  .form-field label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.04em; }
  .form-field input, .form-field select, .form-field textarea {
    width: 100%; padding: 9px 12px; font-size: 0.9rem; border: 1px solid var(--border);
    border-radius: var(--radius-sm); background: var(--bg); color: var(--text); outline: none;
    font-family: inherit;
  }
  .form-field input:focus, .form-field select:focus, .form-field textarea:focus { border-color: var(--accent); }
  .form-field textarea { resize: vertical; min-height: 72px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* ── Filter panel ──────────────────────────────────────────── */
  .filter-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
  .filter-panel.hidden { display: none; }
  .filter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .filter-actions { display: flex; gap: 8px; margin-top: 12px; }

  /* ── Modal ─────────────────────────────────────────────────── */
  #modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    z-index: 300; align-items: center; justify-content: center;
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  }
  #modal-overlay.open { display: flex; }
  #modal-box {
    background: var(--surface); border-radius: var(--radius-lg);
    max-width: 540px; width: 92%; max-height: 90vh;
    box-shadow: var(--shadow-lg);
    display: flex; flex-direction: column;
    animation: modalIn var(--t-med);
  }
  @keyframes modalIn { from{opacity:0;transform:translateY(-12px) scale(.98)} to{opacity:1;transform:none} }
  #modal-title { font-size: 1.05rem; font-weight: 700; padding: 20px 24px 0; flex-shrink: 0; }
  #modal-body { overflow-y: auto; flex: 1; padding: 16px 24px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; padding: 16px 24px; flex-shrink: 0; border-top: 1px solid var(--border); }

  /* ── Color swatch ──────────────────────────────────────────── */
  .color-swatch { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.15); vertical-align: middle; margin-right: 6px; }

  /* ── Chart legend ──────────────────────────────────────────── */
  .chart-legend { display: flex; flex-wrap: wrap; gap: 10px 20px; margin-top: 12px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  /* ── Two-col layout ────────────────────────────────────────── */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

  /* ── Toggle / switch ───────────────────────────────────────── */
  .toggle-wrap { display: flex; align-items: center; gap: 10px; }
  .toggle-wrap input[type=checkbox] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--accent); }

  /* ── Tag chip ──────────────────────────────────────────────── */
  .tag-chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .tag-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px; font-size: 0.85rem; font-weight: 600; border: 1px solid var(--border); background: var(--surface2); }
  .tag-chip .chip-count { font-size: 0.75rem; color: var(--text-muted); }

  /* ── Section divider ───────────────────────────────────────── */
  .section-divider { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

  /* ── Overdue section ───────────────────────────────────────── */
  .overdue-header { color: var(--danger); font-weight: 700; font-size: 1rem; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .upcoming-header { color: var(--warning); font-weight: 700; font-size: 1rem; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }

  /* ── Settings list ─────────────────────────────────────────── */
  .settings-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--border); }
  .settings-row:last-child { border-bottom: none; }
  .settings-label { font-weight: 600; font-size: 0.92rem; }
  .settings-value { color: var(--text-muted); font-size: 0.9rem; }

  /* ── Category indent ───────────────────────────────────────── */
  .cat-child { padding-left: 28px; }

  /* ── Dashboard cards ───────────────────────────────────────── */
  .dash-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
  .dash-card-pinned { background: var(--surface); border: 1px solid var(--border); border-top: 3px solid var(--accent); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
  .pinned-label { font-size: 0.65rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); padding: 2px 8px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); background: color-mix(in srgb, var(--accent) 10%, transparent); white-space: nowrap; }
  .dash-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .dash-card-title { font-weight: 700; font-size: 1rem; flex: 1; min-width: 0; }
  .filter-badge { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 600; background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); white-space: nowrap; }
  .chip-group { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip-check { display: inline-flex; align-items: center; gap: 5px; padding: 4px 12px; border-radius: 999px; font-size: 0.8rem; font-weight: 500; border: 1px solid var(--border); background: var(--surface2); cursor: pointer; transition: background 0.15s, border-color 0.15s; }
  .chip-check input { position: absolute; opacity: 0; width: 0; height: 0; }
  .chip-check.active { background: color-mix(in srgb, var(--accent) 15%, transparent); border-color: var(--accent); color: var(--accent); }
  .chip-check:hover { border-color: var(--accent); }
  .dash-card-actions { display: flex; gap: 4px; margin-left: auto; }
  .currency-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
  .currency-item { background: var(--surface2); border-radius: var(--radius-sm); padding: 12px; }
  .currency-code { font-size: 0.85rem; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  .currency-balance { font-size: 1.1rem; font-weight: 700; }
  .currency-base { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }
  .treemap-wrap { overflow-x: auto; }
  .manage-card-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .manage-card-row:last-child { border-bottom: none; }
  .manage-card-name { flex: 1; font-size: 0.9rem; font-weight: 500; }
  .add-card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; margin-top: 4px; }
  .add-card-btn { padding: 10px; text-align: center; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: background 0.15s; }
  .add-card-btn:hover { background: color-mix(in srgb, var(--accent) 15%, var(--surface2)); border-color: var(--accent); color: var(--accent); }

  /* ── Scrollbars ─────────────────────────────────────────────── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

  /* ── Toast notifications ────────────────────────────────────── */
  #toast-container { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column-reverse; gap: 8px; z-index: 9999; pointer-events: none; }
  .toast { padding: 12px 20px; border-radius: var(--radius); font-size: 0.88rem; font-weight: 500; box-shadow: var(--shadow-md); pointer-events: auto; max-width: 320px; border-left: 4px solid; animation: toastIn .25s ease; }
  @keyframes toastIn { from{opacity:0;transform:translateX(24px)} to{opacity:1;transform:none} }
  @keyframes toastOut { from{opacity:1;transform:none} to{opacity:0;transform:translateX(24px)} }
  .toast-success { background: var(--surface); border-color: var(--success); }
  .toast-error   { background: var(--surface); border-color: var(--danger); }
  .toast-info    { background: var(--surface); border-color: var(--accent); }

  /* ── Top progress bar ───────────────────────────────────────── */
  #nprogress { position: fixed; top: 0; left: 0; height: 3px; background: var(--accent); z-index: 9998; width: 0; opacity: 0; transition: width .3s ease, opacity .3s ease; pointer-events: none; }

  /* ── Input group (amount + currency prefix) ─────────────────── */
  .input-group { display: flex; align-items: stretch; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; transition: border-color var(--t); background: var(--bg); }
  .input-group:focus-within { border-color: var(--accent); }
  .input-group-addon { padding: 0 12px; display: flex; align-items: center; background: var(--surface2); color: var(--text-muted); font-size: 0.85rem; font-weight: 600; white-space: nowrap; border: none; flex-shrink: 0; }
  .input-group input, .input-group select { border: none !important; outline: none !important; flex: 1; background: transparent; padding: 9px 12px; font-size: 0.9rem; color: var(--text); font-family: inherit; width: 100%; min-width: 0; }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }

  /* ── Field-level validation ─────────────────────────────────── */
  .field-error { border-color: var(--danger) !important; }
  .field-error-msg { color: var(--danger); font-size: 0.75rem; margin-top: 3px; display: block; }

  /* ── Custom select dropdown ─────────────────────────────────── */
  .custom-select { position: relative; }
  .cs-trigger { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); cursor: pointer; user-select: none; font-size: 0.9rem; gap: 8px; color: var(--text); min-height: 38px; transition: border-color var(--t); }
  .cs-trigger:hover { border-color: var(--accent); }
  .cs-trigger:focus { outline: 2px solid var(--accent); outline-offset: 2px; border-color: var(--accent); }
  .cs-trigger.placeholder { color: var(--text-muted); }
  .cs-chevron { color: var(--text-muted); font-size: 0.7rem; flex-shrink: 0; transition: transform var(--t); }
  .custom-select.open .cs-chevron { transform: rotate(180deg); }
  .cs-dropdown { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow-md); z-index: 500; max-height: 240px; overflow-y: auto; }
  .cs-search-wrap { padding: 8px; border-bottom: 1px solid var(--border); }
  .cs-search-wrap input { width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); outline: none; font-size: 0.88rem; color: var(--text); padding: 6px 10px; }
  .cs-search-wrap input:focus { border-color: var(--accent); }
  .cs-option { padding: 9px 14px; cursor: pointer; font-size: 0.88rem; transition: background var(--t); }
  .cs-option:hover, .cs-option.focused { background: var(--surface2); }
  .cs-option.selected { color: var(--accent); font-weight: 600; }
  .cs-option.cs-empty { color: var(--text-muted); font-style: italic; cursor: default; }

  /* ── Chip multi-select ──────────────────────────────────────── */
  .chip-ms-wrap { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px; display: flex; flex-wrap: wrap; gap: 4px; cursor: text; min-height: 42px; background: var(--bg); transition: border-color var(--t); position: relative; }
  .chip-ms-wrap:focus-within { border-color: var(--accent); }
  .chip-ms-tag { display: inline-flex; align-items: center; gap: 4px; background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); padding: 3px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; }
  .chip-ms-remove { cursor: pointer; opacity: .6; font-size: 1rem; line-height: 1; }
  .chip-ms-remove:hover { opacity: 1; }
  .chip-ms-input { border: none; outline: none; background: transparent; font-size: 0.88rem; color: var(--text); flex: 1; min-width: 80px; padding: 3px 4px; font-family: inherit; }
  .chip-ms-dropdown { position: absolute; left: 0; right: 0; top: calc(100% + 2px); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow-md); z-index: 500; max-height: 180px; overflow-y: auto; }
  .chip-ms-option { padding: 8px 14px; cursor: pointer; font-size: 0.88rem; transition: background var(--t); }
  .chip-ms-option:hover, .chip-ms-option.focused { background: var(--surface2); }

  /* ── Date range picker ──────────────────────────────────────── */
  .date-range-wrap { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .date-range-sep { color: var(--text-muted); flex-shrink: 0; font-size: 0.85rem; }
  .date-range-wrap input[type=date] { flex: 1; min-width: 130px; }
  input[type=date]::-webkit-calendar-picker-indicator { opacity: 0.5; cursor: pointer; }
  input[type=date]::-webkit-calendar-picker-indicator:hover { opacity: 1; }

  /* ── Form section label (divider inside modal) ──────────────── */
  .form-section-label { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); margin: 16px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }

  /* ── Alert dark-mode (moved from hardcoded) ─────────────────── */
  .alert-warn { background: color-mix(in srgb, var(--warning) 12%, var(--surface)); color: var(--warning); border: 1px solid color-mix(in srgb, var(--warning) 35%, transparent); }
  .alert-error { background: color-mix(in srgb, var(--danger) 10%, var(--surface)); color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent); }
  .alert-success { background: color-mix(in srgb, var(--success) 10%, var(--surface)); color: var(--success); border: 1px solid color-mix(in srgb, var(--success) 30%, transparent); }

  /* ── Tooltip (pure CSS via data-tip) ───────────────────────── */
  [data-tip] { position: relative; }
  [data-tip]::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 5px 10px; border-radius: 6px; font-size: 0.75rem; white-space: nowrap; pointer-events: none; z-index: 800; opacity: 0; transition: opacity var(--t); max-width: 240px; white-space: normal; text-align: center; }
  [data-tip]:hover::after { opacity: 1; }

  /* ── Filter-active button state ─────────────────────────────── */
  .btn-filter-active { background: color-mix(in srgb, var(--accent) 12%, transparent) !important; border-color: var(--accent) !important; color: var(--accent) !important; }

  /* ── Theme force override ───────────────────────────────────── */
  .force-light { color-scheme: light; }
  .force-light :root { --bg: #ffffff; --surface: #f5f5f5; --surface2: #ececec; --border: #e0e0e0; --text: #1a1a1a; --text-muted: #666666; --accent: #1976D2; --danger: #c62828; --success: #2e7d32; --warning: #f57f17; }
  .force-dark { color-scheme: dark; }

  /* ── Responsive additions ───────────────────────────────────── */
  @media (max-width: 1024px) {
    .card-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 768px) {
    #hamburger { display: block; }
    #sidebar { position: fixed; top: 0; left: 0; height: 100%; z-index: 200; transform: translateX(-100%); }
    #content { padding: 16px; }
    .form-row { grid-template-columns: 1fr; }
    .filter-grid { grid-template-columns: 1fr 1fr; }
    .two-col { grid-template-columns: 1fr; }
  }
  @media (max-width: 480px) {
    #modal-box { margin: 8px; width: calc(100vw - 16px); }
    .stat-value { font-size: 1.1rem; }
    .filter-grid { grid-template-columns: 1fr; }
    .card-grid { grid-template-columns: 1fr; }
    .pagination { gap: 4px; }
    .pagination .btn { padding: 4px 8px; font-size: 0.78rem; }
  }
</style>
</head>
<body>

<!-- ───────────────────── Login ───────────────────────────── -->
<div id="login-page" style="display:none;">
  <div class="login-card">
    <h2>OssWallet Web Portal</h2>
    <p>Enter the access code shown on your phone to continue.</p>
    <input class="code-input" id="code-input" type="text" maxlength="8" placeholder="XXXXXXXX"
           autocomplete="off" autocorrect="off" spellcheck="false">
    <div class="error-msg" id="login-error"></div>
    <button class="btn btn-primary login-submit" id="login-btn">Verify</button>
  </div>
</div>

<!-- ───────────────────── App shell ───────────────────────── -->
<div id="app" style="display:none;">
  <div id="header">
    <button id="hamburger" aria-label="Menu">&#9776;</button>
    <h1>OssWallet</h1>
    <button class="btn btn-ghost" id="logout-btn" style="font-size:0.82rem; padding:6px 12px;">Log out</button>
  </div>
  <div id="main">
    <div id="overlay"></div>
    <nav id="sidebar">
      <div class="nav-section">Overview</div>
      <a class="nav-item" href="#/dashboard"><span class="nav-icon">📊</span> Dashboard</a>
      <a class="nav-item" href="#/analytics"><span class="nav-icon">📉</span> Analytics</a>
      <div class="nav-section">Finance</div>
      <a class="nav-item" href="#/records"><span class="nav-icon">📋</span> Records</a>
      <a class="nav-item" href="#/accounts"><span class="nav-icon">💳</span> Accounts</a>
      <a class="nav-item" href="#/budgets"><span class="nav-icon">📈</span> Budgets</a>
      <a class="nav-item" href="#/loans"><span class="nav-icon">🏦</span> Loans</a>
      <a class="nav-item" href="#/planned-payments"><span class="nav-icon">🔄</span> Planned</a>
      <div class="nav-section">Organize</div>
      <a class="nav-item" href="#/templates"><span class="nav-icon">📄</span> Templates</a>
      <a class="nav-item" href="#/categories"><span class="nav-icon">🏷️</span> Categories</a>
      <a class="nav-item" href="#/tags"><span class="nav-icon">🔖</span> Tags</a>
      <div class="nav-section">System</div>
      <a class="nav-item" href="#/settings"><span class="nav-icon">⚙️</span> Settings</a>
    </nav>
    <main id="content">
      <div class="loading-wrap"><div class="spinner"></div></div>
    </main>
  </div>
</div>

<!-- ───────────────────── Modal ───────────────────────────── -->
<div id="modal-overlay">
  <div id="modal-box">
    <div id="modal-title"></div>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="modal-confirm-btn">Confirm</button>
    </div>
  </div>
</div>

<div id="nprogress"></div>
<div id="toast-container"></div>

<!-- ───────────────────── Script ───────────────────────────── -->
<script>
(function () {
  'use strict';

  /* ── State ────────────────────────────────────────────── */
  const baseUrl = window.location.origin;
  let token = sessionStorage.getItem('oss_token') || '';
  let cachedCategories = [];
  let cachedAccounts   = [];
  let cachedSettings   = { baseCurrency: 'USD', decimalPrecision: 2 };
  let cachedTags       = [];
  /* per-card filter overrides: { [cardId]: { timelineType, dateFrom, dateTo, transactionTypes, currencies, accountIds, categoryIds, minAmount, maxAmount } } */
  let cardOverrides = {};

  /* ── DOM refs ─────────────────────────────────────────── */
  const loginPage  = document.getElementById('login-page');
  const appPage    = document.getElementById('app');
  const content    = document.getElementById('content');
  const sidebar    = document.getElementById('sidebar');
  const overlay    = document.getElementById('overlay');
  const modalOverlay  = document.getElementById('modal-overlay');
  const modalTitle    = document.getElementById('modal-title');
  const modalBody     = document.getElementById('modal-body');
  const modalConfBtn  = document.getElementById('modal-confirm-btn');

  /* ── Boot ─────────────────────────────────────────────── */
  if (token) { showApp(); warmCache().then(() => route()); }
  else { showLogin(); }

  document.getElementById('code-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('login-btn').click();
  });
  document.getElementById('login-btn').addEventListener('click', doLogin);
  document.getElementById('logout-btn').addEventListener('click', doLogout);
  document.getElementById('hamburger').addEventListener('click', () => {
    sidebar.classList.toggle('open'); overlay.classList.toggle('visible');
  });
  overlay.addEventListener('click', closeSidebar);
  window.addEventListener('hashchange', route);
  modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });
  /* T5-3: Global keyboard shortcuts */
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
    if (e.key === 'Escape') { closeModal(); }
    if (e.key === 'n' && !e.ctrlKey && !e.metaKey && !e.altKey) {
      if (location.hash.startsWith('#/records') || location.hash.startsWith('#/dashboard') || location.hash === '') {
        openAddTransaction();
      }
    }
  });

  /* ── Auth ─────────────────────────────────────────────── */
  async function doLogin() {
    const btn   = document.getElementById('login-btn');
    const input = document.getElementById('code-input');
    const errEl = document.getElementById('login-error');
    const code  = input.value.trim().toUpperCase();
    if (code.length < 8) { errEl.textContent = 'Enter the full 8-character code.'; return; }
    btn.disabled = true; btn.textContent = 'Verifying…'; errEl.textContent = '';
    try {
      const res  = await fetch(baseUrl + '/api/auth', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ accessCode: code })
      });
      const json = await res.json();
      if (res.status === 429) {
        errEl.textContent = json.error || 'Too many attempts. Wait 60 seconds.';
      } else if (json.success && json.data?.token) {
        token = json.data.token;
        sessionStorage.setItem('oss_token', token);
        showApp();
        await warmCache();
        navigate('#/dashboard');
      } else {
        errEl.textContent = 'Incorrect code. Try again.';
      }
    } catch { errEl.textContent = 'Connection error. Is the server still running?'; }
    finally { btn.disabled = false; btn.textContent = 'Verify'; }
  }

  function doLogout() {
    token = ''; sessionStorage.removeItem('oss_token');
    cachedCategories = []; cachedAccounts = [];
    showLogin();
    document.getElementById('code-input').value = '';
    document.getElementById('login-error').textContent = '';
  }

  /* ── Cache warm-up ────────────────────────────────────── */
  async function warmCache() {
    try {
      const [catR, accR, setR, tagR] = await Promise.allSettled([
        apiFetch('/api/categories'),
        apiFetch('/api/accounts'),
        apiFetch('/api/settings'),
        apiFetch('/api/tags')
      ]);
      if (catR.status === 'fulfilled' && catR.value?.success) cachedCategories = catR.value.data || [];
      if (accR.status === 'fulfilled' && accR.value?.success) cachedAccounts   = accR.value.data || [];
      if (setR.status === 'fulfilled' && setR.value?.success) cachedSettings   = setR.value.data || cachedSettings;
      if (tagR.status === 'fulfilled' && tagR.value?.success) cachedTags = (tagR.value.data || []).map(t => t.name || t).filter(Boolean);
    } catch { /* non-fatal */ }
  }

  /* ── Navigation ───────────────────────────────────────── */
  function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('visible'); }

  const PAGE_TITLES = {
    '#/dashboard': 'Dashboard', '#/records': 'Records', '#/accounts': 'Accounts',
    '#/budgets': 'Budgets', '#/loans': 'Loans', '#/planned-payments': 'Planned Payments',
    '#/categories': 'Categories', '#/analytics': 'Analytics', '#/tags': 'Tags',
    '#/templates': 'Templates', '#/settings': 'Settings',
  };

  function route() {
    const hash = location.hash || '#/dashboard';
    const pageName = Object.entries(PAGE_TITLES).find(([k]) => hash.startsWith(k))?.[1] || 'OssWallet';
    document.title = 'OssWallet — ' + pageName;
    updateActiveNav(hash); closeSidebar();
    if      (hash.startsWith('#/dashboard'))        renderDashboard();
    else if (hash.startsWith('#/records'))          renderRecords();
    else if (hash.startsWith('#/accounts/'))        renderAccountDetail(hash.split('/')[2]);
    else if (hash.startsWith('#/accounts'))         renderAccounts();
    else if (hash.startsWith('#/budgets/'))         renderBudgetDetail(hash.split('/')[2]);
    else if (hash.startsWith('#/budgets'))          renderBudgets();
    else if (hash.startsWith('#/loans/'))           renderLoanDetail(hash.split('/')[2]);
    else if (hash.startsWith('#/loans'))            renderLoans();
    else if (hash.startsWith('#/planned-payments')) renderPlannedPayments();
    else if (hash.startsWith('#/categories'))       renderCategories();
    else if (hash.startsWith('#/analytics'))        renderAnalytics();
    else if (hash.startsWith('#/tags'))             renderTags();
    else if (hash.startsWith('#/templates'))        renderTemplates();
    else if (hash.startsWith('#/settings'))         renderSettings();
    else renderDashboard();
  }

  function navigate(hash) { location.hash = hash; }

  function updateActiveNav(hash) {
    document.querySelectorAll('.nav-item').forEach(el => {
      const href = el.getAttribute('href');
      el.classList.toggle('active', href && hash.startsWith(href));
    });
  }

  /* ── UI helpers ───────────────────────────────────────── */
  function showLogin() { loginPage.style.display = 'flex'; appPage.style.display = 'none'; setTimeout(() => document.getElementById('code-input').focus(), 100); }
  function showApp()   { loginPage.style.display = 'none';  appPage.style.display = 'flex'; }
  function setContent(html) { content.innerHTML = html; endProgress(); }
  function showSpinner() { startProgress(); setContent('<div class="loading-wrap"><div class="spinner"></div></div>'); }
  function showError(msg) { endProgress(); setContent(`<div class="alert alert-error">${esc(msg)}</div>`); }

  /* ── Formatters ───────────────────────────────────────── */
  function fmt(amount, currency) {
    try { return new Intl.NumberFormat(navigator.language, { style: 'currency', currency, minimumFractionDigits: 2 }).format(amount); }
    catch { return Number(amount).toFixed(2) + ' ' + (currency || ''); }
  }
  function fmtRaw(n, dec) {
    const d = dec ?? cachedSettings.decimalPrecision ?? 2;
    return Number(n).toLocaleString(navigator.language, { minimumFractionDigits: d, maximumFractionDigits: d });
  }
  function fmtDate(ts) {
    if (!ts) return '—';
    return new Date(ts).toLocaleDateString(navigator.language, { year: 'numeric', month: 'short', day: 'numeric' });
  }
  function fmtDateTime(ts) {
    if (!ts) return '—';
    return new Date(ts).toLocaleString(navigator.language, { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }
  function esc(str) {
    if (str == null) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  /* ── API helpers ──────────────────────────────────────── */
  async function apiFetch(path) {
    const res = await fetch(baseUrl + path, { headers: { 'Authorization': 'Bearer ' + token } });
    if (res.status === 401) { token = ''; sessionStorage.removeItem('oss_token'); showToast('Session expired. Please log in again.', 'info'); showLogin(); throw new Error('Session expired'); }
    return res.json();
  }

  async function apiWrite(method, path, body) {
    const res = await fetch(baseUrl + path, {
      method,
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: body !== undefined ? JSON.stringify(body) : undefined
    });
    if (res.status === 401) { token = ''; sessionStorage.removeItem('oss_token'); showToast('Session expired. Please log in again.', 'info'); showLogin(); throw new Error('Session expired'); }
    try { return await res.json(); } catch { return { success: res.ok }; }
  }

  /* ── Modal helpers ────────────────────────────────────── */
  function openModal(titleHtml, bodyHtml, onConfirm, confirmLabel) {
    modalTitle.innerHTML = titleHtml;
    modalBody.innerHTML  = bodyHtml;
    /* T1-2: always reset button to known clean state */
    modalConfBtn.className   = 'btn btn-primary';
    modalConfBtn.disabled    = false;
    modalConfBtn.style.display = (confirmLabel === null) ? 'none' : '';
    modalConfBtn.textContent = confirmLabel || 'Confirm';
    modalConfBtn.onclick = () => { if (onConfirm) onConfirm(); };
    modalOverlay.classList.add('open');
    document.body.classList.add('modal-open');
    /* T2-4: auto-focus first interactive field */
    setTimeout(() => {
      const first = modalBody.querySelector('input:not([type=hidden]):not([disabled]), select, textarea');
      if (first) first.focus();
    }, 60);
    /* T2-5: Enter key submits */
    const modalBox = document.getElementById('modal-box');
    if (modalBox) {
      const handler = e => {
        if (e.key === 'Enter' && !e.shiftKey && !modalConfBtn.disabled && modalConfBtn.style.display !== 'none' && document.activeElement?.tagName !== 'TEXTAREA') {
          e.preventDefault();
          modalConfBtn.click();
        }
      };
      if (modalBox._enterHandler) modalBox.removeEventListener('keydown', modalBox._enterHandler);
      modalBox.addEventListener('keydown', handler);
      modalBox._enterHandler = handler;
    }
  }

  function closeModal() {
    modalOverlay.classList.remove('open');
    document.body.classList.remove('modal-open');
    modalConfBtn.onclick = null;
    modalConfBtn.style.display = '';
    modalConfBtn.disabled = false;
    modalConfBtn.className = 'btn btn-primary';
    const modalBox = document.getElementById('modal-box');
    if (modalBox && modalBox._enterHandler) {
      modalBox.removeEventListener('keydown', modalBox._enterHandler);
      delete modalBox._enterHandler;
    }
  }

  function confirmDelete(message, onConfirm) {
    openModal(
      '<span style="color:var(--danger)">⚠️ Confirm Delete</span>',
      `<p>${esc(message)}</p>`,
      onConfirm,
      'Delete'
    );
    modalConfBtn.className = 'btn btn-danger';
  }

  function infoModal(titleHtml, bodyHtml) {
    openModal(titleHtml, bodyHtml, null, 'OK');
    modalConfBtn.onclick = closeModal;
  }

  /* ── Form helper ──────────────────────────────────────── */
  function formField(label, inputHtml) {
    return `<div class="form-field"><label>${esc(label)}</label>${inputHtml}</div>`;
  }
  function formRow(...fields) {
    return `<div class="form-row">${fields.join('')}</div>`;
  }

  /* ── Toast notifications (T2-1) ───────────────────────── */
  function showToast(message, type = 'success') {
    const container = document.getElementById('toast-container');
    if (!container) return;
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.textContent = message;
    container.appendChild(toast);
    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transform = 'translateX(24px)';
      setTimeout(() => toast.remove(), 300);
    }, 3200);
  }

  /* ── Top progress bar (T2-6) ──────────────────────────── */
  function startProgress() {
    const el = document.getElementById('nprogress');
    if (!el) return;
    el.style.transition = 'none';
    el.style.width = '0';
    el.style.opacity = '1';
    requestAnimationFrame(() => {
      el.style.transition = 'width 1.2s cubic-bezier(.4,0,.2,1)';
      el.style.width = '75%';
    });
  }
  function endProgress() {
    const el = document.getElementById('nprogress');
    if (!el) return;
    el.style.transition = 'width .2s ease, opacity .3s ease';
    el.style.width = '100%';
    setTimeout(() => { el.style.opacity = '0'; setTimeout(() => { el.style.width = '0'; el.style.transition = 'none'; }, 300); }, 200);
  }

  /* ── Button loading state (T2-2) ──────────────────────── */
  async function withLoading(btn, fn) {
    const orig = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner" style="width:14px;height:14px;border-width:2px;display:inline-block;vertical-align:middle;margin-right:4px"></span>Saving…';
    try { await fn(); } finally { btn.disabled = false; btn.innerHTML = orig; }
  }

  /* ── Field validation (T2-3) ──────────────────────────── */
  function showFieldError(elId, msg) {
    const el = typeof elId === 'string' ? document.getElementById(elId) : elId;
    if (!el) return;
    el.classList.add('field-error');
    const prev = el.parentNode && el.parentNode.querySelector('.field-error-msg');
    if (prev) prev.remove();
    const span = document.createElement('span');
    span.className = 'field-error-msg';
    span.textContent = msg;
    if (el.parentNode) el.parentNode.insertBefore(span, el.nextSibling);
    el.focus();
  }
  function clearFieldErrors(container) {
    if (!container) return;
    container.querySelectorAll('.field-error').forEach(el => el.classList.remove('field-error'));
    container.querySelectorAll('.field-error-msg').forEach(el => el.remove());
  }

  /* ── Chart helpers ────────────────────────────────────── */
  const CHART_COLORS = ['#1976D2','#2e7d32','#c62828','#f57f17','#6a1b9a','#00838f','#ad1457','#4e342e','#37474f','#558b2f'];

  function svgDonut(slices, size) {
    size = size || 180;
    if (!slices || !slices.length) return '<p class="empty-state">No data</p>';
    const total = slices.reduce((s, x) => s + (x.value || 0), 0);
    if (total === 0) return '<p class="empty-state">No data</p>';
    const r = 60, cx = size / 2, cy = size / 2, stroke = 28;
    const circ = 2 * Math.PI * r;
    let offset = 0, paths = '';
    slices.forEach((s, i) => {
      const pct  = s.value / total;
      const dash = pct * circ;
      const col  = s.color || CHART_COLORS[i % CHART_COLORS.length];
      paths += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${esc(col)}"
        stroke-width="${stroke}" stroke-dasharray="${dash.toFixed(2)} ${(circ - dash).toFixed(2)}"
        stroke-dashoffset="${(circ * 0.25 - offset).toFixed(2)}"><title>${esc(s.label)}</title></circle>`;
      offset += dash;
    });
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="display:block">${paths}</svg>`;
  }

  function svgBars(points, width, height, showNetLine, todayIdx) {
    width  = width  || 560;
    height = height || 140;
    if (!points || !points.length) return '<p class="empty-state">No data</p>';
    const maxVal  = Math.max(...points.flatMap(p => [p.income || 0, p.expense || 0])) || 1;
    const count   = points.length;
    const pl = 40, pb = 24;
    const usableW = width - pl;
    const slotW   = Math.floor(usableW / count);
    const barW    = Math.max(4, Math.floor(slotW / 2) - 3);
    const chartH  = height - pb;
    let svg = '';
    /* Y-axis grid lines and labels */
    for (let gi = 0; gi <= 4; gi++) {
      const gy = (chartH * gi / 4).toFixed(1);
      const val = maxVal * (4 - gi) / 4;
      svg += `<line x1="${pl}" y1="${gy}" x2="${width}" y2="${gy}" stroke="var(--border)" stroke-width="1"/>`;
      svg += `<text x="${pl-4}" y="${gy}" text-anchor="end" dominant-baseline="middle" font-size="9" fill="var(--text-muted)">${fmtRaw(val,0)}</text>`;
    }
    const barCenters = [];
    points.forEach((p, i) => {
      const x  = pl + i * slotW;
      const ih = Math.round(((p.income  || 0) / maxVal) * chartH);
      const eh = Math.round(((p.expense || 0) / maxVal) * chartH);
      const cx = x + barW;
      barCenters.push({ x: cx, net: (p.income||0) - (p.expense||0) });
      /* today highlight column */
      if (i === todayIdx) svg += `<rect x="${x}" y="0" width="${slotW}" height="${chartH}" fill="var(--primary)" opacity="0.06"/>`;
      svg += `<rect x="${x}" y="${chartH - ih}" width="${barW}" height="${Math.max(1,ih)}" fill="var(--success)" opacity="0.85"><title>Income: ${p.income}</title></rect>`;
      svg += `<rect x="${x + barW + 2}" y="${chartH - eh}" width="${barW}" height="${Math.max(1,eh)}" fill="var(--danger)" opacity="0.85"><title>Expense: ${p.expense}</title></rect>`;
      svg += `<text x="${cx}" y="${height - 4}" text-anchor="middle" font-size="9" fill="var(--text-muted)">${esc(String(p.label).slice(0, 6))}</text>`;
    });
    /* Net trend line */
    if (showNetLine && barCenters.length > 1) {
      const maxNet = Math.max(...barCenters.map(c=>Math.abs(c.net)), 1);
      const netPts = barCenters.map(c => {
        const py = (chartH / 2) - (c.net / maxNet) * (chartH / 2);
        return `${c.x.toFixed(1)},${Math.max(0, Math.min(chartH, py)).toFixed(1)}`;
      }).join(' ');
      svg += `<polyline points="${netPts}" fill="none" stroke="var(--primary)" stroke-width="2" stroke-dasharray="4 2" stroke-linecap="round"/>`;
    }
    return `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" style="overflow:visible;display:block">${svg}</svg>`;
  }

  function progressBar(pct, color) {
    const cls = color || (pct < 80 ? 'progress-green' : pct < 100 ? 'progress-orange' : 'progress-red');
    const w   = Math.min(100, Math.max(0, pct));
    return `<div class="progress-track"><div class="progress-fill ${esc(cls)}" style="width:${w}%"></div></div>`;
  }

  /* Multi-line SVG chart — series:[{name,points:[],labels:[],color,opacity}] */
  function svgLineChart(seriesList, w, h) {
    w = w || 560; h = h || 160;
    if (!seriesList || !seriesList.length) return '<p class="empty-state">No data</p>';
    const first = seriesList.find(s => s.points && s.points.length);
    if (!first || !first.points.length) return '<p class="empty-state">No data</p>';
    const n = first.points.length;
    const allVals = seriesList.flatMap(s => (s.points||[]).filter(v=>v!=null));
    const minVal = Math.min(0, ...allVals);
    const maxVal = Math.max(...allVals, 1);
    const range = maxVal - minVal || 1;
    const pl = 44, pr = 10, pt = 10, pb = 22;
    const cw = w - pl - pr, ch = h - pt - pb;
    let svg = '';
    /* Y-axis grid lines + labels */
    for (let gi = 0; gi <= 4; gi++) {
      const gy = (pt + ch * gi / 4).toFixed(1);
      const val = minVal + range * (4 - gi) / 4;
      svg += `<line x1="${pl}" y1="${gy}" x2="${w - pr}" y2="${gy}" stroke="var(--border)" stroke-width="1"/>`;
      svg += `<text x="${pl-4}" y="${gy}" text-anchor="end" dominant-baseline="middle" font-size="9" fill="var(--text-muted)">${fmtRaw(val,0)}</text>`;
    }
    seriesList.forEach(s => {
      if (!s.points || !s.points.length) return;
      /* Build segments, skipping null values to draw gaps */
      let segment = [];
      const flushSegment = () => {
        if (segment.length > 1) svg += `<polyline points="${segment.join(' ')}" fill="none" stroke="${esc(s.color||'#1976D2')}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="${s.opacity!=null?s.opacity:1}"/>`;
        segment = [];
      };
      s.points.forEach((v, i) => {
        if (v == null) { flushSegment(); return; }
        const px = pl + (n <= 1 ? cw / 2 : i * cw / (n - 1));
        const py = pt + ch - ((v - minVal) / range) * ch;
        segment.push(`${px.toFixed(1)},${py.toFixed(1)}`);
      });
      flushSegment();
    });
    const labels = first.labels || [];
    if (labels.length) {
      const step = Math.max(1, Math.ceil(n / 7));
      for (let i = 0; i < n; i += step) {
        const px = (pl + (n <= 1 ? cw / 2 : i * cw / (n - 1))).toFixed(1);
        svg += `<text x="${px}" y="${h - 5}" text-anchor="middle" font-size="9" fill="var(--text-muted)">${esc(String(labels[i]||'').slice(0,8))}</text>`;
      }
    }
    return `<svg width="100%" viewBox="0 0 ${w} ${h}" style="display:block;overflow:visible" preserveAspectRatio="xMidYMid meet">${svg}</svg>`;
  }

  /* Stacked bar chart — buckets:[{label,categories:[{categoryName,amount}]}] colorMap:{name:color} */
  function svgStackedBarsChart(buckets, colorMap, w, h) {
    w = w || 560; h = h || 140;
    if (!buckets || !buckets.length) return '<p class="empty-state">No data</p>';
    const maxTotal = Math.max(...buckets.map(b => (b.categories||[]).reduce((s,c)=>s+Math.abs(c.amount||0),0)), 1);
    const count = buckets.length;
    const usableW = w - 40;
    const slotW = Math.floor(usableW / count);
    const barW = Math.max(4, slotW - 4);
    const chartH = h - 24;
    let rects = '';
    buckets.forEach((b, i) => {
      const x = 40 + i * slotW;
      let y = chartH;
      (b.categories||[]).forEach((cat, ci) => {
        const bh = Math.round((Math.abs(cat.amount||0) / maxTotal) * chartH);
        if (bh > 0) {
          const color = colorMap[cat.categoryName] || CHART_COLORS[ci % CHART_COLORS.length];
          y -= bh;
          rects += `<rect x="${x}" y="${y}" width="${barW}" height="${bh}" fill="${esc(color)}" opacity="0.85"><title>${esc(cat.categoryName)}: ${fmtRaw(Math.abs(cat.amount||0))}</title></rect>`;
        }
      });
      rects += `<text x="${(x+barW/2).toFixed(1)}" y="${h-4}" text-anchor="middle" font-size="9" fill="var(--text-muted)">${esc(String(b.label||'').slice(0,6))}</text>`;
    });
    return `<svg width="100%" viewBox="0 0 ${w} ${h}" style="overflow:visible;display:block" preserveAspectRatio="none">${rects}</svg>`;
  }

  /* Horizontal-slice treemap — items:[{categoryName,amount,percentage,colorHex}] */
  function svgTreemapChart(items, w, h) {
    w = w || 560; h = h || 180;
    if (!items || !items.length) return '<p class="empty-state">No data</p>';
    const sorted = [...items].filter(x=>(x.amount||0)>0).sort((a,b)=>(b.amount||0)-(a.amount||0));
    if (!sorted.length) return '<p class="empty-state">No data</p>';
    const total = sorted.reduce((s,x)=>s+(x.amount||0),0);
    let rects='', texts='', x=0;
    sorted.forEach((item, i) => {
      const pct = (item.amount||0) / total;
      const iw = Math.round(pct * w);
      if (iw < 1) return;
      const color = item.colorHex || CHART_COLORS[i % CHART_COLORS.length];
      rects += `<rect x="${x}" y="0" width="${iw}" height="${h}" fill="${esc(color)}" opacity="0.82" rx="2"><title>${esc(item.categoryName)}: ${fmtRaw(item.amount||0)} (${fmtRaw(item.percentage||pct*100,1)}%)</title></rect>`;
      if (iw > 44) {
        const maxChars = Math.max(1, Math.floor(iw/7));
        const label = item.categoryName.length > maxChars ? item.categoryName.slice(0,maxChars)+'…' : item.categoryName;
        texts += `<text x="${(x+iw/2).toFixed(1)}" y="${(h/2-5).toFixed(1)}" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">${esc(label)}</text>`;
        texts += `<text x="${(x+iw/2).toFixed(1)}" y="${(h/2+11).toFixed(1)}" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.88)">${fmtRaw(item.percentage||pct*100,1)}%</text>`;
      }
      x += iw;
    });
    return `<svg width="100%" viewBox="0 0 ${w} ${h}" style="display:block;border-radius:6px;overflow:hidden" preserveAspectRatio="none">${rects}${texts}</svg>`;
  }

  /* Filter badge — accepts FilterSummaryDto (from server) or local fs override object */
  function filterBadge(fs) {
    if (!fs) return '';
    const parts = [];
    const tl = fs.timelineType;
    if (tl && tl !== 'ALL_TIME') {
      const map = { MONTH:'This Month', YEAR:'This Year', TODAY:'Today', WEEK:'This Week', QUARTER:'This Quarter', HALF_YEAR:'Half Year', CUSTOM:'Custom', MONTHLY:'This Month', YEARLY:'This Year', WEEKLY:'This Week', LAST_24H:'Last 24h', LAST_7_DAYS:'Last 7 Days', LAST_30_DAYS:'Last 30 Days', LAST_12_WEEKS:'Last 12 Weeks', LAST_6_MONTHS:'Last 6 Months', LAST_1_YEAR:'Last Year', LAST_5_YEARS:'Last 5 Years' };
      parts.push(map[tl] || tl);
    }
    if (fs.transactionTypes && fs.transactionTypes.length) parts.push(fs.transactionTypes.join('/'));
    else if (fs.txType) parts.push(fs.txType);
    if (fs.accountIds && fs.accountIds.length) parts.push(`${fs.accountIds.length} acct${fs.accountIds.length>1?'s':''}`);
    if (fs.categoryIds && fs.categoryIds.length) parts.push(`${fs.categoryIds.length} cat${fs.categoryIds.length>1?'s':''}`);
    if (fs.currencies && fs.currencies.length) parts.push(fs.currencies.join('/'));
    if (fs.statuses && fs.statuses.length) parts.push(fs.statuses.join('/'));
    if (fs.paymentMethods && fs.paymentMethods.length) parts.push(fs.paymentMethods.join('/'));
    if (fs.tags && fs.tags.length) parts.push(fs.tags.map(t=>`#${t}`).join(' '));
    if (fs.queryNote) parts.push(`note:"${fs.queryNote}"`);
    if (fs.queryPayee) parts.push(`payee:"${fs.queryPayee}"`);
    if (fs.minAmount != null || fs.maxAmount != null) parts.push(`${fs.minAmount||0}–${fs.maxAmount||'∞'}`);
    return parts.length ? `<span class="filter-badge" title="Active filter">⚙️ ${esc(parts.join(' · '))}</span>` : '';
  }

  /* Wraps the pinned Accounts card — same filter button, no delete button, accent top border */
  function pinnedAccountsWrap(card, bodyHtml, payloadType) {
    const override = cardOverrides[card.cardId];
    const activeBadge = override ? filterBadge(override) : filterBadge(card.filterSummary);
    return `<div class="dash-card-pinned" data-card-id="${esc(card.cardId)}">
      <div class="dash-card-header">
        <span class="dash-card-title">${esc(card.title||'ACCOUNTS')}</span>
        <span class="pinned-label">Pinned</span>
        ${activeBadge}
        <div class="dash-card-actions">
          <button class="btn-icon" title="Filter" onclick="openCardFilterSheet('${esc(card.cardId)}','${esc(payloadType||'')}','${esc(card.cardType||'')}')">⚙️</button>
        </div>
      </div>
      <div class="dash-card-body" id="card-body-${esc(card.cardId)}">${bodyHtml}</div>
    </div>`;
  }

  /* Wraps a rendered dashboard card in the standard header+body shell */
  function dashCardWrap(card, bodyHtml, payloadType) {
    const override = cardOverrides[card.cardId];
    const activeBadge = override ? filterBadge(override) : filterBadge(card.filterSummary);
    return `<div class="dash-card" data-card-id="${esc(card.cardId)}">
      <div class="dash-card-header">
        <span class="dash-card-title">${esc(card.title||'')}</span>
        ${activeBadge}
        <div class="dash-card-actions">
          <button class="btn-icon" title="Filter" onclick="openCardFilterSheet('${esc(card.cardId)}','${esc(payloadType||'')}','${esc(card.cardType||'')}')">⚙️</button>
          <button class="btn-icon" title="Remove card" onclick="removeDashboardCard('${esc(card.cardId)}')">✕</button>
        </div>
      </div>
      <div class="dash-card-body" id="card-body-${esc(card.cardId)}">${bodyHtml}</div>
    </div>`;
  }

  /* Dispatch card by payload type — both initial render and refresh use the same body functions */
  function dispatchCardRender(card, d, payloadType) {
    const body = dispatchCardBody(card, d, payloadType);
    return dashCardWrap(card, body, payloadType);
  }

  /* Returns only the inner body HTML for a card — single source of truth used by both paths */
  function dispatchCardBody(card, d, payloadType) {
    switch (payloadType) {
      case 'NetWorth':              return renderNetWorthBody(d);
      case 'CashFlow':              return renderCashFlowBody(d);
      case 'CurrencyBalances':      return renderCurrencyBalancesBody(d);
      case 'Accounts':              return renderAccountsBody(d, d.baseCurrency||'');
      case 'Budgets':               return renderBudgetBody(d);
      case 'PlannedPayments':       return renderPlannedPaymentsBody(d);
      case 'Loans':                 return renderLoansBody(d);
      case 'RecentActivities':      return renderRecentActivitiesBody(d.transactions||[], d.total||0);
      case 'CategoryBreakdown':     return card.cardType==='CATEGORY_TREEMAP' ? renderCategoryTreemapBody(d.items||[], d.displayCurrency||'') : renderCategoryPieBody(d.items||[], d.displayCurrency||'');
      case 'CashFlowComparison':    { if (!window.cachedCfcData) window.cachedCfcData={}; window.cachedCfcData[card.cardId]=d; return renderCashFlowComparisonBody(d, card.cardId); }
      case 'IncomeExpenseBar':      return renderIncomeExpenseBody(d.buckets||[], d.granularity||'MONTH', d.baseCurrency, d.todayBucketIndex);
      case 'CategorySpendingTrend': return renderCategorySpendingTrendBody(d);
      case 'TagUpSetPlot':          return renderTagUpSetPlotBody(d, d.baseCurrency||'');
      case 'Error':                 return `<div class="alert alert-error">${esc(d.message||'Error loading card.')}</div>`;
      default:                      return `<p class="empty-state">Unknown card type: ${esc(d.type||card.cardType||'')}</p>`;
    }
  }

  /* ── Category + account select options ───────────────── */
  function catOptions(includeBlank) {
    let o = includeBlank ? '<option value="">— None —</option>' : '';
    cachedCategories.forEach(c => { o += `<option value="${esc(c.id)}">${esc(c.name)}</option>`; });
    return o;
  }
  function accOptions() {
    let o = '<option value="">— Select account —</option>';
    cachedAccounts.forEach(a => { o += `<option value="${esc(a.id)}">${esc(a.name)} (${esc(a.currency)})</option>`; });
    return o;
  }

  /* ── Pagination helper (Records page) ─────────────────── */
  window.navPage = function (page) {
    const params = new URLSearchParams(location.hash.split('?')[1] || '');
    params.set('page', page);
    location.hash = '#/records?' + params.toString();
  };

  /* ══════════════════════════════════════════════════════
     PAGE: Dashboard
  ══════════════════════════════════════════════════════ */
  async function renderDashboard() {
    showSpinner();
    try {
      const json = await apiFetch('/api/dashboard');
      if (!json.success) { showError('Failed to load dashboard.'); return; }
      const cards = (Array.isArray(json.data) ? json.data : [])
        .filter(c => c.isEnabled !== false)
        .sort((a, b) => (a.order || 0) - (b.order || 0));

      /* Hydrate cardOverrides from server-side filter state so filter sheets pre-populate */
      cards.forEach(card => {
        const fs = card.filterSummary;
        if (fs && !cardOverrides[card.cardId]) {
          cardOverrides[card.cardId] = {
            timelineType:   fs.timelineType   || 'ALL_TIME',
            customFrom: fs.dateFrom ? new Date(fs.dateFrom).toISOString().slice(0,10) : null,
            customTo:   fs.dateTo   ? new Date(fs.dateTo).toISOString().slice(0,10)   : null,
            accountIds:     fs.accountIds      || [],
            categoryIds:    fs.categoryIds     || [],
            txType:         (fs.transactionTypes||[])[0] || '',
            currencies:     fs.currencies      || [],
            statuses:       fs.statuses        || [],
            paymentMethods: fs.paymentMethods  || [],
            tags:           fs.tags            || [],
            queryNote:      fs.queryNote       || '',
            queryPayee:     fs.queryPayee      || '',
            minAmount:      fs.minAmount       ?? null,
            maxAmount:      fs.maxAmount       ?? null,
            excludeFuture:  fs.excludeFuture   !== false,
          };
        }
      });

      /* Pin the lowest-order Accounts card as a fixed header, matching Android DashboardScreen */
      const pinnedCard = cards.find(c => c.cardType === 'ACCOUNTS');
      const regularCards = pinnedCard ? cards.filter(c => c.cardId !== pinnedCard.cardId) : cards;

      let html = `<div class="page-header">
        <h2 class="section-title">Dashboard</h2>
        <button class="btn btn-ghost btn-sm" onclick="openManageCards()">⚙️ Manage Cards</button>
      </div>`;

      if (pinnedCard) {
        const d = pinnedCard.data || {};
        const payloadType = d.type ? d.type.split('.').pop() : 'Accounts';
        html += pinnedAccountsWrap(pinnedCard, dispatchCardBody(pinnedCard, d, payloadType), payloadType);
      }

      if (!regularCards.length && !pinnedCard) {
        html += '<div class="alert alert-warn">No dashboard cards are enabled. Click <strong>Manage Cards</strong> to add some.</div>';
      } else {
        regularCards.forEach(card => {
          const d = card.data || {};
          /* kotlinx.serialization uses fully-qualified class name as discriminator when no @SerialName is set */
          const payloadType = d.type ? d.type.split('.').pop() : '';
          html += dispatchCardRender(card, d, payloadType);
        });
      }
      setContent(html);
    } catch (e) { if (e.message !== 'Session expired') showError('Error loading dashboard.'); }
  }

  /* ── Individual dashboard card renderers ─────────────── */

  /* ── Refresh a single card's body after filter change ────── */
  async function refreshCardContent(cardId, payloadType, cardType) {
    const el = document.getElementById('card-body-' + cardId);
    if (!el) return;
    el.innerHTML = '<div class="loading-wrap"><div class="spinner" style="width:20px;height:20px;border-width:2px;margin:20px auto"></div></div>';
    try {
      const resp = await apiFetch('/api/dashboard');
      const cards = resp.success ? (resp.data || []) : [];
      const card = cards.find(c => c.cardId === cardId);
      if (!card) { el.innerHTML = '<div class="alert alert-warn" style="font-size:0.85rem">Card not found in dashboard.</div>'; return; }
      const d  = card.data;
      const pt = d.type ? d.type.split('.').pop() : payloadType;
      el.innerHTML = dispatchCardBody(card, d, pt);
      /* Also update filter badge to reflect server-side filter */
      const badgeEl = document.querySelector(`[data-card-id="${cardId}"] .dash-card-header .filter-badge`);
      const newBadge = filterBadge(card.filterSummary);
      if (badgeEl) { badgeEl.outerHTML = newBadge || ''; }
      else if (newBadge) { const titleEl = document.querySelector(`[data-card-id="${cardId}"] .dash-card-title`); if (titleEl) titleEl.insertAdjacentHTML('afterend', newBadge); }
    } catch (e) {
      if (e.message !== 'Session expired') el.innerHTML = '<div class="alert alert-error">Error refreshing card.</div>';
    }
  }

  /* ══════════════════════════════════════════════════════
     CARD BODY RENDERERS — single source of truth for each card type.
     All functions return inner HTML only (no dashCardWrap).
     Used by both initial load (via dispatchCardRender) and filter refresh (via dispatchCardBody).
  ══════════════════════════════════════════════════════ */

  function renderNetWorthBody(d) {
    const cur = d.currency || cachedSettings.baseCurrency || 'USD';
    const nwCls = (d.netWorth||0) >= 0 ? 'positive' : 'negative';
    const cfCls = (d.cashFlow||0) >= 0 ? 'positive' : 'negative';
    const hasTransfer = d.transfer != null && d.transfer !== 0;
    let html = `<div class="card-grid" style="margin-bottom:0">
      <div class="stat-card"><div class="stat-label">Net Worth</div><div class="stat-value ${nwCls}">${fmt(d.netWorth||0,cur)}</div></div>
      <div class="stat-card"><div class="stat-label">Income</div><div class="stat-value positive">+${fmt(d.income||0,cur)}</div></div>
      <div class="stat-card"><div class="stat-label">Expenses</div><div class="stat-value negative">−${fmt(d.expense||0,cur)}</div></div>`;
    if (hasTransfer) html += `<div class="stat-card"><div class="stat-label">Transfers</div><div class="stat-value">${fmt(d.transfer||0,cur)}</div></div>`;
    html += `<div class="stat-card"><div class="stat-label">Cash Flow</div><div class="stat-value ${cfCls}">${(d.cashFlow||0)>=0?'+':'−'}${fmt(Math.abs(d.cashFlow||0),cur)}</div></div>`;
    if (d.previousNetWorth != null && d.previousNetWorth !== 0) {
      const delta = (d.netWorth||0) - d.previousNetWorth;
      const pct = (delta / Math.abs(d.previousNetWorth) * 100).toFixed(1);
      const pctCls = delta >= 0 ? 'positive' : 'negative';
      html += `<div class="stat-card"><div class="stat-label">vs Previous</div><div class="stat-value ${pctCls}">${delta>=0?'+':'−'}${Math.abs(pct)}%</div></div>`;
    }
    return html + '</div>';
  }

  function renderCashFlowBody(d) {
    const cur = d.currency || cachedSettings.baseCurrency || 'USD';
    const netCls = (d.net||0) >= 0 ? 'positive' : 'negative';
    const hasTransfer = d.transfer != null && d.transfer !== 0;
    let html = `<div class="card-grid" style="margin-bottom:0">
      <div class="stat-card"><div class="stat-label">Income</div><div class="stat-value positive">+${fmt(d.income||0,cur)}</div></div>
      <div class="stat-card"><div class="stat-label">Expense</div><div class="stat-value negative">−${fmt(d.expense||0,cur)}</div></div>`;
    if (hasTransfer) html += `<div class="stat-card"><div class="stat-label">Transfers</div><div class="stat-value">${fmt(d.transfer||0,cur)}</div></div>`;
    html += `<div class="stat-card"><div class="stat-label">Net</div><div class="stat-value ${netCls}">${(d.net||0)>=0?'+':'−'}${fmt(Math.abs(d.net||0),cur)}</div></div>`;
    return html + '</div>';
  }

  function renderCurrencyBalancesBody(d) {
    const items = d.items || [];
    const baseCur = d.baseCurrency || cachedSettings.baseCurrency || '';
    if (!items.length) return '<p class="empty-state">No currency balances.</p>';
    let body = '<div class="currency-grid">';
    items.forEach(item => {
      const cls = (item.balance||0) >= 0 ? 'amount-income' : 'amount-expense';
      body += `<div class="currency-item">
        <div class="currency-code">${esc(item.currency)}</div>
        <div class="currency-balance ${cls}">${fmt(item.balance||0, item.currency)}</div>
        ${baseCur && item.currency !== baseCur && item.balanceInBase != null
          ? `<div class="currency-base">≈ ${fmt(item.balanceInBase, baseCur)}</div>` : ''}
      </div>`;
    });
    return body + '</div>';
  }

  function renderAccountsBody(d, baseCur) {
    const accounts = d.accounts || [];
    const bCur = baseCur || cachedSettings.baseCurrency || '';
    if (!accounts.length) return '<p class="empty-state">No accounts.</p>';
    let body = '<div class="card-grid" style="margin-bottom:0">';
    accounts.forEach(acc => {
      const cls = (acc.balance||0) >= 0 ? 'positive' : 'negative';
      const hasTransfer = acc.transfer != null && acc.transfer !== 0;
      const showBase = bCur && acc.currency !== bCur && acc.balanceInBase != null;
      body += `<div class="stat-card">
        <div style="font-weight:600;margin-bottom:6px">${esc(acc.name)}</div>
        <div class="stat-value ${cls}" style="font-size:1.1rem">${fmt(acc.balance||0,acc.currency)}</div>
        ${showBase ? `<div style="font-size:0.78rem;color:var(--text-muted);margin-top:2px">≈ ${fmt(acc.balanceInBase,bCur)}</div>` : ''}
        ${acc.income != null ? `<div style="font-size:0.78rem;margin-top:6px;display:flex;gap:10px;flex-wrap:wrap">
          <span class="amount-income">+${fmt(acc.income||0,acc.currency)}</span>
          <span class="amount-expense">−${fmt(acc.expense||0,acc.currency)}</span>
          ${hasTransfer?`<span style="color:var(--text-muted)">↔${fmt(Math.abs(acc.transfer||0),acc.currency)}</span>`:''}
        </div>` : ''}
        <div style="margin-top:8px"><a class="btn btn-ghost btn-sm" href="#/records?accountId=${esc(acc.id)}&accountName=${encodeURIComponent(acc.name)}">Records</a></div>

  function renderBudgetBody(d) {
    const items = d.items || [];
    if (!items.length) return '<p class="empty-state">No budgets.</p>';
    let body = '';
    items.forEach(b => {
      const pct = Math.min(100, Math.round(b.percentage||0));
      const alertCls = b.alertLevel==='EXCEEDED'?'progress-red':b.alertLevel==='WARNING'?'progress-orange':'progress-green';
      const archived = b.isArchived ? '<span class="badge" style="background:var(--border);color:var(--text-muted);font-size:0.68rem">Archived</span>' : '';
      const statusBadge = b.alertLevel==='EXCEEDED'
        ? '<span class="badge" style="background:var(--danger);color:#fff;font-size:0.65rem;margin-left:4px">OVER BUDGET</span>'
        : b.alertLevel==='WARNING'
        ? '<span class="badge" style="background:var(--warning);color:#fff;font-size:0.65rem;margin-left:4px">WARNING</span>'
        : '';
      body += `<div style="margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;gap:8px">
          <span style="font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.name)} ${archived}${statusBadge}</span>
          <span style="font-size:0.78rem;color:var(--text-muted);white-space:nowrap">${esc(b.period||'')}</span>
          <span style="font-weight:700;white-space:nowrap;color:${b.alertLevel==='EXCEEDED'?'var(--danger)':b.alertLevel==='WARNING'?'var(--warning)':'var(--success)'}">${pct}%</span>

          <span>Spent: ${fmt(b.spent||0,b.currency)}</span>
          <span>Remaining: ${fmt(b.remaining||0,b.currency)}</span>
          <span>Limit: ${fmt(b.limitAmount||0,b.currency)}</span>
        </div>
      </div>`;

    return body;
  }

  function renderLoansBody(d) {
    const items = d.items||[];
    if (!items.length) return '<p class="empty-state">No loans.</p>';
    let body = '<div class="card-grid" style="margin-bottom:0">';
    items.forEach(loan => {
      const rp = Math.min(100, Math.round(((loan.totalPaid||0)/(loan.principalAmount||1))*100));
      const tb = loan.loanType==='LENT'?'badge-lent':'badge-borrowed';
      const sb = loan.status==='SETTLED'?'badge-settled':'badge-active';
      body += `<div class="stat-card"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px"><div><div style="font-weight:700">${esc(loan.name)}</div><div style="font-size:0.78rem;color:var(--text-muted)">${esc(loan.lenderOrBorrowerName||'')}</div></div><div style="display:flex;flex-direction:column;gap:3px;align-items:flex-end"><span class="badge ${tb}">${esc(loan.loanType)}</span><span class="badge ${sb}">${esc(loan.status)}</span></div></div><div style="font-weight:700;margin-bottom:6px">${fmt(loan.principalAmount||0,loan.currency)}</div>${progressBar(rp,rp>=100?'progress-green':'progress-orange')}<div style="display:flex;justify-content:space-between;font-size:0.78rem;color:var(--text-muted);margin-top:3px"><span>Paid: ${fmt(loan.totalPaid||0,loan.currency)}</span><span>Left: ${fmt(loan.remainingBalance||0,loan.currency)}</span></div>${loan.interestAccrued?`<div style="font-size:0.78rem;color:var(--warning);margin-top:2px">Interest: ${fmt(loan.interestAccrued,loan.currency)}</div>`:''}</div>`;
    });
    return body + '</div>';
  }

  function renderCategoryPieBody(items, displayCur) {
    if (!items.length) return '<p class="empty-state">No category data.</p>';
    const cur = displayCur || cachedSettings.baseCurrency || '';
    const top10 = items.slice(0,10); const rest = items.slice(10);

    const cs = slices.map((c,i)=>({ label:c.categoryName, value:c.amount, color:c.colorHex||CHART_COLORS[i%CHART_COLORS.length] }));
    let leg = '<div class="chart-legend" style="flex:1">';
    slices.forEach((c,i)=>{ leg += `<div class="legend-item"><div class="legend-dot" style="background:${esc(c.colorHex||CHART_COLORS[i%CHART_COLORS.length])}"></div><span>${esc(c.categoryName)}</span><span style="color:var(--text-muted);margin-left:4px">${fmt(c.amount||0,cur)} (${fmtRaw(c.percentage||0,1)}%)</span>${c.transactionCount?`<span style="color:var(--text-muted);font-size:0.72rem;margin-left:4px">${c.transactionCount} txns</span>`:''}</div>`; });
    leg += '</div>';
    return `<div style="display:flex;flex-wrap:wrap;gap:20px;align-items:center">${svgDonut(cs,160)}${leg}</div>`;

  function renderCategoryTreemapBody(items, displayCur) {

    const tm = items.map((c,i)=>({ categoryName:c.categoryName, amount:c.amount, percentage:c.percentage, colorHex:c.colorHex||CHART_COLORS[i%CHART_COLORS.length] }));

  function renderIncomeExpenseBody(pts, gran, baseCur, todayIdx) {
    if (!pts.length) return '<p class="empty-state">No data.</p>';
    const points = pts.map(b=>({ label:b.label, income:b.income||0, expense:b.expense||0 }));
    const hasTodayMarker = todayIdx != null && todayIdx >= 0 && todayIdx < points.length;
    const totalIncome  = pts.reduce((s,p)=>s+(p.income||0),0);
    const totalExpense = pts.reduce((s,p)=>s+(p.expense||0),0);
    const netTotal = totalIncome - totalExpense;
    const netCls   = netTotal >= 0 ? 'positive' : 'negative';
    const summary = `<div style="display:flex;gap:16px;margin-bottom:8px;font-size:0.85rem;flex-wrap:wrap">
      <span class="amount-income">Income: +${fmt(totalIncome,baseCur)}</span>
      <span class="amount-expense">Expense: −${fmt(totalExpense,baseCur)}</span>
      <span class="${netCls}">Net: ${netTotal>=0?'+':'−'}${fmt(Math.abs(netTotal),baseCur)}</span>
    </div>`;
    return `${summary}${svgBars(points,560,140,true,hasTodayMarker?todayIdx:-1)}<div class="chart-legend" style="margin-top:8px">
      <div class="legend-item"><div class="legend-dot" style="background:var(--success)"></div><span>Income</span></div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--danger)"></div><span>Expense</span></div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--primary);border:1px dashed var(--primary);background:none;width:14px;height:2px;border-radius:0;border-top:2px dashed var(--primary)"></div><span>Net</span></div>
      <span style="font-size:0.78rem;color:var(--text-muted);margin-left:auto">${esc(String(gran||'').toLowerCase())}${baseCur?' · '+esc(baseCur):''}</span>
    </div>`;
  }

  function renderRecentActivitiesBody(txs, total) {
    if (!txs.length) return '<p class="empty-state">No transactions found.</p>';
    let body = `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Title</th><th>Category</th><th>Account</th><th>Tags</th><th style="text-align:right">Amount</th></tr></thead><tbody>`;
    txs.forEach(tx => {
      const amtCls=tx.type==='INCOME'?'amount-income':tx.type==='EXPENSE'?'amount-expense':'';
      const sign=tx.type==='EXPENSE'?'−':tx.type==='INCOME'?'+':'';
      const bdg=tx.type==='INCOME'?'badge-income':tx.type==='EXPENSE'?'badge-expense':'badge-transfer';
      const tags=tx.tags&&tx.tags.length?tx.tags.map(t=>`<span class="badge" style="background:var(--surface2);color:var(--text);font-size:0.68rem">${esc(t)}</span>`).join(' '):'—';
      body+=`<tr><td style="white-space:nowrap">${fmtDate(tx.date)}</td><td><span class="badge ${bdg}" style="font-size:0.68rem;margin-right:4px">${esc(tx.type)}</span>${esc(tx.title)}${tx.note?`<br><small style="color:var(--text-muted)">${esc(tx.note)}</small>`:''}</td><td>${tx.categoryName?esc(tx.categoryName):'<span style="color:var(--text-muted)">—</span>'}</td><td>${esc(tx.accountName||'—')}</td><td>${tags}</td><td style="text-align:right" class="${amtCls}">${sign}${fmt(Math.abs(tx.amount||0),tx.currency)}</td></tr>`;
    });
