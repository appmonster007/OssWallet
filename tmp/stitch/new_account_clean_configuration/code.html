<!DOCTYPE html>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #f7fafa;
            color: #181c1d;
            font-family: 'Inter', sans-serif;
        }
        .editorial-shadow {
            box-shadow: 0px 24px 48px rgba(0, 77, 95, 0.08);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface min-h-screen">
<!-- TopAppBar -->
<header class="bg-[#f7fafa] flex justify-between items-center w-full px-6 py-4 max-w-full sticky top-0 z-40 bg-gradient-to-b from-[#f7fafa] to-[#f1f4f4]">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary p-2 hover:bg-[#f1f4f4] transition-colors rounded-full cursor-pointer" style="">arrow_back</span>
<h1 class="font-['Manrope'] font-bold text-[#004d5f] text-xl tracking-tight" style="">Aeon Ledger</h1>
</div>
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-[#3f484c] p-2 hover:bg-[#f1f4f4] transition-colors rounded-full cursor-pointer" data-icon="search" style="">search</span>
<div class="w-10 h-10 rounded-full bg-secondary-fixed flex items-center justify-center overflow-hidden border border-outline-variant/20">
<img alt="User profile avatar" class="" data-alt="close-up portrait of a professional man with a kind expression, soft studio lighting, neutral background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCO6UqiIK87O8zVVsP3nZXfjhgdoCaasvjnTLJeLqZVUyPx2MwuncINSc8Mp3_5RZIbhGBLwoJBibnZxsmZw5MbSYkQbWdOQOk70f556thUVQNIYXpjL4ImTPq1A0C5EvXi9f19o94QjH0rBvZGj1gxQ1BkTZMiNQLVVTH9v_mhguORDAYPauO25s5gNMQ13WAkiks24m__0kgonZxzjRzc3_5f-IPjE-2DuDQYSNFfdd8Q94VSEyr5wBQw0Bkb3kjGInuir6dIlIz5" style=""/>
</div>
</div>
</header>
<main class="max-w-6xl mx-auto px-6 pt-12">
<div class="grid grid-cols-1 lg:grid-cols-12 gap-12">
<!-- Configuration Flow -->
<div class="space-y-12">
<section>
<div class="mb-8">
<span class="font-label text-label-sm uppercase tracking-wider text-on-surface-variant font-medium" style="">Configuration</span>
<h2 class="font-headline text-3xl font-bold text-on-surface mt-2" style="">New Account Identity</h2>
</div>
<!-- Step 1: Account Identity -->
<div class="space-y-6">
<div class="space-y-2">
<label class="font-label text-sm font-medium text-on-surface-variant px-1" style="">Account Name</label>
<input class="w-full bg-surface-container-high border-none rounded-xl px-6 py-4 focus:ring-2 focus:ring-primary/20 focus:bg-primary-fixed transition-all placeholder:text-outline" placeholder="e.g. Global Treasury" type="text"/>
</div>
<div class="space-y-2">
<label class="font-label text-sm font-medium text-on-surface-variant px-1" style="">Structure Type</label>
<div class="relative">
<select class="w-full bg-surface-container-high border-none rounded-xl px-6 py-4 appearance-none focus:ring-2 focus:ring-primary/20 transition-all">
<option>Investment Portfolio</option>
<option>Operational Checking</option>
<option>Digital Assets Vault</option>
<option>Cash Reserve</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant" style="">expand_more</span>
</div>
</div>
</div>
</section>
<!-- Step 2: Allowed Currencies -->
<section class="p-8 bg-surface-container-low rounded-xl">
<div class="flex items-center justify-between mb-6">
<h3 class="font-headline text-xl font-semibold text-on-surface" style="">Allowed Currencies</h3>
</div>
<div class="space-y-4">
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline" style="">search</span>
<input class="w-full bg-surface-container-lowest border-none rounded-xl pl-12 pr-6 py-4 focus:ring-2 focus:ring-primary/20 transition-all" placeholder="Search ISO codes..." type="text"/>
</div>
<div class="flex flex-wrap gap-2">
<div class="flex items-center gap-2 bg-primary text-white px-4 py-2 rounded-full text-sm font-medium editorial-shadow">
<span class="" style="">USD</span>
<span class="material-symbols-outlined text-sm cursor-pointer" style="">close</span>
</div>
<div class="flex items-center gap-2 bg-primary text-white px-4 py-2 rounded-full text-sm font-medium editorial-shadow">
<span class="" style="">EUR</span>
<span class="material-symbols-outlined text-sm cursor-pointer" style="">close</span>
</div>
<div class="flex items-center gap-2 bg-primary text-white px-4 py-2 rounded-full text-sm font-medium editorial-shadow">
<span class="" style="">GBP</span>
<span class="material-symbols-outlined text-sm cursor-pointer" style="">close</span>
</div>
<div class="flex items-center gap-2 bg-surface-container-highest text-on-surface-variant px-4 py-2 rounded-full text-sm font-medium hover:bg-outline-variant/30 cursor-pointer transition-colors">
<span class="" style="">JPY</span>
<span class="material-symbols-outlined text-sm" style="">add</span>
</div>
<div class="flex items-center gap-2 bg-surface-container-highest text-on-surface-variant px-4 py-2 rounded-full text-sm font-medium hover:bg-outline-variant/30 cursor-pointer transition-colors">
<span class="" style="">CHF</span>
<span class="material-symbols-outlined text-sm" style="">add</span>
</div>
</div>
</div>
</section>
<!-- Step 3: Visual Identity -->
<section>
<h3 class="font-headline text-xl font-semibold text-on-surface mb-6" style="">Visual Identity</h3>
<div class="space-y-8">
<!-- Search and Icon Selection -->
<div class="space-y-4">
<div class="flex items-center justify-between px-1">
<label class="font-label text-sm font-medium text-on-surface-variant">Identifier Icon</label>
<span class="text-[10px] font-bold uppercase tracking-widest text-outline-variant">Library of 2,000+ icons &amp; emojis</span>
</div>
<div class="relative mb-4">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-sm">search</span>
<input class="w-full bg-surface-container-high border-none rounded-xl pl-10 pr-6 py-3 text-sm focus:ring-2 focus:ring-primary/20 transition-all" placeholder="Search icons or emojis (e.g. 'bank', '🚀')..." type="text"/>
</div>
<div class="grid grid-cols-6 sm:grid-cols-8 gap-2 p-4 bg-surface-container-low rounded-xl border border-outline-variant/10">
<!-- Selected Icon -->
<button class="aspect-square flex items-center justify-center bg-primary text-white rounded-lg shadow-sm">
<span class="material-symbols-outlined">account_balance</span>
</button>
<!-- Suggestions -->
<button class="aspect-square flex items-center justify-center bg-surface-container-highest text-on-surface-variant rounded-lg hover:bg-outline-variant/30 transition-colors">
<span class="material-symbols-outlined text-xl">account_balance_wallet</span>
</button>
<button class="aspect-square flex items-center justify-center bg-surface-container-highest text-on-surface-variant rounded-lg hover:bg-outline-variant/30 transition-colors">
<span class="material-symbols-outlined text-xl">rocket_launch</span>
</button>
<button class="aspect-square flex items-center justify-center bg-surface-container-highest text-on-surface-variant rounded-lg hover:bg-outline-variant/30 transition-colors">
<span class="material-symbols-outlined text-xl">monitoring</span>
</button>
<button class="aspect-square flex items-center justify-center bg-surface-container-highest text-on-surface-variant rounded-lg hover:bg-outline-variant/30 transition-colors">
<span class="material-symbols-outlined text-xl">payments</span>
</button>
<button class="aspect-square flex items-center justify-center bg-surface-container-highest text-on-surface-variant rounded-lg hover:bg-outline-variant/30 transition-colors">
<span class="material-symbols-outlined text-xl">savings</span>
</button>
<button class="aspect-square flex items-center justify-center bg-surface-container-highest text-on-surface-variant rounded-lg hover:bg-outline-variant/30 transition-colors">
<span class="text-xl">💰</span>
</button>
<button class="aspect-square flex items-center justify-center bg-surface-container-highest text-on-surface-variant rounded-lg hover:bg-outline-variant/30 transition-colors">
<span class="text-xl">🏦</span>
</button>
</div>
</div>
<!-- Accent Color Selection -->
<div class="space-y-4">
<label class="font-label text-sm font-medium text-on-surface-variant px-1">Accent Brand Color</label>
<div class="flex items-center gap-3">
<div class="w-12 h-12 rounded-full bg-primary editorial-shadow border-2 border-white flex-shrink-0"></div>
<div class="relative flex-1">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant font-mono text-xs">HEX</span>
<input class="w-full bg-surface-container-high border-none rounded-xl pl-12 pr-6 py-3 font-mono text-sm focus:ring-2 focus:ring-primary/20" type="text" value="#004D5F"/>
</div>
</div>
</div>
</div>
</section>
<!-- Final Action -->
<div class="pt-8">
<button class="w-full bg-primary text-white font-headline text-lg font-bold py-6 rounded-xl editorial-shadow hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-3" style="">
<span class="" style="">Save Account</span>
<span class="material-symbols-outlined" style="">auto_awesome</span>
</button>
</div>
</div>
<!-- Preview Sidebar -->
</div>
</main>
<!-- BottomNavBar (Visible on Mobile) -->
</body></html>
